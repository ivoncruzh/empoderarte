<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EmpoderArte | Sistema Integral</title>
<style>
:root{--p:#6b3fa0;--g:#d4a84f;--bg:#f7f4fa;--ink:#30253b;--mut:#756b7d;--ok:#27844b;--bad:#bd3d49;--warn:#a97818}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:#2d2138;color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:3px;position:fixed;inset:0 auto 0 0;width:250px;overflow:auto}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:25px;color:#fff;padding:8px 10px 18px;border-bottom:1px solid #ffffff18;margin-bottom:8px}.brand small{display:block;font-size:10px;font-weight:500;color:#d9cce4}.nav{border:0;background:transparent;color:#e8dff0;text-align:left;padding:10px 11px;border-radius:9px;font-weight:700}.nav:hover,.nav.active{background:#ffffff16;color:#fff}.nav.director-only{display:none}.main{padding:25px;min-width:0;margin-left:250px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:26px}.top-right{display:flex;gap:8px;align-items:center}.top-right input{width:320px}.cards{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:14px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 6px 25px #2d21380d}.metric{font-size:28px;font-weight:900;margin-top:5px}.muted{color:var(--mut);font-size:13px}.section{margin-top:18px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.sectionhead h2,.sectionhead h3{margin:0}.tablewrap{overflow:auto;background:#fff;border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px;border-bottom:1px solid #eee7f0;text-align:left}.table th{font-size:12px;color:var(--mut);text-transform:uppercase}.status{display:inline-block;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800}.ok{background:#e8f7ed;color:var(--ok)}.bad{background:#fde9eb;color:var(--bad)}.warn{background:#fff5dc;color:var(--warn)}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#f0ebf5}.grid2,.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:9px 13px;font-weight:700}.primary{background:var(--p);color:white}.gold{background:var(--g);color:#2f2415}.light{background:#f0ebf5;color:var(--ink)}.danger{background:#fde7e9;color:#9e2835}.notice{padding:12px;border-radius:10px;background:#faf7fc;border:1px solid #e6ddec}.empty{text-align:center;padding:30px;color:var(--mut)}label{display:block;font-size:13px;font-weight:700;margin:9px 0 5px}input,select,textarea{width:100%;padding:10px 11px;border:1px solid #ddd3e6;border-radius:10px;background:#fff;color:var(--ink)}textarea{min-height:90px}.modal{position:fixed;inset:0;background:#2d213899;display:grid;place-items:center;padding:18px;z-index:50}.modalbox{background:#fff;border-radius:18px;padding:20px;width:min(850px,96vw);max-height:92vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0}.qr{width:180px;height:180px;background:#fff;border:1px dashed #bbb;display:grid;place-items:center;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee7f0}.toast{position:fixed;right:20px;bottom:20px;background:#2d2138;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:100}.small{font-size:12px}.subcard{background:#faf8fc;border:1px solid #eee7f0;border-radius:12px;padding:14px}.topbadge{padding:9px 12px;border-radius:10px;background:#fff0c9;color:#6a4b00;font-weight:800}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:800px){.app{display:block}.side{position:static;width:100%;height:auto}.main{margin:0;padding:15px}.top{display:block}.top-right{margin-top:10px}.top-right input{width:100%}.grid2,.formgrid{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}@media(max-width:520px){.cards{grid-template-columns:1fr}}
</style></head><body>
<section id="login" class="modal" style="background:linear-gradient(135deg,#f7efff,#fff9ef)"><div class="modalbox" style="width:min(430px,95vw);text-align:center"><div style="font-size:34px;font-weight:900;color:var(--p)">EmpoderArte</div><p class="muted">Sistema Integral de Gestión · Escuela de Danza</p><label style="text-align:left">Correo</label><input id="email" value="director@empoderarte.local"><label style="text-align:left">Contraseña</label><input id="password" type="password" value="empoderarte"><button class="btn primary" style="width:100%;margin-top:15px" onclick="login()">🚀 Entrar al sistema</button><p class="small muted">Versión integral · datos en PostgreSQL</p></div></section>
<section id="app" class="app hidden"><aside class="side"><div class="brand"><span>♛</span><div>EmpoderArte<small>Escuela de Danza</small></div></div>
<button class="nav active" data-v="dashboard">🏠 Dashboard</button><button class="nav" data-v="students">👩‍🎓 Alumnos</button><button class="nav" data-v="attendanceAlumnos">✓ Asistencia alumnos</button><button class="nav" data-v="teachers">👩‍🏫 Maestros</button><button class="nav director-only" data-v="personal">👥 Personal</button><button class="nav director-only" data-v="payroll">💰 Nómina</button><button class="nav" data-v="reception">▣ Recepción</button><button class="nav" data-v="monthly">◷ Mensualidades</button><button class="nav" data-v="lockers">▣ Lockers</button><button class="nav" data-v="payments">$ Pagos</button><button class="nav" data-v="promotions">✦ Promociones</button><button class="nav" data-v="benefits">★ Beneficios</button><button class="nav" data-v="credential">▤ Credenciales QR</button><button class="nav" data-v="reports">▥ Reportes</button><button class="nav" data-v="alerts">🔔 Vencimientos</button><button class="nav director-only" data-v="users">♟ Usuarios</button><button class="nav director-only" data-v="audit">☷ Bitácora</button><button class="nav director-only" data-v="trash">⌫ Papelera</button><button class="nav director-only" data-v="settings">⚙ Configuración</button>
<div style="margin-top:auto;padding-top:15px"><div id="userBadge" class="small"></div><button class="nav" onclick="logout()">↪ Cerrar sesión</button></div></aside>
<main class="main"><div class="top"><div><div class="muted">EMPODERARTE</div><h1 id="title">Dashboard</h1></div><div class="top-right"><input id="globalSearch" placeholder="Buscar alumno, matrícula o teléfono..." oninput="globalSearch(this.value)"><button class="btn gold" onclick="view('credential')">📷 QR</button><span id="clock" class="topbadge"></span></div></div><div id="content"></div></main></section><div id="toast" class="toast"></div><div id="modalHost"></div>
<script>
let token=localStorage.emp_token||'',user=JSON.parse(localStorage.emp_user||'null');const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};const r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Error de servidor');return d}
function toast(x){$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}
function modal(title,body,action,fn){$('modalHost').innerHTML=`<div class="modal"><div class="modalbox"><div class="modalhead"><h2>${title}</h2><button class="btn light" onclick="closeModal()">×</button></div>${body}<div class="actions" style="margin-top:16px"><button class="btn primary" id="modalGo">${action}</button><button class="btn light" onclick="closeModal()">Cancelar</button></div></div></div>`;$('modalGo').onclick=async()=>{try{await fn()}catch(e){alert(e.message)}}}
function closeModal(){$('modalHost').innerHTML=''}
async function login(){try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})}),d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;user=d.user;localStorage.emp_token=token;localStorage.emp_user=JSON.stringify(user);boot()}catch(e){alert(e.message)}}
function logout(){localStorage.removeItem('emp_token');localStorage.removeItem('emp_user');location.reload()}
function boot(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('userBadge').textContent='👤 '+user.name+' · '+user.role;document.querySelectorAll('.director-only').forEach(x=>x.style.display=user.role==='director'?'block':'none');view(user.role==='director'?'dashboard':'reception')}
if(token&&user)boot();setInterval(()=>{$('clock').textContent=new Date().toLocaleString('es-MX')},1000);document.querySelectorAll('.nav[data-v]').forEach(b=>b.onclick=()=>view(b.dataset.v));
const titles={dashboard:'Dashboard',students:'Alumnos',attendanceAlumnos:'Asistencia alumnos',teachers:'Maestros',personal:'Personal',payroll:'Nómina',reception:'Recepción',monthly:'Mensualidades',lockers:'Lockers',payments:'Pagos',promotions:'Promociones',benefits:'Beneficios',credential:'Credenciales QR',reports:'Reportes',alerts:'Vencimientos',users:'Usuarios',audit:'Bitácora',trash:'Papelera',settings:'Configuración'};
async function view(v){if(['personal','payroll','users','audit','trash','settings'].includes(v)&&user?.role!=='director'){alert('Esta sección es exclusiva del Director.');return}document.querySelectorAll('.nav[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===v));$('title').textContent=titles[v]||v;try{const f={dashboard:dashboard,students:students,attendanceAlumnos:attendanceAlumnos,teachers:teachers,personal:personal,payroll:payroll,reception:reception,monthly:monthly,lockers:lockers,payments:payments,promotions:promotions,benefits:benefits,credential:credential,reports:reports,alerts:alerts,users:users,audit:audit,trash:trash,settings:settings}[v];if(f)await f()}catch(e){alert(e.message)}}
function status(x){return x==='Vencido'?'<span class="status bad">Vencido</span>':x==='Próximo'?'<span class="status warn">Próximo</span>':x==='Al corriente'?'<span class="status ok">Al corriente</span>':'<span class="pill">'+esc(x||'—')+'</span>'}
function payTable(rows){return rows?.length?'<div class="tablewrap"><table class="table"><tr><th>Recibo</th><th>Alumno</th><th>Concepto</th><th>Monto</th><th>Método</th><th>Fecha</th></tr>'+rows.map(p=>`<tr><td><b>${esc(p.receipt_no)}</b></td><td>${esc(p.matricula)} · ${esc(p.name)} ${esc(p.last_name)}</td><td>${esc(p.concept)}</td><td>$${(+p.amount).toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td>${esc(p.method)}</td><td>${esc(p.paid_at)}</td></tr>`).join('')+'</table></div>':'<div class="empty">Aún no hay registros.</div>'}
async function dashboard(){const d=await api('/api/dashboard');$('content').innerHTML=`<div class="cards"><div class="card"><div class="muted">Alumnos activos</div><div class="metric">${d.active}</div></div><div class="card"><div class="muted">Maestros</div><div class="metric">${d.teachers||0}</div></div><div class="card"><div class="muted">Vencidos</div><div class="metric">${d.overdue}</div></div><div class="card"><div class="muted">Vencen en 7 días</div><div class="metric">${d.upcoming}</div></div><div class="card"><div class="muted">Cobrado este mes</div><div class="metric">$${(+d.revenue).toLocaleString('es-MX')}</div></div></div><div class="section card"><div class="sectionhead"><h3>Próximos vencimientos</h3><button class="btn light" onclick="view('monthly')">Ver mensualidades</button></div>${d.exp.length?'<div class="tablewrap"><table class="table"><tr><th>Alumno</th><th>Vencimiento</th><th>Estado</th><th></th></tr>'+d.exp.map(s=>`<tr><td>${esc(s.matricula)} · ${esc(s.name)} ${esc(s.last_name)}</td><td>${esc(s.due_date)}</td><td>${status(s.payment_status||'Próximo')}</td><td><button class="btn gold" onclick="payFor(${s.id})">Cobrar</button></td></tr>`).join('')+'</table></div>':'<div class="empty">No hay vencimientos próximos.</div>'}</div><div class="section card"><h3>Últimos pagos</h3>${payTable(d.recent)}</div>`}
async function students(){const r=await api('/api/students');$('content').innerHTML=`<div class="sectionhead"><input id="studentSearch" style="max-width:430px" placeholder="Buscar matrícula o nombre" oninput="searchStudents(this.value)"><button class="btn primary" onclick="newStudent()">＋ Nuevo alumno</button></div><div class="tablewrap"><table class="table" id="studentTable"><tr><th>Matrícula</th><th>Alumno</th><th>Plan</th><th>Cuota</th><th>Vencimiento</th><th>Estado</th><th></th></tr>${r.map(studentRow).join('')}</table></div>`}
function studentRow(s){return `<tr><td><b>${esc(s.matricula)}</b></td><td>${esc(s.name)} ${esc(s.last_name)}<div class="muted">${esc(s.phone)}</div></td><td>${esc(s.plan)}</td><td>$${(+s.monthly_fee).toLocaleString('es-MX')}</td><td>${esc(s.due_date||'—')}</td><td>${status(s.payment_status)}</td><td class="actions"><button class="btn light" onclick="profile(${s.id})">Ficha</button><button class="btn gold" onclick="payFor(${s.id})">Cobrar</button></td></tr>`}
async function searchStudents(q){const r=await api('/api/students?q='+encodeURIComponent(q));$('studentTable').innerHTML='<tr><th>Matrícula</th><th>Alumno</th><th>Plan</th><th>Cuota</th><th>Vencimiento</th><th>Estado</th><th></th></tr>'+r.map(studentRow).join('')}
function newStudent(){modal('Nuevo alumno',`<div class="formgrid"><div><label>Nombre *</label><input id="sn"></div><div><label>Apellidos *</label><input id="sl"></div><div><label>Fecha de nacimiento</label><input id="sb" type="date"></div><div><label>Teléfono / WhatsApp</label><input id="sp"></div><div><label>Correo</label><input id="se"></div><div><label>Tutor / contacto</label><input id="st"></div><div><label>Teléfono tutor</label><input id="stp"></div><div><label>Plan</label><select id="spl"><option>Inicial</option><option>Plus</option><option>Premium</option><option>Elite</option></select></div><div><label>Cuota mensual</label><input id="sf" type="number" min="0" value="600"></div><div><label>Primer vencimiento</label><input id="sd" type="date"></div><div><label>Nivel de beneficio</label><select id="sbl"><option>Base</option><option>Plus</option><option>Premium</option><option>Elite</option></select></div><div class="full"><label>Notas</label><textarea id="sno"></textarea></div></div>`,'Crear matrícula',async()=>{const due=$('sd').value||new Date(new Date().getFullYear(),new Date().getMonth()+1,new Date().getDate()).toISOString().slice(0,10);const d=await api('/api/students',{method:'POST',body:JSON.stringify({name:$('sn').value,last_name:$('sl').value,birth_date:$('sb').value,phone:$('sp').value,email:$('se').value,tutor:$('st').value,tutor_phone:$('stp').value,plan:$('spl').value,monthly_fee:Number($('sf').value||0),due_date:due,benefit_level:$('sbl').value,notes:$('sno').value})});closeModal();toast('Alumno creado: '+d.matricula);students()})}
async function profile(id){const s=await api('/api/students/'+id);modal('Ficha · '+esc(s.matricula),`<div class="grid2"><div><p><b>Alumno:</b> ${esc(s.name)} ${esc(s.last_name)}</p><p><b>Plan:</b> ${esc(s.plan)}</p><p><b>Cuota:</b> $${(+s.monthly_fee).toLocaleString('es-MX')}</p><p><b>Vencimiento:</b> ${esc(s.due_date||'—')}</p><p><b>Beneficio:</b> ${esc(s.benefit_level)}</p></div><div><p><b>Teléfono:</b> ${esc(s.phone)}</p><p><b>Correo:</b> ${esc(s.email)}</p><p><b>Tutor:</b> ${esc(s.tutor)}</p><p><b>Contacto:</b> ${esc(s.tutor_phone)}</p></div></div><hr><h3>Historial de pagos</h3>${payTable(s.payments)}<hr><h3>Asistencia reciente</h3>${s.attendance.map(a=>`<p>${esc(a.attended_at)} · ${esc(a.status)} · ${esc(a.discipline)}</p>`).join('')||'<div class="empty">Sin asistencia.</div>'}`,'Cerrar',closeModal)}
async function payFor(id){if(!id){const ss=await api('/api/students');modal('Seleccionar alumno',`<select id="pick">${ss.map(s=>`<option value="${s.id}">${esc(s.matricula)} · ${esc(s.name)} ${esc(s.last_name)}</option>`).join('')}</select>`,'Continuar',()=>{const x=$('pick');closeModal();payFor(+x.value)});return}const s=await api('/api/students/'+id);modal('Registrar pago',`<div class="notice"><b>${esc(s.name)} ${esc(s.last_name)}</b><br>Cuota actual: $${(+s.monthly_fee).toLocaleString('es-MX')} · Vencimiento: ${esc(s.due_date||'—')}</div><label>Monto *</label><input id="pa" type="number" min="1" value="${+s.monthly_fee||0}"><label>Método</label><select id="pm"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option><option>Otro</option></select><label>Concepto</label><select id="pc"><option>Mensualidad</option><option>Inscripción</option><option>Uniforme</option><option>Otro</option></select><label>Periodo</label><input id="pp" placeholder="Ej. septiembre 2026"><label>Fecha</label><input id="pd" type="date" value="${new Date().toISOString().slice(0,10)}">`,'Registrar pago',async()=>{const d=await api('/api/payments',{method:'POST',body:JSON.stringify({student_id:id,amount:Number($('pa').value),method:$('pm').value,concept:$('pc').value,period:$('pp').value,paid_at:$('pd').value})});closeModal();toast('Pago registrado · '+d.receipt_no);view('dashboard')})}
async function payments(){const r=await api('/api/payments');$('content').innerHTML=`<div class="sectionhead"><h3>Historial de pagos</h3><button class="btn primary" onclick="payFor()">＋ Registrar pago</button></div>${payTable(r)}`}
async function attendanceAlumnos(){const r=await api('/api/attendance');const ss=await api('/api/students');$('content').innerHTML=`<div class="sectionhead"><h3>Control de asistencia de alumnos</h3><button class="btn primary" onclick="newAttendance()">＋ Registrar asistencia</button></div><div class="tablewrap"><table class="table"><tr><th>Fecha</th><th>Alumno</th><th>Disciplina</th><th>Grupo</th><th>Estatus</th></tr>${r.map(a=>`<tr><td>${esc(a.attended_at)}</td><td>${esc(a.matricula)} · ${esc(a.name)} ${esc(a.last_name)}</td><td>${esc(a.discipline)}</td><td>${esc(a.group_name)}</td><td>${esc(a.status)}</td></tr>`).join('')}</table></div>`}
async function newAttendance(){const ss=await api('/api/students');modal('Registrar asistencia',`<label>Alumno</label><select id="aa">${ss.map(s=>`<option value="${s.id}">${esc(s.matricula)} · ${esc(s.name)} ${esc(s.last_name)}</option>`).join('')}</select><label>Disciplina</label><input id="ad"><label>Grupo</label><input id="ag"><label>Estatus</label><select id="as"><option>Presente</option><option>Ausente</option><option>Retardo</option><option>Justificado</option></select><label>Fecha</label><input id="af" type="date" value="${new Date().toISOString().slice(0,10)}">`,'Guardar',async()=>{await api('/api/attendance',{method:'POST',body:JSON.stringify({student_id:+$('aa').value,discipline:$('ad').value,group_name:$('ag').value,status:$('as').value,attended_at:$('af').value})});closeModal();toast('Asistencia registrada');attendanceAlumnos()})}
async function teachers(){const r=await api('/api/teachers');$('content').innerHTML=`<div class="sectionhead"><h3>Maestros</h3>${user.role==='director'?'<button class="btn primary" onclick="newTeacher()">＋ Nuevo maestro</button>':''}</div><div class="tablewrap"><table class="table"><tr><th>Maestro</th><th>Matrícula</th><th>Disciplina</th><th>Tarifa/hora</th><th>Estado</th><th></th></tr>${r.map(t=>`<tr><td>${esc(t.name)} ${esc(t.last_name)}</td><td><b>${esc(t.matricula)}</b></td><td>${esc(t.discipline)}</td><td>$${(+t.rate_hour).toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td>${esc(t.status)}</td><td class="actions"><button class="btn light" onclick="teacherAttendance(${t.id})">Asistencia</button><button class="btn gold" onclick="teacherQR(${t.id})">QR</button></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">Aún no hay maestros.</div></td></tr>'}</table></div>`}
function newTeacher(){modal('Nuevo maestro',`<div class="formgrid"><div><label>Nombre *</label><input id="tn"></div><div><label>Apellidos *</label><input id="tl"></div><div><label>Teléfono</label><input id="tt"></div><div><label>Correo</label><input id="te"></div><div><label>Disciplina</label><input id="td" placeholder="Jazz, Ballet, Hip Hop..."></div><div><label>Pago por hora</label><input id="tr" type="number" min="0" value="150"></div><div class="full"><label>Notas</label><textarea id="tno"></textarea></div></div>`,'Guardar maestro',async()=>{const d=await api('/api/teachers',{method:'POST',body:JSON.stringify({name:$('tn').value,last_name:$('tl').value,phone:$('tt').value,email:$('te').value,discipline:$('td').value,rate_hour:Number($('tr').value||0),notes:$('tno').value})});closeModal();toast('Maestro registrado: '+d.matricula);teachers()})}
async function teacherAttendance(id){const t=await api('/api/teachers/'+id);modal('Asistencia de maestro',`<div class="notice"><b>${esc(t.name)} ${esc(t.last_name)}</b><br>${esc(t.matricula)} · $${(+t.rate_hour).toLocaleString('es-MX')}/hora</div><label>Fecha</label><input id="taf" type="date" value="${new Date().toISOString().slice(0,10)}"><label>Disciplina</label><input id="tad" value="${esc(t.discipline)}"><label>Entrada</label><input id="tae" type="time"><label>Salida</label><input id="tas" type="time"><label>Notas</label><input id="tan">`,'Guardar asistencia',async()=>{await api('/api/teacher-attendance',{method:'POST',body:JSON.stringify({teacher_id:id,attended_at:$('taf').value,discipline:$('tad').value,entry_time:$('tae').value,exit_time:$('tas').value,notes:$('tan').value})});closeModal();toast('Asistencia de maestro registrada');teachers()})}
async function teacherQR(id){const t=await api('/api/teachers/'+id);modal('Credencial de maestro',`<div style="text-align:center"><h2>EmpoderArte</h2><h3>${esc(t.name)} ${esc(t.last_name)}</h3><b>${esc(t.matricula)}</b><p>${esc(t.discipline)}</p><div id="tqr" class="qr"></div><p class="small muted">QR: EMPODERARTE|MAESTRO|${esc(t.matricula)}</p></div>`,'Imprimir',()=>window.print());setTimeout(()=>makeQR('tqr','EMPODERARTE|MAESTRO|'+t.matricula),50)}
async function personal(){const r=await api('/api/personal');$('content').innerHTML=`<div class="sectionhead"><h3>Personal</h3><button class="btn primary" onclick="newPersonal()">＋ Nuevo personal</button></div><div class="tablewrap"><table class="table"><tr><th>Nombre</th><th>Matrícula</th><th>Puesto</th><th>Tarifa/hora</th><th></th></tr>${r.map(p=>`<tr><td>${esc(p.name)} ${esc(p.last_name)}</td><td><b>${esc(p.matricula)}</b></td><td>${esc(p.position)}</td><td>$${(+p.rate_hour).toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td><button class="btn light" onclick="personalAttendance(${p.id})">Asistencia</button></td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">Aún no hay personal.</div></td></tr>'}</table></div>`}
function newPersonal(){modal('Nuevo personal',`<div class="formgrid"><div><label>Nombre *</label><input id="pn"></div><div><label>Apellidos *</label><input id="pl"></div><div><label>Puesto</label><input id="ppos" value="Recepción"></div><div><label>Área</label><input id="parea"></div><div><label>Pago por hora</label><input id="prate" type="number" min="0" value="100"></div><div><label>Teléfono</label><input id="ptel"></div><div class="full"><label>Correo</label><input id="pemail"></div></div>`,'Guardar personal',async()=>{const d=await api('/api/personal',{method:'POST',body:JSON.stringify({name:$('pn').value,last_name:$('pl').value,position:$('ppos').value,area:$('parea').value,rate_hour:Number($('prate').value||0),phone:$('ptel').value,email:$('pemail').value})});closeModal();toast('Personal registrado: '+d.matricula);personal()})}
async function personalAttendance(id){const p=await api('/api/personal/'+id);modal('Asistencia de personal',`<div class="notice"><b>${esc(p.name)} ${esc(p.last_name)}</b><br>${esc(p.matricula)} · ${esc(p.position)}</div><label>Fecha</label><input id="paf" type="date" value="${new Date().toISOString().slice(0,10)}"><label>Entrada</label><input id="pae" type="time"><label>Salida</label><input id="pas" type="time"><label>Actividad / área</label><input id="paa" value="${esc(p.area||p.position)}">`,'Guardar',async()=>{await api('/api/personal-attendance',{method:'POST',body:JSON.stringify({personal_id:id,attended_at:$('paf').value,entry_time:$('pae').value,exit_time:$('pas').value,activity:$('paa').value})});closeModal();toast('Asistencia registrada');personal()})}
async function payroll(){const r=await api('/api/payroll');$('content').innerHTML=`<div class="card"><h3>💰 Nómina</h3><div class="notice">Cálculo automático con horas registradas × tarifa. Incluye maestros y personal.</div><br><div class="tablewrap"><table class="table"><tr><th>Persona</th><th>Tipo</th><th>Horas</th><th>Total</th></tr>${r.map(x=>`<tr><td>${esc(x.name)} ${esc(x.last_name)}</td><td>${esc(x.type)}</td><td>${(+x.hours).toFixed(2)}</td><td><b>$${(+x.total).toLocaleString('es-MX',{minimumFractionDigits:2})}</b></td></tr>`).join('')||'<tr><td colspan="4"><div class="empty">Sin horas registradas.</div></td></tr>'}</table></div></div>`}
async function reception(){const d=await api('/api/dashboard');$('content').innerHTML=`<div class="cards"><div class="card"><h3>📷 Asistencia</h3><p>Registrar entrada de alumnos por matrícula o QR.</p><button class="btn primary" onclick="attendanceAlumnos()">Abrir asistencia</button></div><div class="card"><h3>💳 Cobro</h3><p>Registrar mensualidades y pagos.</p><button class="btn gold" onclick="payFor()">Cobrar</button></div><div class="card"><h3>🔔 Vencimientos</h3><p>${d.upcoming} próximos en 7 días · ${d.overdue} vencidos.</p><button class="btn light" onclick="alerts()">Ver vencimientos</button></div><div class="card"><h3>👩‍🏫 Maestros</h3><p>Registrar asistencia de maestros.</p><button class="btn light" onclick="teachers()">Ver maestros</button></div></div>`}
async function monthly(){const r=await api('/api/monthly');$('content').innerHTML=`<div class="sectionhead"><h3>Control automático de mensualidades</h3><button class="btn primary" onclick="payFor()">＋ Cobrar</button></div><div class="notice">El estado se calcula automáticamente según el vencimiento: vencido, próximo (7 días) o al corriente.</div><br><div class="tablewrap"><table class="table"><tr><th>Alumno</th><th>Matrícula</th><th>Plan</th><th>Cuota</th><th>Vencimiento</th><th>Estado</th><th>Días</th><th></th></tr>${r.map(x=>`<tr><td>${esc(x.name)} ${esc(x.last_name)}</td><td><b>${esc(x.matricula)}</b></td><td>${esc(x.plan)}</td><td>$${(+x.monthly_fee).toLocaleString('es-MX')}</td><td>${esc(x.due_date||'—')}</td><td>${status(x.payment_status)}</td><td>${x.days_remaining??'—'}</td><td><button class="btn gold" onclick="payFor(${x.id})">Cobrar</button></td></tr>`).join('')}</table></div>`}
async function lockers(){const [r,p]=await Promise.all([api('/api/lockers'),api('/api/locker-plans')]);$('content').innerHTML=`<div class="sectionhead"><h3>🔐 Renta de lockers</h3><div class="actions"><button class="btn light" onclick="lockerPlans()">Planes</button><button class="btn primary" onclick="newLocker()">＋ Rentar locker</button></div></div><div class="notice">Planes iniciales: Mensual $100 · Semestral $550 · Anual $900. Un alumno no puede tener dos lockers activos.</div><br><div class="tablewrap"><table class="table"><tr><th>Locker</th><th>Alumno</th><th>Plan</th><th>Pago</th><th>Vencimiento</th><th>Estado</th><th></th></tr>${r.map(l=>`<tr><td><b>${esc(l.number)}</b></td><td>${esc(l.matricula||'')} · ${esc(l.name||'')} ${esc(l.last_name||'')}</td><td>${esc(l.plan_catalog||l.plan_name)}</td><td>$${(+l.price).toLocaleString('es-MX')}</td><td>${esc(l.due_date||'—')}</td><td>${esc(l.status)}</td><td class="actions"><button class="btn gold" onclick="lockerPay(${l.id},${+l.price})">Renovar</button><button class="btn light" onclick="lockerHistory(${l.id})">Historial</button><button class="btn danger" onclick="lockerPenalty(${l.id})">Penalización</button>${user.role==='director'?`<button class="btn danger" onclick="lockerClose(${l.id})">Finalizar</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7"><div class="empty">No hay lockers rentados.</div></td></tr>'}</table></div>`}
async function newLocker(){const [ss,ps]=await Promise.all([api('/api/students'),api('/api/locker-plans')]);modal('Rentar locker',`<label>Número de locker</label><input id="ln" placeholder="L-01"><label>Alumno</label><select id="la">${ss.map(s=>`<option value="${s.id}">${esc(s.matricula)} · ${esc(s.name)} ${esc(s.last_name)}</option>`).join('')}</select><label>Plan</label><select id="lp">${ps.map(p=>`<option value="${p.id}">${esc(p.name)} · $${(+p.price).toLocaleString('es-MX')}</option>`).join('')}</select><label>Fecha de pago</label><input id="lf" type="date" value="${new Date().toISOString().slice(0,10)}"><label>Notas</label><input id="lno">`,'Guardar renta',async()=>{await api('/api/lockers',{method:'POST',body:JSON.stringify({number:$('ln').value,student_id:+$('la').value,plan_id:+$('lp').value,paid_at:$('lf').value,notes:$('lno').value})});closeModal();toast('Locker rentado');lockers()})}
async function lockerPay(id,price){modal('Renovar locker',`<div class="notice">Importe automático: <b>$${(+price).toLocaleString('es-MX',{minimumFractionDigits:2})}</b></div><label>Fecha de pago</label><input id="lpf" type="date" value="${new Date().toISOString().slice(0,10)}"><label>Método</label><select id="lpm"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option><option>Otro</option></select>`,'Registrar pago',async()=>{await api('/api/lockers/'+id+'/payment',{method:'POST',body:JSON.stringify({amount:price,paid_at:$('lpf').value,method:$('lpm').value})});closeModal();toast('Locker renovado');lockers()})}
async function lockerHistory(id){const r=await api('/api/lockers/'+id+'/payments');modal('Historial del locker',r.length?'<div class="tablewrap"><table class="table"><tr><th>Fecha</th><th>Concepto</th><th>Monto</th><th>Método</th></tr>'+r.map(x=>`<tr><td>${esc(x.paid_at)}</td><td>${esc(x.concept)}</td><td>$${(+x.amount).toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td>${esc(x.method)}</td></tr>`).join('')+'</table></div>':'<div class="empty">Sin pagos.</div>','Cerrar',closeModal)}
async function lockerPenalty(id){modal('Penalización de locker',`<label>Monto</label><input id="lpmonto" type="number" min="1" value="50"><label>Motivo</label><select id="lpreason"><option>Retraso</option><option>Daño</option><option>Pérdida de llave</option><option>Otro</option></select>`,'Registrar',async()=>{await api('/api/lockers/'+id+'/penalty',{method:'POST',body:JSON.stringify({amount:Number($('lpmonto').value),reason:$('lpreason').value})});closeModal();toast('Penalización registrada');lockers()})}
async function lockerClose(id){if(!confirm('¿Finalizar esta renta de locker?'))return;await api('/api/lockers/'+id+'/close',{method:'POST'});toast('Locker finalizado');lockers()}
async function lockerPlans(){const r=await api('/api/locker-plans');modal('Planes de lockers',`<div class="tablewrap"><table class="table"><tr><th>Plan</th><th>Precio</th><th>Meses</th></tr>${r.map(p=>`<tr><td>${esc(p.name)}</td><td>$${(+p.price).toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td>${p.months}</td></tr>`).join('')}</table></div><br><div class="notice">El Director puede cambiar estos planes desde Configuración.</div>`,'Cerrar',closeModal)}
async function promotions(){const r=await api('/api/promotions');$('content').innerHTML=`<div class="sectionhead"><h3>Promociones</h3>${user.role==='director'?'<button class="btn primary" onclick="newPromotion()">＋ Nueva promoción</button>':''}</div><div class="cards">${r.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><b>${p.discount}${p.kind==='Porcentaje'?'%':' MXN'} de descuento</b><div class="muted">${p.active?'Activa':'Inactiva'} · ${esc(p.expires_at||'Sin vencimiento')}</div></div>`).join('')}</div>`}
function newPromotion(){modal('Nueva promoción',`<label>Nombre</label><input id="pmn"><label>Descripción</label><textarea id="pmd"></textarea><label>Descuento</label><input id="pmi" type="number" min="0"><label>Tipo</label><select id="pmk"><option>Porcentaje</option><option>Monto</option></select><label>Vigencia</label><input id="pme" type="date">`,'Crear',async()=>{await api('/api/promotions',{method:'POST',body:JSON.stringify({name:$('pmn').value,description:$('pmd').value,discount:Number($('pmi').value||0),kind:$('pmk').value,expires_at:$('pme').value})});closeModal();toast('Promoción creada');promotions()})}
async function benefits(){const r=await api('/api/benefits');$('content').innerHTML='<div class="cards">'+r.map(b=>`<div class="card"><div class="pill">${esc(b.level)}</div><h3>${esc(b.name)}</h3><p>${esc(b.description)}</p></div>`).join('')+'</div>'}
async function credential(){const ss=await api('/api/students');$('content').innerHTML=`<div class="sectionhead"><h3>Credencial digital / QR</h3><select id="credsel" style="max-width:430px" onchange="renderCred()"><option value="">Selecciona un alumno</option>${ss.map(s=>`<option value="${s.id}">${esc(s.matricula)} · ${esc(s.name)} ${esc(s.last_name)}</option>`).join('')}</select></div><div id="cred"></div>`}
async function renderCred(){const id=$('credsel').value;if(!id){$('cred').innerHTML='';return}const s=await api('/api/students/'+id);$('cred').innerHTML=`<div class="card" style="max-width:450px;text-align:center;margin:auto"><h2>EmpoderArte</h2><div id="qrcode" class="qr"></div><h2>${esc(s.name)} ${esc(s.last_name)}</h2><div class="pill">${esc(s.matricula)}</div><p>Plan ${esc(s.plan)} · Beneficio ${esc(s.benefit_level)}</p><button class="btn primary" onclick="window.print()">🖨 Imprimir credencial</button></div>`;makeQR('qrcode',s.matricula)}
function makeQR(id,text){const el=$(id);if(!el)return;el.innerHTML=`<img src="https://quickchart.io/qr?text=${encodeURIComponent(text)}&size=180" width="180" height="180" alt="QR">`}
async function reports(){const d=await api('/api/report');$('content').innerHTML=`<div class="cards"><div class="card"><div class="muted">Alumnos registrados</div><div class="metric">${d.alumnos}</div></div><div class="card"><div class="muted">Alumnos activos</div><div class="metric">${d.activos}</div></div><div class="card"><div class="muted">Ingresos del mes</div><div class="metric">$${(+d.ingresos).toLocaleString('es-MX')}</div></div><div class="card"><div class="muted">Vencidos</div><div class="metric">${d.vencidos}</div></div></div>`}
async function alerts(){const r=await api('/api/monthly');const a=r.filter(x=>x.payment_status==='Vencido'||x.payment_status==='Próximo');$('content').innerHTML=`<div class="card"><h3>🔔 Vencimientos y recordatorios</h3><div class="notice">Aquí puedes identificar rápidamente adeudos y próximos vencimientos. El botón prepara WhatsApp con el número registrado.</div><br><div class="tablewrap"><table class="table"><tr><th>Alumno</th><th>Vencimiento</th><th>Estado</th><th>Importe</th><th></th></tr>${a.map(x=>`<tr><td>${esc(x.name)} ${esc(x.last_name)}<br><small>${esc(x.matricula)}</small></td><td>${esc(x.due_date||'—')}</td><td>${status(x.payment_status)}</td><td>$${(+x.monthly_fee).toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td>${x.phone?`<button class="btn primary" onclick="wa('${esc(x.phone)}','${esc(x.name)}','${esc(x.due_date||'')}','${+x.monthly_fee}')">📲 WhatsApp</button>`:''}<button class="btn gold" onclick="payFor(${x.id})">Cobrar</button></td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">No hay vencimientos.</div></td></tr>'}</table></div></div>`}
function wa(phone,name,due,amount){const p=String(phone).replace(/\D/g,'');window.open('https://wa.me/'+p+'?text='+encodeURIComponent(`Hola ${name}, te recordamos que tu mensualidad vence el ${due}. Importe: $${amount}. Gracias por formar parte de EmpoderArte.`),'_blank')}
async function users(){const r=await api('/api/users');$('content').innerHTML=`<div class="sectionhead"><h3>Usuarios y permisos</h3><button class="btn primary" onclick="newUser()">＋ Nuevo usuario</button></div><div class="tablewrap"><table class="table"><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Activo</th><th>Último acceso</th></tr>${r.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${u.active?'Sí':'No'}</td><td>${esc(u.last_login||'—')}</td></tr>`).join('')}</table></div>`}
function newUser(){modal('Nuevo usuario',`<label>Nombre</label><input id="un"><label>Correo</label><input id="ue" type="email"><label>Contraseña</label><input id="up" type="password"><label>Rol</label><select id="ur"><option value="recepcion">Recepción</option><option value="director">Director</option></select>`,'Crear',async()=>{await api('/api/users',{method:'POST',body:JSON.stringify({name:$('un').value,email:$('ue').value,password:$('up').value,role:$('ur').value})});closeModal();toast('Usuario creado');users()})}
async function audit(){const r=await api('/api/audit');$('content').innerHTML='<div class="card"><h3>Bitácora</h3><div class="tablewrap"><table class="table"><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Módulo</th><th>Detalle</th></tr>'+r.map(a=>`<tr><td>${esc(a.created_at)}</td><td>${esc(a.user_name)}</td><td>${esc(a.action)}</td><td>${esc(a.module)}</td><td>${esc(a.detail)}</td></tr>`).join('')+'</table></div></div>'}
async function trash(){const r=await api('/api/trash');$('content').innerHTML='<div class="card"><h3>Papelera</h3>'+r.map(x=>`<div class="bar"><span>${esc(x.name)}<br><small>${esc(x.matricula||'')} · ${esc(x.deleted_at)}</small></span><button class="btn primary" onclick="restore(${x.id})">Restaurar</button></div>`).join('')||'<div class="empty">La papelera está vacía.</div>'+'</div>'}
async function restore(id){await api('/api/trash/'+id+'/restore',{method:'POST'});toast('Registro restaurado');trash()}
async function settings(){const c=await api('/api/settings');$('content').innerHTML=`<div class="card"><h3>⚙ Configuración</h3><div class="notice">Los parámetros principales se guardan en PostgreSQL para que el sistema conserve la configuración.</div><div class="formgrid" style="margin-top:15px"><div><label>Nombre de escuela</label><input id="ce" value="${esc(c.school_name||'EmpoderArte Escuela de Danza')}"></div><div><label>Subtítulo</label><input id="cs" value="${esc(c.subtitle||'Escuela de Danza')}"></div><div><label>Prefijo matrícula</label><input id="cp" value="${esc(c.matricula_prefix||'EMP')}"></div><div><label>Día predeterminado de vencimiento</label><input id="cd" type="number" min="1" max="31" value="${c.default_due_day||10}"></div><div><label>Días para alerta WhatsApp</label><input id="cw" type="number" min="0" value="${c.whatsapp_days??3}"></div><div><label>Moneda</label><input id="cm" value="${esc(c.currency||'MXN')}"></div></div><br><button class="btn primary" onclick="saveSettings()">💾 Guardar configuración</button></div><br><div class="card"><h3>Planes de lockers</h3><p class="muted">Los planes actuales se administran desde el módulo Lockers.</p></div>`}
async function saveSettings(){await api('/api/settings',{method:'PUT',body:JSON.stringify({school_name:$('ce').value,subtitle:$('cs').value,matricula_prefix:$('cp').value,default_due_day:Number($('cd').value),whatsapp_days:Number($('cw').value),currency:$('cm').value})});toast('Configuración guardada');settings()}
async function globalSearch(q){if(!q||q.length<2)return;clearTimeout(window.gst);window.gst=setTimeout(async()=>{const r=await api('/api/students?q='+encodeURIComponent(q));if(r.length===1)profile(r[0].id)},500)}
</script></body></html>
