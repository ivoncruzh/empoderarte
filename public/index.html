<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EmpoderArte · Sistema Integral</title><style>:root{--p:#6b3fa0;--g:#d4a84f;--bg:#f7f4fa;--ink:#30253b;--mut:#756b7d;--ok:#27844b;--bad:#bd3d49;--warn:#a97818}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#f7efff,#fff9ef)}.loginbox{width:min(440px,100%);background:#fff;padding:34px;border-radius:24px;box-shadow:0 20px 60px #3d245322}.brand{font-weight:900;font-size:30px;color:var(--p)}.sub{color:var(--mut)}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #ddd3e6;border-radius:10px;background:#fff}textarea{min-height:90px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700}.primary{background:var(--p);color:white}.gold{background:var(--g);color:#2f2415}.light{background:#f0ebf5;color:var(--ink)}.danger{background:#fde7e9;color:#9e2835}.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{background:#2d2138;color:#fff;padding:22px;display:flex;flex-direction:column;gap:10px}.side .brand{color:#fff;margin-bottom:16px}.nav{border:0;background:transparent;color:#e8dff0;text-align:left;padding:11px;border-radius:9px;font-weight:700}.nav:hover,.nav.active{background:#ffffff16;color:#fff}.main{padding:25px;min-width:0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:26px}.cards{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:14px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 6px 25px #2d21380d}.metric{font-size:28px;font-weight:900;margin-top:5px}.muted{color:var(--mut);font-size:13px}.section{margin-top:18px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.sectionhead h2,.sectionhead h3{margin:0}.tablewrap{overflow:auto;background:#fff;border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:12px;border-bottom:1px solid #eee7f0;text-align:left}.table th{font-size:12px;color:var(--mut)}.status{display:inline-block;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800}.ok{background:#e8f7ed;color:var(--ok)}.bad{background:#fde9eb;color:var(--bad)}.warn{background:#fff5dc;color:var(--warn)}.grid2,.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end}.empty{text-align:center;padding:30px;color:var(--mut)}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#f0ebf5}.qr{width:180px;height:180px;border:1px dashed #bbb;display:grid;place-items:center;margin:auto}.small{font-size:12px}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static}.cards{grid-template-columns:repeat(2,1fr)}.grid2,.formgrid{grid-template-columns:1fr}.main{padding:15px}}
</style></head><body><section id="login" class="login"><div class="loginbox"><div class="brand">EmpoderArte</div><p class="sub">Sistema Integral de Gestión</p><label>Correo</label><input id="email" value="director@empoderarte.local"><label>Contraseña</label><input id="password" type="password" value="empoderarte"><button class="btn primary" style="width:100%;margin-top:18px" onclick="login()">🚀 Entrar al sistema</button><p class="small sub">Versión V2.1 · Base de datos local SQLite preparada para nube</p></div></section>
<section id="app" class="app hidden"><aside class="side"><div class="brand">EmpoderArte</div><button class="nav active" data-v="dashboard">🏠 Dashboard</button><button class="nav" data-v="students">👩‍🎓 Alumnos</button><button class="nav" data-v="payments">💳 Pagos</button><button class="nav" data-v="attendance">🕐 Asistencia</button><button class="nav" data-v="promotions">🎁 Promociones</button><button class="nav" data-v="benefits">⭐ Beneficios</button><button class="nav" data-v="credential">📱 Credencial QR</button><button class="nav" data-v="reports">📊 Reportes</button><button id="usersNav" class="nav" data-v="users">👥 Usuarios</button><button id="auditNav" class="nav" data-v="audit">📝 Auditoría</button><div style="margin-top:auto"><div id="userBadge" class="small"></div><button class="nav" onclick="logout()">↪ Cerrar sesión</button></div></aside><main class="main"><div class="top"><h1 id="title">Dashboard</h1><span id="clock" class="muted"></span></div><div id="content"></div></main></section><div id="toast" style="position:fixed;right:20px;bottom:20px;background:#2d2138;color:#fff;padding:12px 16px;border-radius:10px;display:none"></div>
<script>let token=localStorage.emp_token||'',user=JSON.parse(localStorage.emp_user||'null');const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};const r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Error');return d}function toast(x){$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}async function login(){try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})}),d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;user=d.user;localStorage.emp_token=token;localStorage.emp_user=JSON.stringify(user);boot()}catch(e){alert(e.message)}}function logout(){localStorage.removeItem('emp_token');localStorage.removeItem('emp_user');location.reload()}function boot(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('userBadge').textContent='👤 '+user.name+' · '+user.role;if(user.role!=='director'){$('usersNav').classList.add('hidden');$('auditNav').classList.add('hidden')}view('dashboard')}if(token&&user)boot();document.querySelectorAll('.nav[data-v]').forEach(b=>b.onclick=()=>view(b.dataset.v));setInterval(()=>{$('clock').textContent=new Date().toLocaleString('es-MX')},1000);
const status=x=>x==='Vencido'?'<span class="status bad">Vencido</span>':x==='Próximo'?'<span class="status warn">Próximo</span>':x==='Al corriente'?'<span class="status ok">Al corriente</span>':'<span class="pill">'+esc(x||'—')+'</span>';
async function view(v){document.querySelectorAll('.nav[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===v));$('title').textContent={dashboard:'Dashboard',students:'Alumnos',payments:'Pagos',attendance:'Asistencia',promotions:'Promociones',benefits:'Beneficios',credential:'Credencial digital',reports:'Reportes',users:'Usuarios',audit:'Auditoría'}[v];try{if(v==='dashboard')await dashboard();if(v==='students')await students();if(v==='payments')await payments();if(v==='attendance')await attendance();if(v==='promotions')await promotions();if(v==='benefits')await benefits();if(v==='credential')await credential();if(v==='reports')await reports();if(v==='users')await users();if(v==='audit')await audit()}catch(e){alert(e.message)}}
function payTable(rows){return rows.length?'<div class="tablewrap"><table class="table"><tr><th>Recibo</th><th>Alumno</th><th>Concepto</th><th>Monto</th><th>Método</th><th>Fecha</th></tr>'+rows.map(p=>`<tr><td><b>${esc(p.receipt_no)}</b></td><td>${esc(p.matricula)} · ${esc(p.name)} ${esc(p.last_name)}</td><td>${esc(p.concept)}</td><td>$${(+p.amount).toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td>${esc(p.method)}</td><td>${esc(p.paid_at)}</td></tr>`).join('')+'</table></div>':'<div class="empty">Aún no hay registros.</div>'}
async function dashboard(){let d=await api('/api/dashboard');$('content').innerHTML=`<div class="cards"><div class="card"><div class="muted">Alumnos</div><div class="metric">${d.total}</div></div><div class="card"><div class="muted">Activos</div><div class="metric">${d.active}</div></div><div class="card"><div class="muted">Vencidos</div><div class="metric" style="color:var(--bad)">${d.overdue}</div></div><div class="card"><div class="muted">Vencen en 7 días</div><div class="metric" style="color:var(--warn)">${d.upcoming}</div></div><div class="card"><div class="muted">Cobrado este mes</div><div class="metric">$${(+d.revenue).toLocaleString('es-MX')}</div></div></div><div class="section card"><div class="sectionhead"><h3>Próximos vencimientos</h3><button class="btn light" onclick="view('students')">Ver alumnos</button></div>${d.exp.length?'<div class="tablewrap"><table class="table"><tr><th>Alumno</th><th>Vencimiento</th><th></th></tr>'+d.exp.map(s=>`<tr><td>${esc(s.matricula)} · ${esc(s.name)} ${esc(s.last_name)}</td><td>${esc(s.due_date)}</td><td><button class="btn gold" onclick="payFor(${s.id})">Cobrar</button></td></tr>`).join('')+'</table></div>':'<div class="empty">No hay vencimientos próximos.</div>'}</div><div class="section card"><h3>Últimos pagos</h3>${payTable(d.recent)}</div>`}
async function students(){let r=await api('/api/students');$('content').innerHTML=`<div class="sectionhead"><input id="studentSearch" style="max-width:430px" placeholder="Buscar matrícula o nombre" oninput="searchStudents(this.value)"><button class="btn primary" onclick="newStudent()">+ Nuevo alumno</button></div><div class="tablewrap"><table class="table" id="studentTable"><tr><th>Matrícula</th><th>Alumno</th><th>Plan</th><th>Cuota</th><th>Vencimiento</th><th>Estado</th><th></th></tr>${r.map(studentRow).join('')}</table></div>`}function studentRow(s){return `<tr><td><b>${esc(s.matricula)}</b></td><td>${esc(s.name)} ${esc(s.last_name)}<div class="muted">${esc(s.phone)}</div></td><td>${esc(s.plan)}</td><td>$${(+s.monthly_fee).toLocaleString('es-MX')}</td><td>${esc(s.due_date)}</td><td>${status(s.payment_status)}</td><td><button class="btn light" onclick="profile(${s.id})">Ficha</button> <button class="btn gold" onclick="payFor(${s.id})">Cobrar</button></td></tr>`}async function searchStudents(q){let r=await api('/api/students?q='+encodeURIComponent(q));$('studentTable').innerHTML='<tr><th>Matrícula</th><th>Alumno</th><th>Plan</th><th>Cuota</th><th>Vencimiento</th><th>Estado</th><th></th></tr>'+r.map(studentRow).join('')}
function modal(title,body,action,fn){let d=document.createElement('div');d.id='modal';d.style='position:fixed;inset:0;background:#2d213899;display:grid;place-items:center;padding:18px;z-index:20';d.innerHTML=`<div class="card" style="width:min(760px,100%);max-height:92vh;overflow:auto"><div class="sectionhead"><h2>${title}</h2><button class="btn light" onclick="closeModal()">×</button></div>${body}<div class="actions" style="margin-top:18px"><button class="btn primary" id="modalGo">${action}</button><button class="btn light" onclick="closeModal()">Cancelar</button></div></div>`;document.body.appendChild(d);$('modalGo').onclick=async()=>{try{await fn()}catch(e){alert(e.message)}}}function closeModal(){document.getElementById('modal')?.remove()}
function newStudent(){modal('Nuevo alumno',`<div class="formgrid"><div><label>Nombre *</label><input id="sn"></div><div><label>Apellidos *</label><input id="sl"></div><div><label>Fecha de nacimiento</label><input id="sb" type="date"></div><div><label>Teléfono</label><input id="sp"></div><div><label>Correo</label><input id="se"></div><div><label>Tutor / contacto</label><input id="st"></div><div><label>Teléfono tutor</label><input id="stp"></div><div><label>Plan</label><select id="spl"><option>Inicial</option><option>Plus</option><option>Premium</option><option>Elite</option></select></div><div><label>Cuota mensual</label><input id="sf" type="number" min="0"></div><div><label>Primer vencimiento</label><input id="sd" type="date"></div><div><label>Nivel de beneficio</label><select id="sbl"><option>Base</option><option>Plus</option><option>Premium</option><option>Elite</option></select></div><div class="full"><label>Notas</label><textarea id="sno"></textarea></div></div>`,'Crear matrícula',async()=>{let d=await api('/api/students',{method:'POST',body:JSON.stringify({name:$('sn').value,last_name:$('sl').value,birth_date:$('sb').value,phone:$('sp').value,email:$('se').value,tutor:$('st').value,tutor_phone:$('stp').value,plan:$('spl').value,monthly_fee:Number($('sf').value||0),cuota_mensual:Number($('sf').value||0),due_date:$('sd').value||new Date(new Date().getFullYear(),new Date().getMonth()+1,new Date().getDate()).toISOString().slice(0,10),primer_vencimiento:$('sd').value||new Date(new Date().getFullYear(),new Date().getMonth()+1,new Date().getDate()).toISOString().slice(0,10),benefit_level:$('sbl').value,notes:$('sno').value})});closeModal();toast('Alumno creado: '+d.matricula);students()})}
async function profile(id){let s=await api('/api/students/'+id);modal('Ficha · '+esc(s.matricula),`<div class="grid2"><div><p><b>Alumno:</b> ${esc(s.name)} ${esc(s.last_name)}</p><p><b>Plan:</b> ${esc(s.plan)}</p><p><b>Cuota:</b> $${(+s.monthly_fee).toLocaleString('es-MX')}</p><p><b>Vencimiento:</b> ${esc(s.due_date)}</p><p><b>Beneficio:</b> ${esc(s.benefit_level)}</p></div><div><p><b>Teléfono:</b> ${esc(s.phone)}</p><p><b>Correo:</b> ${esc(s.email)}</p><p><b>Tutor:</b> ${esc(s.tutor)}</p><p><b>Contacto:</b> ${esc(s.tutor_phone)}</p></div></div><hr><h3>Historial de pagos</h3>${payTable(s.payments.map(p=>({...p,matricula:s.matricula,name:s.name,last_name:s.last_name})))}<hr><h3>Asistencia reciente</h3>${s.attendance.map(a=>`<p>${esc(a.attended_at)} · ${esc(a.status)} · ${esc(a.discipline)}</p>`).join('')||'<div class="empty">Sin asistencia.</div>'}`,'Cerrar',closeModal)}
async function payFor(id){if(!id){let ss=await api('/api/students');modal('Seleccionar alumno',`<select id="pick">${ss.map(s=>`<option value="${s.id}">${esc(s.matricula)} · ${esc(s.name)} ${esc(s.last_name)}</option>`).join('')}</select>`,'Continuar',()=>{let x=$('pick');closeModal();payFor(+x.value)});return}modal('Registrar pago',`<label>Monto *</label><input id="pa" type="number" min="1"><label>Método</label><select id="pm"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option><option>Otro</option></select><label>Concepto</label><select id="pc"><option>Mensualidad</option><option>Inscripción</option><option>Uniforme</option><option>Otro</option></select><label>Periodo</label><input id="pp" placeholder="Ej. septiembre 2026"><label>Fecha</label><input id="pd" type="date" value="${new Date().toISOString().slice(0,10)}">`,'Registrar pago',async()=>{let d=await api('/api/payments',{method:'POST',body:JSON.stringify({student_id:id,amount:$('pa').value,method:$('pm').value,concept:$('pc').value,period:$('pp').value,paid_at:$('pd').value})});closeModal();toast('Pago registrado · '+d.receipt_no);view('dashboard')})}
async function payments(){let r=await api('/api/payments');$('content').innerHTML=`<div class="sectionhead"><h3>Historial de pagos</h3><button class="btn primary" onclick="payFor()">+ Registrar pago</button></div>${payTable(r)}`}
async function attendance(){let r=await api('/api/attendance');$('content').innerHTML=`<div class="sectionhead"><h3>Control de asistencia</h3><button class="btn primary" onclick="newAttendance()">+ Registrar asistencia</button></div><div class="tablewrap"><table class="table"><tr><th>Fecha</th><th>Alumno</th><th>Disciplina</th><th>Grupo</th><th>Estatus</th></tr>${r.map(a=>`<tr><td>${esc(a.attended_at)}</td><td>${esc(a.matricula)} · ${esc(a.name)} ${esc(a.last_name)}</td><td>${esc(a.discipline)}</td><td>${esc(a.group_name)}</td><td>${esc(a.status)}</td></tr>`).join('')}</table></div>`}async function newAttendance(){let ss=await api('/api/students');modal('Registrar asistencia',`<label>Alumno</label><select id="aa">${ss.map(s=>`<option value="${s.id}">${esc(s.matricula)} · ${esc(s.name)} ${esc(s.last_name)}</option>`).join('')}</select><label>Disciplina</label><input id="ad"><label>Grupo</label><input id="ag"><label>Estatus</label><select id="as"><option>Presente</option><option>Ausente</option><option>Retardo</option><option>Justificado</option></select><label>Fecha</label><input id="af" type="date" value="${new Date().toISOString().slice(0,10)}">`,'Guardar',async()=>{await api('/api/attendance',{method:'POST',body:JSON.stringify({student_id:+$('aa').value,discipline:$('ad').value,group_name:$('ag').value,status:$('as').value,attended_at:$('af').value})});closeModal();toast('Asistencia registrada');attendance()})}
async function promotions(){let r=await api('/api/promotions');$('content').innerHTML=`<div class="sectionhead"><h3>Promociones</h3>${user.role==='director'?'<button class="btn primary" onclick="newPromotion()">+ Nueva promoción</button>':''}</div><div class="cards">${r.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><b>${p.discount}${p.kind==='Porcentaje'?'%':' MXN'} de descuento</b><div class="muted">${p.active?'Activa':'Inactiva'} · ${esc(p.expires_at||'Sin vencimiento')}</div></div>`).join('')}</div>`}function newPromotion(){modal('Nueva promoción',`<label>Nombre</label><input id="pn"><label>Descripción</label><textarea id="pdesc"></textarea><label>Descuento</label><input id="pdis" type="number" min="0"><label>Tipo</label><select id="pk"><option>Porcentaje</option><option>Monto</option></select><label>Vigencia</label><input id="pex" type="date">`,'Crear',async()=>{await api('/api/promotions',{method:'POST',body:JSON.stringify({name:$('pn').value,description:$('pdesc').value,discount:$('pdis').value,kind:$('pk').value,expires_at:$('pex').value})});closeModal();toast('Promoción creada');promotions()})}
async function benefits(){let r=await api('/api/benefits');$('content').innerHTML='<div class="cards">'+r.map(b=>`<div class="card"><div class="pill">${esc(b.level)}</div><h3>${esc(b.name)}</h3><p>${esc(b.description)}</p></div>`).join('')+'</div>'}
async function credential(){let ss=await api('/api/students');$('content').innerHTML=`<div class="sectionhead"><h3>Credencial digital</h3><select id="credsel" style="max-width:420px" onchange="renderCred()"><option value="">Selecciona un alumno</option>${ss.map(s=>`<option value="${s.id}">${esc(s.matricula)} · ${esc(s.name)} ${esc(s.last_name)}</option>`).join('')}</select></div><div id="cred"></div>`}async function renderCred(){let id=$('credsel').value;if(!id){$('cred').innerHTML='';return}let s=await api('/api/students/'+id);let qr='https://quickchart.io/qr?text='+encodeURIComponent(s.matricula)+'&size=180';$('cred').innerHTML=`<div class="card" style="max-width:420px;text-align:center"><div class="brand">EmpoderArte</div><div class="qr"><img src="${qr}" width="170" height="170" alt="QR"></div><h2>${esc(s.name)} ${esc(s.last_name)}</h2><div class="pill">${esc(s.matricula)}</div><p>Plan ${esc(s.plan)} · Beneficio ${esc(s.benefit_level)}</p><p class="small">El QR contiene únicamente la matrícula.</p><button class="btn primary" onclick="window.print()">🖨️ Imprimir credencial</button></div>`}
async function reports(){let d=await api('/api/report');$('content').innerHTML=`<div class="cards"><div class="card"><div class="muted">Alumnos registrados</div><div class="metric">${d.alumnos}</div></div><div class="card"><div class="muted">Alumnos activos</div><div class="metric">${d.activos}</div></div><div class="card"><div class="muted">Ingresos del mes</div><div class="metric">$${(+d.ingresos).toLocaleString('es-MX')}</div></div><div class="card"><div class="muted">Vencidos</div><div class="metric" style="color:var(--bad)">${d.vencidos}</div></div></div>`}
async function users(){let r=await api('/api/users');$('content').innerHTML=`<div class="sectionhead"><h3>Usuarios y permisos</h3><button class="btn primary" onclick="newUser()">+ Nuevo usuario</button></div><div class="tablewrap"><table class="table"><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Activo</th><th>Último acceso</th></tr>${r.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${u.active?'Sí':'No'}</td><td>${esc(u.last_login||'—')}</td></tr>`).join('')}</table></div>`}function newUser(){modal('Nuevo usuario',`<label>Nombre</label><input id="un"><label>Correo</label><input id="ue" type="email"><label>Contraseña</label><input id="up" type="password"><label>Rol</label><select id="ur"><option value="recepcion">Recepción</option><option value="director">Director</option></select>`,'Crear',async()=>{await api('/api/users',{method:'POST',body:JSON.stringify({name:$('un').value,email:$('ue').value,password:$('up').value,role:$('ur').value})});closeModal();toast('Usuario creado');users()})}
async function audit(){let r=await api('/api/audit');$('content').innerHTML='<div class="tablewrap"><table class="table"><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Módulo</th><th>Detalle</th></tr>'+r.map(a=>`<tr><td>${esc(a.created_at)}</td><td>${esc(a.user_name)}</td><td>${esc(a.action)}</td><td>${esc(a.module)}</td><td>${esc(a.detail)}</td></tr>`).join('')+'</table></div>'}
</script></body></html>
