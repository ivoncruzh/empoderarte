<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EmpoderArte | Sistema de Gestión</title>
<style>
:root{
  --bg:#0b0b0d;
  --panel:#151518;
  --panel2:#1c1c20;
  --line:#2b2b31;
  --gold:#d9ad45;
  --gold2:#f0cb70;
  --text:#f7f5ef;
  --muted:#a9a7a0;
  --green:#49c77b;
  --red:#ef6262;
  --yellow:#e9bd4d;
  --blue:#5ca9e9;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top right,#3b2b12 0,transparent 35%),
    radial-gradient(circle at bottom left,#21190b 0,transparent 35%),
    var(--bg);
}
.login-card{
  width:100%;
  max-width:430px;
  background:rgba(21,21,24,.96);
  border:1px solid var(--line);
  border-radius:22px;
  padding:38px;
  box-shadow:0 30px 80px rgba(0,0,0,.5);
  text-align:center;
}
.logo{
  width:72px;
  height:72px;
  border-radius:20px;
  margin:0 auto 18px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#f1cd72,#9a6b16);
  color:#17120a;
  font-size:35px;
  font-weight:900;
}
.login h1{margin:0;color:var(--gold2);font-size:31px}
.login p{color:var(--muted);margin:7px 0 28px}
.field{text-align:left;margin-bottom:15px}
.field label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:7px;
  font-weight:700;
}
.field input,.field select,.field textarea{
  width:100%;
  background:#101014;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:11px;
  padding:12px 13px;
  outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--gold);
}
.btn{
  border:0;
  border-radius:10px;
  padding:10px 15px;
  font-weight:700;
  color:#16120a;
  background:var(--gold);
}
.btn:hover{background:var(--gold2)}
.btn.secondary{
  background:#25252a;
  color:var(--text);
  border:1px solid var(--line);
}
.btn.danger{background:#632d2d;color:#fff}
.btn.green{background:#27663f;color:#fff}
.btn.small{padding:7px 10px;font-size:12px}
.btn.full{width:100%;padding:13px}

.app{display:flex;min-height:100vh}
.sidebar{
  width:245px;
  flex:none;
  background:#111114;
  border-right:1px solid var(--line);
  padding:20px 14px;
  position:fixed;
  inset:0 auto 0 0;
  overflow:auto;
}
.brand{
  display:flex;
  align-items:center;
  gap:11px;
  padding:5px 10px 24px;
  border-bottom:1px solid var(--line);
  margin-bottom:16px;
}
.brand-mark{
  width:42px;height:42px;border-radius:12px;
  display:grid;place-items:center;
  background:var(--gold);
  color:#16120a;font-weight:900;font-size:22px;
}
.brand b{display:block;color:var(--gold2);font-size:17px}
.brand span{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.nav{
  width:100%;
  background:transparent;
  border:0;
  color:#aaa8a2;
  text-align:left;
  padding:11px 12px;
  border-radius:10px;
  margin:2px 0;
  font-weight:600;
}
.nav:hover{background:#202024;color:#fff}
.nav.active{
  background:linear-gradient(90deg,#3a2b12,#241d10);
  color:var(--gold2);
  border:1px solid #5d471d;
}
.side-bottom{
  border-top:1px solid var(--line);
  margin-top:18px;
  padding-top:15px;
}

.main{
  margin-left:245px;
  width:calc(100% - 245px);
  min-width:0;
}
.topbar{
  height:70px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  background:#101013;
  position:sticky;
  top:0;
  z-index:20;
}
.top-title b{font-size:18px}
.top-title small{display:block;color:var(--muted);margin-top:3px}
.user-badge{
  background:#202024;
  border:1px solid var(--line);
  border-radius:20px;
  padding:8px 13px;
  color:var(--gold2);
  font-size:13px;
}
.content{padding:25px;max-width:1500px;margin:auto}

.page-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}
.page-head h2{margin:0;font-size:25px}
.page-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.cards{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:13px;
  margin-bottom:20px;
}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
  padding:17px;
}
.kpi small{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  font-weight:800;
}
.kpi strong{
  display:block;
  font-size:27px;
  margin-top:9px;
  color:var(--gold2);
}
.kpi span{display:block;color:var(--muted);font-size:11px;margin-top:5px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:17px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}
.card h3{margin:0 0 15px;font-size:16px}
.muted{color:var(--muted)}
.notice{
  background:#201b10;
  border:1px solid #4b3b1a;
  border-radius:11px;
  padding:12px;
  color:#dfc477;
  font-size:13px;
}
.success{color:var(--green)}
.error{color:var(--red)}

.table-wrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:12px;
}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{
  padding:11px 12px;
  border-bottom:1px solid var(--line);
  text-align:left;
  font-size:12px;
}
th{
  color:var(--muted);
  background:#111114;
  text-transform:uppercase;
  font-size:10px;
}
tr:last-child td{border-bottom:0}
.status{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  background:#29292e;
  color:#d7d5cf;
  font-size:10px;
  font-weight:800;
}
.status.green{background:#173b28;color:#69d995}
.status.red{background:#452022;color:#ff8585}
.status.yellow{background:#423615;color:#f0cb70}

.search{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}
.search input{
  flex:1;
  background:#101014;
  border:1px solid var(--line);
  border-radius:10px;
  color:#fff;
  padding:11px 13px;
}

.modal-back{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}
.modal-back.show{display:flex}
.modal{
  width:min(850px,100%);
  max-height:90vh;
  overflow:auto;
  background:#17171a;
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 30px 90px #000;
}
.modal-head{
  padding:18px 20px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.modal-head h2{margin:0;font-size:19px}
.modal-body{padding:20px}
.modal-foot{
  padding:15px 20px;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:flex-end;
  gap:8px;
}
.close{
  background:#29292d;border:0;color:#fff;
  width:32px;height:32px;border-radius:9px;
}
.formgrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}
.formgrid .fullrow{grid-column:1/-1}

.profile{
  display:grid;
  grid-template-columns:150px 1fr;
  gap:20px;
}
.avatar{
  width:125px;height:125px;border-radius:25px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#3c2e14,#1e1b15);
  border:1px solid #6a5120;
  color:var(--gold2);
  font-size:42px;font-weight:900;
}
.info-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.info-item{
  background:#111114;
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
}
.info-item small{display:block;color:var(--muted);font-size:10px}
.info-item b{display:block;margin-top:4px}

.empty{
  text-align:center;
  color:var(--muted);
  padding:35px 15px;
}

.mobile-menu{display:none}

@media(max-width:1050px){
  .cards{grid-template-columns:repeat(3,1fr)}
  .grid2,.grid3{grid-template-columns:1fr}
}
@media(max-width:760px){
  .sidebar{
    transform:translateX(-100%);
    transition:.2s;
    z-index:80;
  }
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;width:100%}
  .mobile-menu{
    display:block;
    background:#25252a;
    border:1px solid var(--line);
    color:#fff;
    border-radius:8px;
    padding:7px 10px;
  }
  .cards{grid-template-columns:repeat(2,1fr)}
  .content{padding:15px}
  .topbar{padding:0 15px}
  .formgrid,.info-list{grid-template-columns:1fr}
  .profile{grid-template-columns:1fr}
}
@media(max-width:480px){
  .cards{grid-template-columns:1fr}
  .page-head{align-items:flex-start;flex-direction:column}
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="login" class="login">
  <div class="login-card">
    <div class="logo">E</div>
    <h1>EmpoderArte</h1>
    <p>Sistema Integral de Gestión</p>

    <div class="field">
      <label>USUARIO / CORREO</label>
      <input id="loginUser" autocomplete="username" placeholder="director@empoderarte.local">
    </div>

    <div class="field">
      <label>CONTRASEÑA</label>
      <input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>

    <button class="btn full" onclick="login()">Iniciar sesión</button>
    <div id="loginMsg" class="muted" style="margin-top:15px;font-size:12px"></div>

    <div style="margin-top:25px;font-size:11px;color:#666">
      EmpoderArte · Sistema de Gestión
    </div>
  </div>
</section>

<!-- APP -->
<section id="app" class="app hidden">

  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="brand-mark">E</div>
      <div>
        <b>EmpoderArte</b>
        <span>Escuela de Danza</span>
      </div>
    </div>

    <nav>
      <button data-view="dashboard" class="nav active">⌂ Dashboard</button>
      <button data-view="alumnos" class="nav">♙ Alumnos</button>
      <button data-view="recepcion" class="nav">▣ Recepción</button>
      <button data-view="mensualidades" class="nav">◷ Mensualidades</button>
      <button data-view="pagos" class="nav">＄ Pagos</button>
      <button data-view="asistencia" class="nav">✓ Asistencia</button>
      <button data-view="promociones" class="nav">✦ Promociones</button>
      <button data-view="beneficios" class="nav">★ Beneficios</button>
      <button data-view="credenciales" class="nav">▤ Credenciales QR</button>
      <button data-view="reportes" class="nav">▥ Reportes</button>
      <button data-view="usuarios" class="nav director-only">⚙ Usuarios</button>
      <button data-view="auditoria" class="nav director-only">◉ Auditoría</button>
    </nav>

    <div class="side-bottom">
      <button class="nav" onclick="logout()">↪ Cerrar sesión</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="mobile-menu" onclick="toggleMenu()">☰</button>
        <div class="top-title">
          <b id="pageTitle">Dashboard</b>
          <small id="today"></small>
        </div>
      </div>
      <div id="userBadge" class="user-badge">Director</div>
    </header>

    <div id="content" class="content"></div>
  </main>
</section>

<!-- MODAL -->
<div id="modalBack" class="modal-back" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
    <div id="modalFoot" class="modal-foot"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const tokenKey='emp_token';
const userKey='emp_user';

let token=localStorage.getItem(tokenKey)||'';
let currentUser=null;

try{
  currentUser=JSON.parse(localStorage.getItem(userKey)||'null');
}catch(e){currentUser=null}

function esc(v){
  return String(v??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function money(v){
  return '$'+Number(v||0).toLocaleString('es-MX',{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}

function dateMx(v){
  if(!v)return '—';
  const d=new Date(v);
  if(isNaN(d))return esc(v);
  return d.toLocaleDateString('es-MX');
}

function todayISO(){
  return new Date().toISOString().slice(0,10);
}

function setToday(){
  $('today').textContent=new Date().toLocaleDateString('es-MX',{
    weekday:'long',
    year:'numeric',
    month:'long',
    day:'numeric'
  });
}

async function api(url,options={}){
  const opts={...options,headers:{...(options.headers||{})}};
  if(!opts.headers['Content-Type'] && opts.body)opts.headers['Content-Type']='application/json';
  if(token)opts.headers.Authorization='Bearer '+token;

  const r=await fetch(url,opts);
  let data=null;

  try{data=await r.json()}catch(e){
    data={message:await r.text()};
  }

  if(r.status===401){
    logout();
    throw new Error('La sesión ha vencido. Inicia sesión nuevamente.');
  }

  if(!r.ok){
    throw new Error(data?.message||data?.error||'No se pudo completar la operación.');
  }

  return data;
}

function openModal(title,body,foot=''){
  $('modalTitle').textContent=title;
  $('modalBody').innerHTML=body;
  $('modalFoot').innerHTML=foot;
  $('modalBack').classList.add('show');
}

function closeModal(){
  $('modalBack').classList.remove('show');
}
function closeModalOutside(e){
  if(e.target.id==='modalBack')closeModal();
}

function toggleMenu(){
  $('sidebar').classList.toggle('open');
}

function logout(){
  token='';
  currentUser=null;
  localStorage.removeItem(tokenKey);
  localStorage.removeItem(userKey);
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
}

async function login(){
  const email=$('loginUser').value.trim();
  const password=$('loginPass').value;

  if(!email||!password){
    $('loginMsg').textContent='Escribe usuario y contraseña.';
    return;
  }

  $('loginMsg').textContent='Conectando...';

  try{
    const data=await api('/api/login',{
      method:'POST',
      body:JSON.stringify({email,password,usuario:email})
    });

    token=data.token||data.accessToken||data.jwt||'';
    currentUser=data.user||data.usuario||data;

    localStorage.setItem(tokenKey,token);
    localStorage.setItem(userKey,JSON.stringify(currentUser));

    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');

    applyRole();
    setToday();
    showView(currentUser?.rol==='recepcion'?'recepcion':'dashboard');

  }catch(e){
    $('loginMsg').innerHTML='<span class="error">'+esc(e.message)+'</span>';
  }
}

function applyRole(){
  const role=String(currentUser?.rol||currentUser?.role||'director').toLowerCase();
  const isDirector=role==='director'||role==='admin'||role==='administrador';

  document.querySelectorAll('.director-only').forEach(x=>{
    x.style.display=isDirector?'block':'none';
  });

  $('userBadge').textContent=isDirector?'👑 Director':'🧑‍💼 Recepción';
}

function navSetup(){
  document.querySelectorAll('.nav[data-view]').forEach(b=>{
    b.addEventListener('click',()=>{
      showView(b.dataset.view);
      $('sidebar').classList.remove('open');
    });
  });
}

const titles={
  dashboard:'Dashboard',
  alumnos:'Alumnos',
  recepcion:'Recepción',
  mensualidades:'Mensualidades',
  pagos:'Pagos',
  asistencia:'Asistencia',
  promociones:'Promociones',
  beneficios:'Beneficios',
  credenciales:'Credenciales QR',
  reportes:'Reportes',
  usuarios:'Usuarios',
  auditoria:'Auditoría'
};

async function showView(view){
  document.querySelectorAll('.nav[data-view]').forEach(b=>{
    b.classList.toggle('active',b.dataset.view===view);
  });

  $('pageTitle').textContent=titles[view]||view;

  const loaders={
    dashboard:renderDashboard,
    alumnos:renderStudents,
    recepcion:renderReception,
    mensualidades:renderMonthly,
    pagos:renderPayments,
    asistencia:renderAttendance,
    promociones:renderPromotions,
    beneficios:renderBenefits,
    credenciales:renderCredentials,
    reportes:renderReports,
    usuarios:renderUsers,
    auditoria:renderAudit
  };

  try{
    await (loaders[view]||renderDashboard)();
  }catch(e){
    $('content').innerHTML=
      '<div class="card"><div class="error">No se pudo cargar esta sección.</div>'+
      '<p class="muted">'+esc(e.message)+'</p></div>';
  }
}

async function renderDashboard(){
  $('content').innerHTML='<div class="card">Cargando información...</div>';

  let d={};
  try{d=await api('/api/dashboard')}catch(e){
    d={};
  }

  const active=d.active??d.activeStudents??d.alumnosActivos??0;
  const overdue=d.overdue??d.vencidos??0;
  const upcoming=d.upcoming??d.dueSoon??d.proximos??0;
  const collected=d.collected??d.revenue??d.ingresos??0;
  const total=d.total??d.students??d.alumnos??0;

  $('content').innerHTML=`
    <div class="page-head">
      <div>
        <h2>Bienvenida a EmpoderArte</h2>
        <p>Panel general de administración de la academia.</p>
      </div>
      <div class="actions">
        <button class="btn" onclick="newStudent()">+ Nuevo alumno</button>
        <button class="btn secondary" onclick="showView('pagos')">Registrar pago</button>
      </div>
    </div>

    <div class="cards">
      <div class="card kpi">
        <small>Alumnos registrados</small>
        <strong>${esc(total)}</strong>
        <span>Base general</span>
      </div>
      <div class="card kpi">
        <small>Alumnos activos</small>
        <strong>${esc(active)}</strong>
        <span>Con inscripción vigente</span>
      </div>
      <div class="card kpi">
        <small>Vencidos</small>
        <strong>${esc(overdue)}</strong>
        <span>Requieren seguimiento</span>
      </div>
      <div class="card kpi">
        <small>Próximos vencimientos</small>
        <strong>${esc(upcoming)}</strong>
        <span>Próximos 7 días</span>
      </div>
      <div class="card kpi">
        <small>Recaudación</small>
        <strong>${money(collected)}</strong>
        <span>Pagos registrados</span>
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <h3>Acciones rápidas</h3>
        <div class="grid2">
          <button class="btn secondary" onclick="newStudent()">♙ Alta de alumno</button>
          <button class="btn secondary" onclick="showView('pagos')">＄ Registrar pago</button>
          <button class="btn secondary" onclick="showView('asistencia')">✓ Registrar asistencia</button>
          <button class="btn secondary" onclick="showView('credenciales')">▤ Credencial QR</button>
        </div>
      </div>

      <div class="card">
        <h3>Estado del sistema</h3>
        <div class="notice">
          <b>Base de datos conectada</b><br>
          La aplicación está trabajando con la información almacenada en el servidor.
        </div>
        <p class="muted" style="font-size:12px">
          Usa el menú lateral para administrar alumnos, mensualidades, pagos y demás módulos.
        </p>
      </div>
    </div>
  `;
}

async function renderStudents(){
  $('content').innerHTML='<div class="card">Cargando alumnos...</div>';

  const data=await api('/api/students');
  const rows=Array.isArray(data)?data:(data.students||data.alumnos||data.rows||[]);

  window.studentsCache=rows;

  $('content').innerHTML=`
    <div class="page-head">
      <div>
        <h2>Alumnos</h2>
        <p>Registro, matrícula y ficha principal de cada alumno.</p>
      </div>
      <button class="btn" onclick="newStudent()">+ Nuevo alumno</button>
    </div>

    <div class="card">
      <div class="search">
        <input id="studentSearch" placeholder="Buscar por nombre, matrícula, teléfono o correo..." oninput="filterStudents()">
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Matrícula</th>
              <th>Alumno</th>
              <th>Teléfono</th>
              <th>Plan</th>
              <th>Cuota</th>
              <th>Estado</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="studentsBody">
            ${studentRows(rows)}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function studentRows(rows){
  if(!rows.length){
    return '<tr><td colspan="7"><div class="empty">Todavía no hay alumnos registrados.</div></td></tr>';
  }

  return rows.map(s=>{
    const name=[s.nombre,s.apellidos].filter(Boolean).join(' ')||s.name||s.nombre_completo||'Sin nombre';
    const matricula=s.matricula||s.student_number||s.numero||'—';
    const status=s.estado||s.status||'Activo';
    const plan=s.plan||s.plan_nombre||'—';
    const cuota=s.cuota_mensual??s.mensualidad??s.fee??0;

    return `
      <tr>
        <td><b>${esc(matricula)}</b></td>
        <td>${esc(name)}</td>
        <td>${esc(s.telefono||s.phone||'—')}</td>
        <td>${esc(plan)}</td>
        <td>${money(cuota)}</td>
        <td><span class="status ${String(status).toLowerCase().includes('activo')?'green':'yellow'}">${esc(status)}</span></td>
        <td>
          <button class="btn small secondary" onclick="studentFile(${Number(s.id||s.student_id)})">Ver ficha</button>
        </td>
      </tr>
    `;
  }).join('');
}

function filterStudents(){
  const q=($('studentSearch')?.value||'').toLowerCase();
  const rows=(window.studentsCache||[]).filter(s=>
    JSON.stringify(s).toLowerCase().includes(q)
  );
  $('studentsBody').innerHTML=studentRows(rows);
}

        <div style="margin:25px auto;width:150px;height:150px;background:#fff;color:#111;display:grid;place-items:center;font-size:70px;border-radius:12px">
          ▦
        </div>

        <small class="muted">
          Credencial digital EmpoderArte
        </small>
      </div>
      `,
      '<button class="btn secondary" onclick="closeModal()">Cerrar</button>'+
      '<button class="btn" onclick="window.print()">Imprimir</button>'

  }catch(e){
    alert('No se pudo generar la credencial:\\n'+e.message);
  }
}
