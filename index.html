<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EmpoderArte | Sistema Integral</title>
<style>
:root{--p:#6b3fa0;--g:#d4a84f;--bg:#f7f4fa;--ink:#30253b;--mut:#756b7d;--ok:#27844b;--bad:#bd3d49;--warn:#a97818}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:#2d2138;color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:3px;position:fixed;inset:0 auto 0 0;width:250px;overflow:auto}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:25px;color:#fff;padding:8px 10px 18px;border-bottom:1px solid #ffffff18;margin-bottom:8px}.brand small{display:block;font-size:10px;font-weight:500;color:#d9cce4}.nav{border:0;background:transparent;color:#e8dff0;text-align:left;padding:10px 11px;border-radius:9px;font-weight:700}.nav:hover,.nav.active{background:#ffffff16;color:#fff}.nav.director-only{display:none}.main{padding:25px;min-width:0;margin-left:250px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:26px}.top-right{display:flex;gap:8px;align-items:center}.top-right input{width:320px}.cards{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:14px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 6px 25px #2d21380d}.metric{font-size:28px;font-weight:900;margin-top:5px}.muted{color:var(--mut);font-size:13px}.section{margin-top:18px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.sectionhead h2,.sectionhead h3{margin:0}.tablewrap{overflow:auto;background:#fff;border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px;border-bottom:1px solid #eee7f0;text-align:left}.table th{font-size:12px;color:var(--mut);text-transform:uppercase}.status{display:inline-block;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800}.ok{background:#e8f7ed;color:var(--ok)}.bad{background:#fde9eb;color:var(--bad)}.warn{background:#fff5dc;color:var(--warn)}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#f0ebf5}.grid2,.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:9px 13px;font-weight:700}.primary{background:var(--p);color:white}.gold{background:var(--g);color:#2f2415}.light{background:#f0ebf5;color:var(--ink)}.danger{background:#fde7e9;color:#9e2835}.notice{padding:12px;border-radius:10px;background:#faf7fc;border:1px solid #e6ddec}.empty{text-align:center;padding:30px;color:var(--mut)}label{display:block;font-size:13px;font-weight:700;margin:9px 0 5px}input,select,textarea{width:100%;padding:10px 11px;border:1px solid #ddd3e6;border-radius:10px;background:#fff;color:var(--ink)}textarea{min-height:90px}.modal{position:fixed;inset:0;background:#2d213899;display:grid;place-items:center;padding:18px;z-index:50}.modalbox{background:#fff;border-radius:18px;padding:20px;width:min(850px,96vw);max-height:92vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0}.qr{width:180px;height:180px;background:#fff;border:1px dashed #bbb;display:grid;place-items:center;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee7f0}.toast{position:fixed;right:20px;bottom:20px;background:#2d2138;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:100}.small{font-size:12px}.subcard{background:#faf8fc;border:1px solid #eee7f0;border-radius:12px;padding:14px}.topbadge{padding:9px 12px;border-radius:10px;background:#fff0c9;color:#6a4b00;font-weight:800}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:800px){.app{display:block}.side{position:static;width:100%;height:auto}.main{margin:0;padding:15px}.top{display:block}.top-right{margin-top:10px}.top-right input{width:100%}.grid2,.formgrid{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}@media(max-width:520px){.cards{grid-template-columns:1fr}}
</style>
<style id="empoderarte-functional-style">
/* ===== CORRECCIÓN DE DISEÑO EMPODERARTE ===== */
.app{
  min-height:100vh;
  display:block;
}
.side{
  position:fixed;
  top:0;
  left:0;
  bottom:0;
  width:250px;
  z-index:20;
  background:var(--side,#2d2138);
}
.main{
  margin-left:250px;
  width:calc(100% - 250px);
  min-width:0;
  min-height:100vh;
  padding:28px 34px 40px;
}
.top{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:24px;
  margin-bottom:28px;
}
.top h1{
  margin:2px 0 0;
  font-size:30px;
  line-height:1.15;
}
.top-right{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:10px;
  flex:1;
}
.top-right input{
  width:min(360px,32vw);
}
.cards{
  width:100%;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}
.card{
  min-width:0;
}
.section{
  width:100%;
  margin-top:20px;
}
.tablewrap{
  width:100%;
  overflow:auto;
}
.brand-logo{
  width:42px;
  height:42px;
  object-fit:cover;
  border-radius:10px;
  background:#fff;
  flex:none;
}
.login-logo{
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:18px;
  margin:0 auto 10px;
  display:block;
}
.settings-logo{
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:16px;
  border:1px solid #ddd3e6;
  background:#fff;
  display:block;
  margin:8px 0;
}
@media(max-width:1000px){
  .main{padding:24px;}
  .top-right input{width:280px;}
  .cards{grid-template-columns:repeat(2,minmax(220px,1fr));}
}
@media(max-width:800px){
  .side{position:static;width:100%;height:auto;}
  .main{margin-left:0;width:100%;padding:18px;}
  .top{display:block;}
  .top-right{margin-top:14px;justify-content:stretch;flex-wrap:wrap;}
  .top-right input{width:100%;flex:1 1 100%;}
  .grid2,.formgrid{grid-template-columns:1fr;}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media(max-width:520px){
  .main{padding:14px;}
  .cards{grid-template-columns:1fr;}
  .top h1{font-size:26px;}
}
</style>

<style id="biometric-style">.bio-btn{background:#f5f0ff;color:#4e2f7d;border:1px solid #d8c8ee}.bio-note{padding:12px;border-radius:10px;background:#f7f3fb;border:1px solid #e4d8ef}.bio-badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8f7ed;color:#27844b;font-size:12px;font-weight:800}</style>
</head><body>
<section id="login" class="modal" style="background:linear-gradient(135deg,#f7efff,#fff9ef)"><div class="modalbox" style="width:min(430px,95vw);text-align:center"><img id="loginLogo" class="login-logo" src="/logo-empoderarte.jpg" alt="EmpoderArte"><div id="loginSchoolName" style="font-size:34px;font-weight:900;color:var(--p)">EmpoderArte</div><p id="loginSubtitle" class="muted">Sistema Integral de Gestión · Escuela de Danza</p><label style="text-align:left">Correo</label><input id="email" value="director@empoderarte.local"><label style="text-align:left">Contraseña</label><input id="password" type="password" value="empoderarte"><button id="loginBtn" type="button" class="btn primary" style="width:100%;margin-top:15px;pointer-events:auto;position:relative;z-index:2">🚀 Entrar al sistema</button><p class="small muted">Versión integral · datos en PostgreSQL</p></div></section>
<section id="app" class="app hidden"><aside class="side"><div class="brand"><img id="brandLogo" class="brand-logo" src="/logo-empoderarte.jpg" alt="EmpoderArte"><div id="brandText">EmpoderArte<small>Escuela de Danza</small></div></div>
<button class="nav active" data-v="dashboard">🏠 Dashboard</button><button class="nav" data-v="students">👩‍🎓 Alumnos</button><button class="nav" data-v="attendanceAlumnos">✓ Asistencia alumnos</button><button class="nav" data-v="teachers">👩‍🏫 Maestros</button><button class="nav" data-v="personal">👥 Personal</button><button class="nav director-only" data-v="payroll">💰 Nómina</button><button class="nav" data-v="reception">▣ Recepción</button><button class="nav" data-v="monthly">◷ Mensualidades</button><button class="nav" data-v="lockers">▣ Lockers</button><button class="nav" data-v="payments">$ Pagos</button><button class="nav" data-v="promotions">✦ Promociones</button><button class="nav" data-v="benefits">★ Beneficios</button><button class="nav" data-v="credential">▤ Credenciales QR</button><button class="nav" data-v="reports">▥ Reportes</button><button class="nav" data-v="alerts">🔔 Vencimientos</button><button class="nav director-only" data-v="users">♟ Usuarios</button><button class="nav director-only" data-v="audit">☷ Bitácora</button><button class="nav director-only" data-v="trash">⌫ Papelera</button><button class="nav director-only" data-v="settings">⚙ Configuración</button>
<div style="margin-top:auto;padding-top:15px"><div id="userBadge" class="small"></div><button class="nav" onclick="logout()">↪ Cerrar sesión</button></div></aside>
<main class="main"><div class="top"><div><div class="muted">EMPODERARTE</div><h1 id="title">Dashboard</h1></div><div class="top-right"><input id="globalSearch" placeholder="Buscar alumno, matrícula o teléfono..." oninput="globalSearch(this.value)"><button class="btn gold" onclick="view('credential')">📷 QR</button><span id="clock" class="topbadge"></span></div></div><div id="content"></div></main></section><div id="toast" class="toast"></div><div id="modalHost"></div>
<script>
let token=localStorage.emp_token||'',user=JSON.parse(localStorage.emp_user||'null'),appConfig={};let currentView='dashboard';const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
async function api(url,opt={}){const base={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};let last;for(let i=0;i<2;i++){try{const r=await fetch(url,{...opt,headers:base});const text=await r.text();let d={};try{d=text?JSON.parse(text):{}}catch(_){d={error:text||'Respuesta inválida del servidor'}}if(r.status===401){localStorage.removeItem('emp_token');localStorage.removeItem('emp_user');throw Error('Tu sesión expiró. Recarga la página e inicia sesión nuevamente.')}if(!r.ok)throw Error(d.error||('Error HTTP '+r.status));return d}catch(e){last=e;if(i===0){await new Promise(r=>setTimeout(r,900));continue}throw last}}}
function toast(x){$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}
function modal(title,body,action,fn){$('modalHost').innerHTML=`<div class="modal"><div class="modalbox"><div class="modalhead"><h2>${title}</h2><button type="button" class="btn light" onclick="closeModal()">×</button></div>${body}<div class="actions" style="margin-top:16px"><button type="button" class="btn primary" id="modalGo" style="pointer-events:auto;position:relative;z-index:2">${action}</button><button type="button" class="btn light" onclick="closeModal()">Cancelar</button></div></div></div>`;const go=$('modalGo');if(go){go.addEventListener('click',async e=>{e.preventDefault();e.stopPropagation();try{await fn()}catch(e){console.error(e);alert(e.message||'No se pudo completar la operación')}})}}
function closeModal(){$('modalHost').innerHTML=''}
async function login(){try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})}),d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;user=d.user;localStorage.emp_token=token;localStorage.emp_user=JSON.stringify(user);boot()}catch(e){alert(e.message)}}
function logout(){localStorage.removeItem('emp_token');localStorage.removeItem('emp_user');location.reload()}
async function boot(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('userBadge').textContent='👤 '+user.name+' · '+user.role;document.querySelectorAll('.director-only').forEach(x=>x.style.display=user.role==='director'?'block':'none');try{appConfig=await api('/api/settings');applySettings(appConfig)}catch(e){}view(user.role==='director'?'dashboard':'reception')}
const titles={dashboard:'Dashboard',students:'Alumnos',attendanceAlumnos:'Asistencia alumnos',teachers:'Maestros',personal:'Personal',payroll:'Nómina',reception:'Recepción',monthly:'Mensualidades',lockers:'Lockers',payments:'Pagos',promotions:'Promociones',benefits:'Beneficios',credential:'Credenciales QR',reports:'Reportes',alerts:'Vencimientos',users:'Usuarios',audit:'Bitácora',trash:'Papelera',settings:'Configuración'};
async function view(v){if(['payroll','users','audit','trash','settings'].includes(v)&&user?.role!=='director'){alert('Esta sección es exclusiva del Director.');return}currentView=v;document.querySelectorAll('.nav[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===v));$('title').textContent=titles[v]||v;$('content').innerHTML='<div class="card"><div class="muted">Cargando '+esc(titles[v]||v)+'…</div></div>';try{const modules={dashboard,students,attendanceAlumnos,teachers,personal,payroll,reception,monthly,lockers,payments,promotions,benefits,credential,reports,alerts,users,audit,trash,settings};const f=modules[v];if(typeof f==='function'){await f()}else{$('content').innerHTML='<div class="card"><div class="empty">Módulo no disponible.</div></div>'}}catch(e){console.error(e);$('content').innerHTML='<div class="card"><h3>⚠️ No se pudo cargar '+esc(titles[v]||v)+'</h3><div class="notice">'+esc(e.message||'Error desconocido')+'</div><br><button class="btn primary" onclick="view(\''+v+'\')">↻ Reintentar</button></div>'}}
function status(x){return x==='Vencido'?'<span class="status bad">Vencido</span>':x==='Próximo'?'<span class="status warn">Próximo</span>':x==='Al corriente'?'<span class="status ok">Al corriente</span>':'<span class="pill">'+esc(x||'—')+'</span>'}
function payTable(rows){return rows?.length?'<div class="tablewrap"><table class="table"><tr><th>Recibo</th><th>Alumno</th><th>Concepto</th><th>Monto</th><th>Método</th><th>Fecha</th><th></th></tr>'+rows.map(p=>`<tr><td><b>${esc(p.receipt_no)}</b></td><td>${esc(p.matricula)} · ${esc(p.name)} ${esc(p.last_name)}</td><td>${esc(p.concept)}</td><td>$${(+p.amount).toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td>${esc(p.method)}</td><td>${fmtDate(p.paid_at)}</td><td>${user?.role==='director'?`<button class="btn danger" onclick="removeRecord('PAGO',${p.id},'el pago')">🗑 Eliminar</button>`:''}</td></tr>`).join('')+'</table></div>':'<div class="empty">Aún no hay registros.</div>'}
async function dashboard(){const d=await api('/api/dashboard');const nuevos=Array.isArray(d.new_income_students)?d.new_income_students:[];const nuevosHtml=nuevos.length?`<div class="tablewrap"><table class="table"><tr><th>Alumno</th><th>Matrícula</th><th>Fecha de ingreso</th><th>Plan</th><th></th></tr>${nuevos.map(s=>`<tr><td><b>${esc(s.name)} ${esc(s.last_name)}</b></td><td>${esc(s.matricula)}</td><td>${fmtDate(s.enrollment_date)}</td><td>${esc(s.plan||'—')}</td><td><button class="btn light" onclick="profile(${s.id})">Ficha</button></td></tr>`).join('')}</table></div>`:'<div class="empty">No hay alumnos marcados como NUEVO INGRESO en este mes.</div>';$('content').innerHTML=`<div class="cards"><div class="card"><div class="muted">Alumnos activos</div><div class="metric">${d.active}</div></div><div class="card"><div class="muted">Maestros</div><div class="metric">${d.teachers||0}</div></div><div class="card"><div class="muted">Vencidos</div><div class="metric">${d.overdue}</div></div><div class="card"><div class="muted">Vencen en 7 días</div><div class="metric">${d.upcoming}</div></div><div class="card"><div class="muted">Cobrado este mes</div><div class="metric">$${(+d.revenue).toLocaleString('es-MX')}</div></div><div class="card"><div class="muted">Nuevos ingresos del mes</div><div class="metric">${d.monthly_enrollments||0}</div></div></div><div class="section card"><div class="sectionhead"><h3>🆕 Nuevos ingresos del mes</h3><span class="pill">NUEVO INGRESO</span></div>${nuevosHtml}</div><div class="section card"><div class="sectionhead"><h3>Próximos vencimientos</h3><button class="btn light" onclick="view('monthly')">Ver mensualidades</button></div>${d.exp.length?'<div class="tablewrap"><table class="table"><tr><th>Alumno</th><th>Vencimiento</th><th>Estado</th><th></th></tr>'+d.exp.map(s=>`<tr><td>${esc(s.matricula)} · ${esc(s.name)} ${esc(s.last_name)}</td><td>${fmtDate(s.due_date)}</td><td>${status(s.payment_status||'Próximo')}</td><td><button class="btn gold" onclick="payFor(${s.id})">Cobrar</button></td></tr>`).join('')+'</table></div>':'<div class="empty">No hay vencimientos próximos.</div>'}</div><div class="section card"><h3>Últimos pagos</h3>${payTable(d.recent)}</div>`}
async function paymentAdjustedStudents(list){const r=Array.isArray(list)?list:[];const fixed=await Promise.all(r.map(async s=>{try{const charges=await api('/api/students/'+s.id+'/monthly-charges');const open=(Array.isArray(charges)?charges:[]).filter(c=>Number(c.balance||0)>0).sort((a,b)=>String(a.due_date||a.period_start||'').localeCompare(String(b.due_date||b.period_start||'')));const first=open[0];if(first){const due=first.due_date||s.due_date;const d=due?new Date(String(due)+'T12:00:00'):null;const today=new Date();today.setHours(12,0,0,0);return {...s,payment_status:d&&d<today?'Vencido':'Pendiente',due_date:due,charge_balance:Number(first.balance||0),charge_period:first.period_start||''};}return {...s,payment_status:'Al corriente',charge_balance:0};}catch(e){return s;}}));return fixed}
async function students(){const data=await api('/api/students');const r=await paymentAdjustedStudents(data);$('content').innerHTML=`<div class="sectionhead"><input id="studentSearch" style="max-width:430px" placeholder="Buscar matrícula o nombre" oninput="searchStudents(this.value)"><button class="btn primary" onclick="newStudent()">＋ Nuevo alumno</button></div><div class="tablewrap"><table class="table" id="studentTable"><tr><th>Matrícula</th><th>Alumno</th><th>Plan</th><th>Cuota</th><th>Vencimiento</th><th>Estado</th><th></th></tr>${r.length?r.map(studentRow).join(''):'<tr><td colspan="7"><div class="empty">No hay alumnos registrados todavía.</div></td></tr>'}</table></div>`}
function studentRow(s){return `<tr><td><b>${esc(s.matricula)}</b></td><td>${esc(s.name)} ${esc(s.last_name)}<div class="muted">${esc(s.phone)}</div></td><td>${esc(s.plan)}</td><td>$${(+s.monthly_fee).toLocaleString('es-MX')}</td><td>${fmtDate(s.due_date)}</td><td>${status(s.payment_status)}</td><td class="actions"><button class="btn light" onclick="profile(${s.id})">Ficha</button><button class="btn bio-btn" onclick="biometricFor('student',${s.id},'${esc(s.name+' '+s.last_name)}')">🖐 Huella</button><button class="btn gold" onclick="payFor(${s.id})">Cobrar</button>${user?.role==='director'?`<button class="btn danger" onclick="removeRecord('ALUMNO',${s.id},'el alumno')">🗑 Eliminar</button>`:''}</td></tr>`}
async function searchStudents(q){const data=await api('/api/students?q='+encodeURIComponent(q));const r=await paymentAdjustedStudents(data);$('studentTable').innerHTML='<tr><th>Matrícula</th><th>Alumno</th><th>Plan</th><th>Cuota</th><th>Vencimiento</th><th>Estado</th><th></th></tr>'+r.map(studentRow).join('')}
function defaultDueDate(){const now=new Date(),day=Math.min(31,Math.max(1,Number(appConfig.default_due_day||10)));let y=now.getFullYear(),m=now.getMonth()+1;if(m>11){m=0;y++}const last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(day,last),12).toISOString().slice(0,10)}
function newStudent(){modal('Nuevo alumno',`<div class="formgrid"><div><label>Nombre *</label><input id="sn"></div><div><label>Apellidos *</label><input id="sl"></div><div><label>Fecha de nacimiento</label><input id="sb" type="date"></div><div><label>Teléfono / WhatsApp</label><input id="sp"></div><div><label>Correo</label><input id="se"></div><div><label>Tutor / contacto</label><input id="st"></div><div><label>Teléfono tutor</label><input id="stp"></div><div><label>Plan</label><select id="spl"><option>Inicial</option><option>Plus</option><option>Premium</option><option>Elite</option></select></div><div><label>Cuota mensual</label><input id="sf" type="number" min="0" value="600"></div><div><label>Primer vencimiento</label><input id="sd" type="date"><div class="small muted">Este día se conservará como día habitual de pago.</div></div><div><label>Nivel de beneficio</label><select id="sbl"><option>Base</option><option>Plus</option><option>Premium</option><option>Elite</option></select></div><div class="full"><label>Notas</label><textarea id="sno"></textarea></div></div>`,'Crear matrícula',async()=>{const due=$('sd').value||defaultDueDate();const d=await api('/api/students',{method:'POST',body:JSON.stringify({name:$('sn').value,last_name:$('sl').value,birth_date:$('sb').value,phone:$('sp').value,email:$('se').value,tutor:$('st').value,tutor_phone:$('stp').value,plan:$('spl').value,monthly_fee:Number($('sf').value||0),due_date:due,benefit_level:$('sbl').value,notes:$('sno').value,billing_day:Number(($('sd').value||due).slice(-2))})});closeModal();toast('Alumno creado: '+d.matricula);students()})}
async function profile(id){const s=await api('/api/students/'+id);const ah=s.attendance?.length?'<div class="tablewrap"><table class="table"><tr><th>Fecha</th><th>Estatus</th><th>Género</th><th></th></tr>'+s.attendance.map(a=>`<tr><td>${fmtDate(a.attended_at)}</td><td>${esc(a.status)}</td><td>${esc(a.discipline||'Acceso ilimitado')}</td><td>${user?.role==='director'?`<button class="btn danger" onclick="removeRecord('ASISTENCIA',${a.id},'la asistencia')">🗑 Eliminar</button>`:''}</td></tr>`).join('')+'</table></div>':'<div class="empty">Sin asistencia.</div>';const ch=s.monthly_charges||[];const cht=ch.length?'<div class="tablewrap"><table class="table"><tr><th>Periodo</th><th>Vence</th><th>Cuota</th><th>Pagado</th><th>Saldo</th><th>Estado</th></tr>'+ch.map(x=>`<tr><td>${fmtDate(x.period_start)}</td><td>${fmtDate(x.due_date)}</td><td>$${(+x.amount).toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td>$${(+x.paid_amount).toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td>$${(+x.balance).toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td>${status(x.status)}</td></tr>`).join('')+'</table></div>':'<div class="empty">Sin cargos mensuales.</div>';modal('Ficha · '+esc(s.matricula),`<div class="grid2"><div><p><b>Alumno:</b> ${esc(s.name)} ${esc(s.last_name)}</p><p><b>Plan:</b> ${esc(s.plan)}</p><p><b>Cuota:</b> $${(+s.monthly_fee).toLocaleString('es-MX')}</p><p><b>Día habitual de pago:</b> ${s.billing_day||String(s.due_date||'').slice(-2)||'—'}</p><p><b>Próximo pago:</b> ${fmtDate(s.due_date)}</p><p><b>Acceso:</b> ${s.due_date&&s.due_date<=todayLocal()?'🔒 Restringido':'🟢 Vigente'}</p><p><b>Beneficio:</b> ${esc(s.benefit_level)}</p></div><div><p><b>Teléfono:</b> ${esc(s.phone)}</p><p><b>Correo:</b> ${esc(s.email)}</p><p><b>Tutor:</b> ${esc(s.tutor)}</p><p><b>Contacto:</b> ${esc(s.tutor_phone)}</p></div></div><hr><div class="actions" style="justify-content:flex-start;gap:10px;flex-wrap:wrap"><button type="button" class="btn light" onclick="editStudent(${id})">✏️ Editar ficha</button><button type="button" class="btn gold" onclick="closeModal();payFor(${id})">💵 Registrar pago</button></div><hr><h3>Historial de mensualidades</h3>${cht}<hr><h3>Historial de pagos</h3>${payTable(s.payments)}<hr><h3>Asistencia reciente</h3>${ah}`,'Cerrar',closeModal)}
async function payFor(id){if(!id){const ss=await api('/api/students');modal('Seleccionar alumno',`<label>Alumno</label><select id="pick">${ss.map(s=>`<option value="${s.id}">${esc(s.matricula)} · ${esc(s.name)} ${esc(s.last_name)}</option>`).join('')}</select>`,'Continuar',()=>{const x=$('pick');closeModal();payFor(+x.value)});return}const [s,promos]=await Promise.all([api('/api/students/'+id),api('/api/promotions')]);const charges=s.monthly_charges||[],open=charges.filter(x=>Number(x.balance)>0&&!x.covered_by_package),current=open[0];const fmt=v=>Number(v||0).toLocaleString('es-MX',{minimumFractionDigits:2});const chOptions=open.map((x,i)=>`<option value="${x.id}" ${i===0?'selected':''}>Mensualidad: ${fmtDate(x.period_start)} · vence: ${fmtDate(x.due_date)} · saldo $${fmt(x.balance)}</option>`).join('');const chTable=charges.length?`<div class="tablewrap"><table class="table"><tr><th>Periodo</th><th>Vence</th><th>Cuota</th><th>Pagado</th><th>Saldo</th><th>Estado</th></tr>${charges.map(x=>`<tr><td>${fmtDate(x.period_start)} → ${fmtDate(x.period_end)}</td><td>${fmtDate(x.due_date)}</td><td>$${fmt(x.amount)}</td><td>$${fmt(x.paid_amount)}</td><td>$${fmt(x.balance)}</td><td>${x.covered_by_package?'<span class="status ok">Cubierto por paquete</span>':status(x.status)}</td></tr>`).join('')}</table></div>`:'<div class="empty">Aún no hay mensualidades generadas.</div>';const promoOptions=(Array.isArray(promos)?promos:[]).filter(x=>x.active!==0&&Number(x.months||1)>1).map(x=>`<option value="${x.id}" data-months="${+x.months||1}" data-fee="${+x.fee||0}">${esc(x.name)} · ${+x.months||1} mes(es) · $${fmt(x.fee||0)}</option>`).join('');modal('Registrar pago',`<div class="notice"><b>${esc(s.name)} ${esc(s.last_name)}</b><br>Matrícula: ${esc(s.matricula||'')}<br><b>Día habitual de pago:</b> ${s.billing_day||String(s.due_date||'').slice(-2)||'—'} · <b>Próximo pago:</b> ${fmtDate(s.due_date||'—')}</div>${chTable}<label>Tipo de pago *</label><select id="pt" onchange="togglePackagePay()"><option value="mensual">Mensualidad</option>${promoOptions?'<option value="paquete">Paquete promocional</option>':''}<option value="otro">Otro</option></select><div id="monthlyPayBox">${open.length?`<label>Mensualidad a cobrar *</label><select id="pcg" onchange="updatePayAmount()">${chOptions}</select>`:'<div class="notice">No hay mensualidades pendientes.</div>'}</div><div id="packagePayBox" style="display:none"><label>Promoción / paquete *</label><select id="ppromo" onchange="updatePackagePay()"><option value="">Selecciona una promoción</option>${promoOptions}</select><div class="small muted">El paquete comienza en el próximo día habitual de pago, aunque se pague antes. El día de pago no cambia.</div></div><label>Importe a pagar *</label><input id="pa" type="number" min="0.01" step="0.01" value="${Number(current?.balance||0)}"><label>Método</label><select id="pm">${(Array.isArray(appConfig.payment_methods)&&appConfig.payment_methods.length?appConfig.payment_methods:['Efectivo','Transferencia','Tarjeta','Otro']).map(x=>`<option>${esc(x)}</option>`).join('')}</select><label>Fecha de pago</label><input id="pd" type="date" value="${todayLocal()}"><div class="small muted">En pagos normales, el sistema cubre el periodo seleccionado y los siguientes si existe saldo adicional. En paquetes, la fecha de renovación conserva el día habitual del alumno.</div>`,'Registrar pago',async()=>{const type=$('pt').value;const payload={student_id:id,amount:Number($('pa').value),method:$('pm').value,paid_at:$('pd').value,payment_type:type};if(type==='mensual'&&open.length){payload.concept='Mensualidad';payload.charge_id=Number($('pcg').value);const selected=open.find(x=>String(x.id)===String(payload.charge_id));payload.period=selected?.period_start||'';}else if(type==='paquete'){const sel=$('ppromo');const opt=sel.options[sel.selectedIndex];if(!sel.value)throw Error('Selecciona una promoción');payload.promotion_id=Number(sel.value);payload.package_months=Number(opt.dataset.months||1);payload.package_fee=Number(opt.dataset.fee||0);payload.package_name=opt.textContent.split(' · ')[0];payload.concept=payload.package_name;}else{payload.concept='Otro'}if(!(payload.amount>0))throw Error('El importe debe ser mayor a cero');if(type==='mensual'&&open.length&&!payload.charge_id)throw Error('Selecciona la mensualidad que deseas cobrar');const d=await api('/api/payments',{method:'POST',body:JSON.stringify(payload)});closeModal();toast('Pago registrado · '+d.receipt_no+' · Próximo pago '+fmtDate(d.next_due_date||''));await profile(id)})}
function togglePackagePay(){const t=$('pt')?.value,p=$('packagePayBox'),m=$('monthlyPayBox');if(!p||!m)return;const pack=t==='paquete';p.style.display=pack?'block':'none';m.style.display=pack?'none':'block';if(pack)updatePackagePay();}
function updatePackagePay(){const sel=$('ppromo'),inp=$('pa');if(!sel||!inp)return;const opt=sel.options[sel.selectedIndex];if(sel.value)inp.value=Number(opt.dataset.fee||0)}
function updatePayAmount(){const el=$('pcg'),inp=$('pa');if(!el||!inp)return;const opt=el.options[el.selectedIndex];const m=opt?.textContent?.match(/saldo \$([\d,.]+)/i);if(m)inp.value=m[1].replace(/,/g,'')}
async function payments(){const r=await api('/api/payments');$('content').innerHTML=`<div class="sectionhead"><h3>Historial de pagos</h3><button class="btn primary" onclick="payFor()">＋ Registrar pago</button></div>${payTable(r)}`}
async function attendanceAlumnos(){const data=await api('/api/attendance');const r=Array.isArray(data)?data:[];$('content').innerHTML=`<div class="sectionhead"><h3>Asistencia de alumnos · Hoy</h3><div class="actions"><button class="btn gold" onclick="biometricFor()">🖐 Registrar con huella</button><button class="btn primary" onclick="newAttendance()">＋ Registrar asistencia</button></div></div><div class="notice">Aquí solo se registra una asistencia por alumno por día. No hay distinción por edad ni por disciplina. Si un alumno pasa un mes exacto sin registrar asistencia, el sistema lo da de baja automáticamente.</div><br><div class="tablewrap"><table class="table"><tr><th>Fecha</th><th>Alumno</th><th>Estatus</th><th></th></tr>${r.length?r.map(a=>`<tr><td>${fmtDate(a.attended_at)}</td><td>${esc(a.matricula)} · ${esc(a.name)} ${esc(a.last_name)}</td><td>${esc(a.status)}</td><td>${user?.role==='director'?`<button class="btn danger" onclick="removeRecord('ASISTENCIA',${a.id},'la asistencia')">🗑 Eliminar</button>`:''}</td></tr>`).join(''):'<tr><td colspan="4"><div class="empty">No hay asistencias registradas hoy.</div></td></tr>'}</table></div>`}
async function newAttendance(){const ss=await api('/api/students');const opts=ss.filter(s=>s.status==='Activo').map(s=>`<option value="${s.id}">${esc(s.matricula)} · ${esc(s.name)} ${esc(s.last_name)}</option>`).join('');modal('Registrar asistencia de hoy',`<label>Alumno</label><select id="aa">${opts}</select><div class="notice" style="margin-top:10px">La asistencia se registra únicamente para hoy: <b>${fmtDate(todayLocal())}</b>. Cada alumno puede tener una sola asistencia por día.</div><label>Estatus</label><select id="as"><option>Presente</option><option>Retardo</option><option>Justificado</option></select>`,'Guardar',async()=>{try{const d=await api('/api/attendance',{method:'POST',body:JSON.stringify({student_id:+$('aa').value,status:$('as').value,attended_at:todayLocal()})});closeModal();toast(d.already_registered?'La asistencia de hoy ya estaba registrada':'Asistencia de hoy registrada');attendanceAlumnos()}catch(e){alert(e.message)}})}

async function teachers(){const r=await api('/api/teachers');$('content').innerHTML=`<div class="sectionhead"><h3>Maestros</h3>${user.role==='director'?'<button class="btn primary" onclick="newTeacher()">＋ Nuevo maestro</button>':''}</div><div class="tablewrap"><table class="table"><tr><th>Maestro</th><th>Matrícula</th><th>Disciplina</th>${user.role==='director'?'<th>Tarifa/hora</th>':''}<th>Estado</th><th></th></tr>${r.map(t=>`<tr><td>${esc(t.name)} ${esc(t.last_name)}</td><td><b>${esc(t.matricula)}</b></td><td>${esc(t.discipline)}</td>${user.role==='director'?`<td>$${(+t.rate_hour).toLocaleString('es-MX',{minimumFractionDigits:2})}</td>`:''}<td>${esc(t.status)}</td><td class="actions"><button class="btn bio-btn" onclick="biometricFor('teacher',${t.id},'${esc(t.name+' '+t.last_name)}')">🖐 Huella</button><button class="btn light" onclick="teacherAttendance(${t.id})">Asistencia</button><button class="btn gold" onclick="teacherQR(${t.id})">QR</button>${user.role==='director'?`<button class="btn danger" onclick="removeRecord('MAESTRO',${t.id},'el maestro')">🗑 Eliminar</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">Aún no hay maestros.</div></td></tr>'}</table></div>`}
async function teacherAttendance(id){const t=await api('/api/teachers/'+id);const hist=t.attendance||[];const history=hist.length?'<hr><h3>Historial reciente</h3><div class="tablewrap"><table class="table"><tr><th>Fecha</th><th>Entrada</th><th>Salida</th><th>Disciplina</th><th></th></tr>'+hist.map(a=>`<tr><td>${fmtDate(a.attended_at)}</td><td>${esc(a.entry_time||'—')}</td><td>${esc(a.exit_time||'—')}</td><td>${esc(a.discipline||'')}</td><td>${user?.role==='director'?`<button class="btn danger" onclick="removeRecord('ASISTENCIA_MAESTRO',${a.id},'la asistencia del maestro')">🗑 Eliminar</button>`:''}</td></tr>`).join('')+'</table></div>':'<div class="empty">Sin asistencia registrada.</div>';if(user?.role!=='director'){const today=todayLocal();const open=hist.find(a=>a.attended_at===today&&a.entry_time&&!a.exit_time);const action=open?'salida':'entrada';modal('Asistencia de maestro',`<div class="notice"><b>${esc(t.name)} ${esc(t.last_name)}</b><br>${esc(t.matricula)} · ${esc(t.discipline||'')}<br><b>La hora se registra automáticamente y recepción no puede modificarla.</b></div>${history}<hr><h3>${open?'Registrar salida':'Registrar entrada'}</h3><label>Fecha</label><input value="${today}" readonly><label>Hora actual</label><input value="${new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:false})}" readonly><label>Disciplina</label><input value="${esc(t.discipline||'')}" readonly>`,'Registrar '+(open?'salida':'entrada'),async()=>{await api('/api/teacher-attendance',{method:'POST',body:JSON.stringify({teacher_id:id,action})});closeModal();toast('Asistencia registrada automáticamente');teachers()});return}modal('Asistencia de maestro',`<div class="notice"><b>${esc(t.name)} ${esc(t.last_name)}</b><br>${esc(t.matricula)} · $${(+t.rate_hour).toLocaleString('es-MX')}/hora</div>${history}<hr><h3>Registrar nueva asistencia</h3><label>Fecha</label><input id="taf" type="date" value="${todayLocal()}"><label>Disciplina</label><input id="tad" value="${esc(t.discipline)}"><label>Entrada</label><input id="tae" type="time"><label>Salida</label><input id="tas" type="time"><label>Notas</label><input id="tan">`,'Guardar asistencia',async()=>{await api('/api/teacher-attendance',{method:'POST',body:JSON.stringify({teacher_id:id,attended_at:$('taf').value,discipline:$('tad').value,entry_time:$('tae').value,exit_time:$('tas').value,notes:$('tan').value})});closeModal();toast('Asistencia de maestro registrada');teachers()})}
async function teacherQR(id){const t=await api('/api/teachers/'+id);modal('Credencial de maestro',`<div style="text-align:center"><h2>EmpoderArte</h2><h3>${esc(t.name)} ${esc(t.last_name)}</h3><b>${esc(t.matricula)}</b><p>${esc(t.discipline)}</p><div id="tqr" class="qr"></div><p class="small muted">QR: EMPODERARTE|MAESTRO|${esc(t.matricula)}</p></div>`,'Imprimir',()=>window.print());setTimeout(()=>makeQR('tqr','EMPODERARTE|MAESTRO|'+t.matricula),50)}
async function personal(){const r=await api('/api/personal');const isDir=user?.role==='director';$('content').innerHTML=`<div class="sectionhead"><h3>Personal</h3>${isDir?'<button class="btn primary" onclick="newPersonal()">＋ Nuevo personal</button>':''}</div><div class="tablewrap"><table class="table"><tr><th>Nombre</th><th>Matrícula</th><th>Puesto</th>${isDir?'<th>Tarifa/hora</th>':''}<th></th></tr>${r.map(p=>`<tr><td>${esc(p.name)} ${esc(p.last_name)}</td><td><b>${esc(p.matricula)}</b></td><td>${esc(p.position)}</td>${isDir?`<td>$${(+p.rate_hour||0).toLocaleString('es-MX',{minimumFractionDigits:2})}</td>`:''}<td class="actions"><button class="btn bio-btn" onclick="biometricFor('personal',${p.id},'${esc(p.name+' '+p.last_name)}')">🖐 Huella</button><button class="btn light" onclick="personalAttendance(${p.id})">Asistencia</button>${isDir?`<button class="btn danger" onclick="removeRecord('PERSONAL',${p.id},'el personal')">🗑 Eliminar</button>`:''}</td></tr>`).join('')||`<tr><td colspan="${isDir?5:4}"><div class="empty">Aún no hay personal.</div></td></tr>`}</table></div>`}
function newPersonal(){modal('Nuevo personal',`<div class="formgrid"><div><label>Nombre *</label><input id="pn"></div><div><label>Apellidos *</label><input id="pl"></div><div><label>Puesto</label><input id="ppos" value="Recepción"></div><div><label>Área</label><input id="parea"></div><div><label>Pago por hora</label><input id="prate" type="number" min="0" value="100"></div><div><label>Teléfono</label><input id="ptel"></div><div class="full"><label>Correo</label><input id="pemail"></div></div>`,'Guardar personal',async()=>{const d=await api('/api/personal',{method:'POST',body:JSON.stringify({name:$('pn').value,last_name:$('pl').value,position:$('ppos').value,area:$('parea').value,rate_hour:Number($('prate').value||0),phone:$('ptel').value,email:$('pemail').value})});closeModal();toast('Personal registrado: '+d.matricula);personal()})}
async function personalAttendance(id){const p=await api('/api/personal/'+id);const hist=p.attendance||[];const history=hist.length?'<hr><h3>Historial reciente</h3><div class="tablewrap"><table class="table"><tr><th>Fecha</th><th>Entrada</th><th>Salida</th><th>Actividad</th><th></th></tr>'+hist.map(a=>`<tr><td>${fmtDate(a.attended_at)}</td><td>${esc(a.entry_time||'—')}</td><td>${esc(a.exit_time||'—')}</td><td>${esc(a.activity||'')}</td><td>${user?.role==='director'?`<button class="btn danger" onclick="removeRecord('ASISTENCIA_PERSONAL',${a.id},'la asistencia del personal')">🗑 Eliminar</button>`:''}</td></tr>`).join('')+'</table></div>':'<div class="empty">Sin asistencia registrada.</div>';modal('Asistencia de personal',`<div class="notice"><b>${esc(p.name)} ${esc(p.last_name)}</b><br>${esc(p.matricula)} · ${esc(p.position)}</div>${history}<hr><h3>Registrar nueva asistencia</h3><label>Fecha</label><input id="paf" type="date" value="${new Date().toISOString().slice(0,10)}"><label>Entrada</label><input id="pae" type="time"><label>Salida</label><input id="pas" type="time"><label>Actividad / área</label><input id="paa" value="${esc(p.area||p.position)}">`,'Guardar',async()=>{await api('/api/personal-attendance',{method:'POST',body:JSON.stringify({personal_id:id,attended_at:$('paf').value,entry_time:$('pae').value,exit_time:$('pas').value,activity:$('paa').value})});closeModal();toast('Asistencia registrada');personal()})}
async function payroll(){const r=await api('/api/payroll');$('content').innerHTML=`<div class="card"><h3>💰 Nómina</h3><div class="notice">Cálculo automático con horas registradas × tarifa. Si un maestro registra más de 10 minutos de retardo, se descuentan exactamente los minutos que excedan esos 10 minutos.</div><br><div class="tablewrap"><table class="table"><tr><th>Persona</th><th>Tipo</th><th>Horas</th><th>Retardo</th><th>Descuento por retardo</th><th>Total</th></tr>${r.map(x=>`<tr><td>${esc(x.name)} ${esc(x.last_name)}</td><td>${esc(x.type)}</td><td>${(+x.hours).toFixed(2)}</td><td>${(+x.retardo_minutes||0).toFixed(0)} min</td><td>$${(+x.discount||0).toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td><b>$${(+x.total).toLocaleString('es-MX',{minimumFractionDigits:2})}</b></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">Sin horas registradas.</div></td></tr>'}</table></div></div>`}
async function reception(){const [d,people,teachersList]=await Promise.all([api('/api/dashboard'),api('/api/personal'),api('/api/teachers')]);const personalCard=people.length?`<div class="tablewrap"><table class="table"><tr><th>Personal</th><th>Matrícula</th><th>Puesto</th><th></th></tr>${people.map(p=>`<tr><td>${esc(p.name)} ${esc(p.last_name)}</td><td><b>${esc(p.matricula)}</b></td><td>${esc(p.position||'')}</td><td class="actions"><button class="btn bio-btn" onclick="biometricFor('personal',${p.id},'${esc(p.name+' '+p.last_name)}')">🖐 Huella</button><button class="btn light" onclick="personalAttendance(${p.id})">Registrar asistencia</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Aún no hay personal activo.</div>';const teacherCard=teachersList.length?`<div class="tablewrap"><table class="table"><tr><th>Maestro</th><th>Matrícula</th><th>Disciplina</th><th>Estado</th><th></th></tr>${teachersList.map(t=>`<tr><td>${esc(t.name)} ${esc(t.last_name)}</td><td><b>${esc(t.matricula)}</b></td><td>${esc(t.discipline||'')}</td><td>${esc(t.status||'Activo')}</td><td class="actions"><button class="btn bio-btn" onclick="biometricFor('teacher',${t.id},'${esc(t.name+' '+t.last_name)}')">🖐 Huella</button><button class="btn light" onclick="teacherAttendance(${t.id})">Registrar asistencia</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Aún no hay maestros activos.</div>';$('content').innerHTML=`<div class="cards"><div class="card"><h3>📷 Asistencia</h3><p>Registrar entrada de alumnos por matrícula o QR.</p><button class="btn primary" onclick="attendanceAlumnos()">Abrir asistencia</button></div><div class="card"><h3>💳 Cobro</h3><p>Registrar mensualidades y pagos.</p><button class="btn gold" onclick="payFor()">Cobrar</button></div><div class="card"><h3>🔔 Vencimientos</h3><p>${d.upcoming} próximos en 7 días · ${d.overdue} vencidos.</p><button class="btn light" onclick="alerts()">Ver vencimientos</button></div></div><div class="section card"><div class="sectionhead"><h3>👩‍🏫 Maestros · solo asistencia</h3><span class="small muted">Recepción no ve tarifas ni nómina</span></div>${teacherCard}</div><div class="section card"><div class="sectionhead"><h3>👥 Personal · solo asistencia</h3><span class="small muted">Recepción no ve tarifas ni nómina</span></div>${personalCard}</div>`}
async function monthly(){const r=await api('/api/monthly');$('content').innerHTML=`<div class="sectionhead"><h3>Mensualidades · Prepago</h3><button class="btn primary" onclick="payFor()">＋ Cobrar</button></div><div class="notice"><b>Regla de prepago:</b> el alumno debe pagar antes de su fecha de vencimiento. El día habitual de pago se conserva aunque pague con anticipación. Los paquetes promocionales extienden la cobertura desde el próximo día habitual de pago.</div><br><div class="tablewrap"><table class="table"><tr><th>Alumno</th><th>Plan</th><th>Periodo</th><th>Cuota</th><th>Saldo</th><th>Vencimiento</th><th>Estado</th><th></th></tr>${r.map(x=>`<tr><td>${esc(x.name)} ${esc(x.last_name)}<div class="muted">${esc(x.matricula)}</div></td><td>${esc(x.plan)}</td><td>${esc(x.charge_period||'—')}</td><td>$${(+x.charge_amount||+x.monthly_fee||0).toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td><b>$${(+x.charge_balance||0).toLocaleString('es-MX',{minimumFractionDigits:2})}</b></td><td>${fmtDate(x.due_date||'—')}</td><td>${status(x.payment_status)}</td><td><button class="btn gold" onclick="payFor(${x.id})">Cobrar</button>${user?.role==='director'?`<button class="btn light" onclick="profile(${x.id})">Ver cargos</button>`:''}</td></tr>`).join('')}</table></div>`}
async function lockers(){const [r,p]=await Promise.all([api('/api/lockers'),api('/api/locker-plans')]);$('content').innerHTML=`<div class="sectionhead"><h3>🔐 Renta de lockers</h3><div class="actions"><button class="btn light" onclick="lockerPlans()">Planes</button><button class="btn primary" onclick="newLocker()">＋ Rentar locker</button></div></div><div class="notice">Planes iniciales: Mensual $100 · Semestral $550 · Anual $900. Un alumno no puede tener dos lockers activos.</div><br><div class="tablewrap"><table class="table"><tr><th>Locker</th><th>Alumno</th><th>Plan</th><th>Pago</th><th>Vencimiento</th><th>Estado</th><th></th></tr>${r.map(l=>`<tr><td><b>${esc(l.number)}</b></td><td>${esc(l.matricula||'')} · ${esc(l.name||'')} ${esc(l.last_name||'')}</td><td>${esc(l.plan_catalog||l.plan_name)}</td><td>$${(+l.price).toLocaleString('es-MX')}</td><td>${esc(l.due_date||'—')}</td><td>${esc(l.status)}</td><td class="actions"><button class="btn gold" onclick="lockerPay(${l.id},${+l.price})">Renovar</button><button class="btn light" onclick="lockerHistory(${l.id})">Historial</button><button class="btn danger" onclick="lockerPenalty(${l.id})">Penalización</button>${user.role==='director'?`<button class="btn danger" onclick="lockerClose(${l.id})">Finalizar</button><button class="btn danger" onclick="removeRecord('LOCKER',${l.id},'el locker')">🗑 Eliminar</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7"><div class="empty">No hay lockers rentados.</div></td></tr>'}</table></div>`}
async function newLocker(){const [ss,ps]=await Promise.all([api('/api/students'),api('/api/locker-plans')]);modal('Rentar locker',`<label>Número de locker</label><input id="ln" placeholder="L-01"><label>Alumno</label><select id="la">${ss.map(s=>`<option value="${s.id}">${esc(s.matricula)} · ${esc(s.name)} ${esc(s.last_name)}</option>`).join('')}</select><label>Plan</label><select id="lp">${ps.map(p=>`<option value="${p.id}">${esc(p.name)} · $${(+p.price).toLocaleString('es-MX')}</option>`).join('')}</select><label>Fecha de pago</label><input id="lf" type="date" value="${new Date().toISOString().slice(0,10)}"><label>Notas</label><input id="lno">`,'Guardar renta',async()=>{await api('/api/lockers',{method:'POST',body:JSON.stringify({number:$('ln').value,student_id:+$('la').value,plan_id:+$('lp').value,paid_at:$('lf').value,notes:$('lno').value})});closeModal();toast('Locker rentado');lockers()})}
async function lockerPay(id,price){modal('Renovar locker',`<div class="notice">Importe automático: <b>$${(+price).toLocaleString('es-MX',{minimumFractionDigits:2})}</b></div><label>Fecha de pago</label><input id="lpf" type="date" value="${new Date().toISOString().slice(0,10)}"><label>Método</label><select id="lpm">${(Array.isArray(appConfig.payment_methods)&&appConfig.payment_methods.length?appConfig.payment_methods:['Efectivo','Transferencia','Tarjeta','Otro']).map(x=>`<option>${esc(x)}</option>`).join('')}</select>`,'Registrar pago',async()=>{await api('/api/lockers/'+id+'/payment',{method:'POST',body:JSON.stringify({amount:price,paid_at:$('lpf').value,method:$('lpm').value})});closeModal();toast('Locker renovado');lockers()})}
async function lockerHistory(id){const [r,p]=await Promise.all([api('/api/lockers/'+id+'/payments'),api('/api/lockers/'+id+'/penalties')]);let body='<h3>Pagos</h3>'+(r.length?'<div class="tablewrap"><table class="table"><tr><th>Fecha</th><th>Concepto</th><th>Monto</th><th>Método</th><th></th></tr>'+r.map(x=>`<tr><td>${fmtDate(x.paid_at)}</td><td>${esc(x.concept)}</td><td>$${(+x.amount).toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td>${esc(x.method)}</td><td>${user?.role==='director'?`<button class="btn danger" onclick="removeRecord('PAGO_LOCKER',${x.id},'el pago del locker')">🗑 Eliminar</button>`:''}</td></tr>`).join('')+'</table></div>':'<div class="empty">Sin pagos.</div>');body+='<h3>Penalizaciones</h3>'+(p.length?'<div class="tablewrap"><table class="table"><tr><th>Fecha</th><th>Motivo</th><th>Monto</th><th></th></tr>'+p.map(x=>`<tr><td>${fmtDate(x.created_at)}</td><td>${esc(x.reason)}</td><td>$${(+x.amount).toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td>${user?.role==='director'?`<button class="btn danger" onclick="removeRecord('PENALIZACION_LOCKER',${x.id},'la penalización')">🗑 Eliminar</button>`:''}</td></tr>`).join('')+'</table></div>':'<div class="empty">Sin penalizaciones.</div>');modal('Historial del locker',body,'Cerrar',closeModal)}
async function lockerPenalty(id){modal('Penalización de locker',`<label>Monto</label><input id="lpmonto" type="number" min="1" value="50"><label>Motivo</label><select id="lpreason"><option>Retraso</option><option>Daño</option><option>Pérdida de llave</option><option>Otro</option></select>`,'Registrar',async()=>{await api('/api/lockers/'+id+'/penalty',{method:'POST',body:JSON.stringify({amount:Number($('lpmonto').value),reason:$('lpreason').value})});closeModal();toast('Penalización registrada');lockers()})}
async function lockerClose(id){if(!confirm('¿Finalizar esta renta de locker?'))return;await api('/api/lockers/'+id+'/close',{method:'POST'});toast('Locker finalizado');lockers()}
async function lockerPlans(){const r=await api('/api/locker-plans');modal('Planes de lockers',`<div class="tablewrap"><table class="table"><tr><th>Plan</th><th>Precio</th><th>Meses</th><th></th></tr>${r.map(p=>`<tr><td>${esc(p.name)}</td><td>$${(+p.price).toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td>${p.months}</td><td>${user?.role==='director'?`<button class="btn danger" onclick="removeRecord('PLAN_LOCKER',${p.id},'el plan de locker');closeModal()">🗑 Eliminar</button>`:''}</td></tr>`).join('')}</table></div><br><div class="notice">El Director puede administrar los planes desde Configuración y eliminar los que no estén asociados a lockers.</div>`,'Cerrar',closeModal)}
async function promotions(){const r=await api('/api/promotions');$('content').innerHTML=`<div class="sectionhead"><h3>Promociones</h3>${user.role==='director'?'<button class="btn primary" onclick="newPromotion()">＋ Nueva promoción</button>':''}</div><div class="cards">${r.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><b>${p.discount}${p.kind==='Porcentaje'?'%':' MXN'} de descuento</b><div class="muted">${p.active?'Activa':'Inactiva'} · ${fmtDate(p.expires_at)||'Sin vencimiento'}</div>${user.role==='director'?`<br><button class="btn danger" onclick="removeRecord('PROMOCION',${p.id},'la promoción')">🗑 Eliminar</button>`:''}</div>`).join('')}</div>`}
function newPromotion(){modal('Nueva promoción',`<label>Nombre</label><input id="pmn"><label>Descripción</label><textarea id="pmd"></textarea><label>Descuento</label><input id="pmi" type="number" min="0"><label>Tipo</label><select id="pmk"><option>Porcentaje</option><option>Monto</option></select><label>Vigencia</label><input id="pme" type="date">`,'Crear',async()=>{await api('/api/promotions',{method:'POST',body:JSON.stringify({name:$('pmn').value,description:$('pmd').value,discount:Number($('pmi').value||0),kind:$('pmk').value,expires_at:$('pme').value})});closeModal();toast('Promoción creada');promotions()})}
async function benefits(){const r=await api('/api/benefits');$('content').innerHTML='<div class="cards">'+r.map(b=>`<div class="card"><div class="pill">${esc(b.level)}</div><h3>${esc(b.name)}</h3><p>${esc(b.description)}</p>${user.role==='director'?`<br><button class="btn danger" onclick="removeRecord('BENEFICIO',${b.id},'el beneficio')">🗑 Eliminar</button>`:''}</div>`).join('')+'</div>'}
async function credential(){const ss=await api('/api/students');$('content').innerHTML=`<div class="sectionhead"><h3>Credencial digital / QR</h3><select id="credsel" style="max-width:430px" onchange="renderCred()"><option value="">Selecciona un alumno</option>${ss.map(s=>`<option value="${s.id}">${esc(s.matricula)} · ${esc(s.name)} ${esc(s.last_name)}</option>`).join('')}</select></div><div id="cred"></div>`}
async function renderCred(){const id=$('credsel').value;if(!id){$('cred').innerHTML='';return}const s=await api('/api/students/'+id),logo=appConfig.logo_data||appConfig.logo_url||'/logo-empoderarte.jpg';$('cred').innerHTML=`<div class="card" style="max-width:450px;text-align:center;margin:auto"><img src="${esc(logo)}" style="width:100px;height:100px;object-fit:cover;border-radius:16px"><h2>${esc(appConfig.school_name||'EmpoderArte')}</h2><div id="qrcode" class="qr"></div><h2>${esc(s.name)} ${esc(s.last_name)}</h2><div class="pill">${esc(s.matricula)}</div><p>Plan ${esc(s.plan)} · Beneficio ${esc(s.benefit_level)}</p><p class="small muted">${esc(appConfig.qr_footer||'EmpoderArte · Escuela de Danza')}</p><button class="btn primary" onclick="window.print()">🖨 Imprimir credencial</button></div>`;makeQR('qrcode',s.matricula)}
function makeQR(id,text){const el=$(id);if(!el)return;el.innerHTML=`<img src="https://quickchart.io/qr?text=${encodeURIComponent(text)}&size=180" width="180" height="180" alt="QR">`}
async function reports(){const d=await api('/api/report');const nuevos=Array.isArray(d.nuevos_ingresos)?d.nuevos_ingresos:[];const nuevosHtml=nuevos.length?`<div class="tablewrap"><table class="table"><tr><th>Alumno</th><th>Matrícula</th><th>Fecha de ingreso</th><th>Plan</th><th></th></tr>${nuevos.map(s=>`<tr><td><b>${esc(s.name)} ${esc(s.last_name)}</b></td><td>${esc(s.matricula)}</td><td>${fmtDate(s.enrollment_date)}</td><td>${esc(s.plan||'—')}</td><td><button class="btn light" onclick="profile(${s.id})">Ficha</button></td></tr>`).join('')}</table></div>`:'<div class="empty">No hay alumnos marcados como NUEVO INGRESO en este mes.</div>';$('content').innerHTML=`<div class="cards"><div class="card"><div class="muted">Alumnos registrados</div><div class="metric">${d.alumnos}</div></div><div class="card"><div class="muted">Alumnos activos</div><div class="metric">${d.activos}</div></div><div class="card"><div class="muted">Ingresos del mes</div><div class="metric">$${(+d.ingresos).toLocaleString('es-MX')}</div></div><div class="card"><div class="muted">Vencidos</div><div class="metric">${d.vencidos}</div></div><div class="card"><div class="muted">Nuevos ingresos del mes</div><div class="metric">${d.inscripciones_mes||0}</div></div></div><div class="section card"><div class="sectionhead"><h3>🆕 Alumnos nuevos del mes</h3><span class="pill">NUEVO INGRESO</span></div>${nuevosHtml}</div>`}
async function alerts(){const r=await api('/api/monthly');const a=r.filter(x=>x.payment_status==='Vencido'||x.payment_status==='Próximo');$('content').innerHTML=`<div class="card"><h3>🔔 Vencimientos y recordatorios</h3><div class="notice">Aquí puedes identificar rápidamente adeudos y próximos vencimientos. El botón prepara WhatsApp con el número registrado.</div><br><div class="tablewrap"><table class="table"><tr><th>Alumno</th><th>Vencimiento</th><th>Estado</th><th>Importe</th><th></th></tr>${a.map(x=>`<tr><td>${esc(x.name)} ${esc(x.last_name)}<br><small>${esc(x.matricula)}</small></td><td>${fmtDate(x.due_date||'—')}</td><td>${status(x.payment_status)}</td><td>$${(+x.monthly_fee).toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td>${x.phone?`<button class="btn primary" onclick="wa('${esc(x.phone)}','${esc(x.name)}','${esc(x.due_date||'')}','${+x.monthly_fee}')">📲 WhatsApp</button>`:''}<button class="btn gold" onclick="payFor(${x.id})">Cobrar</button>${user?.role==='director'?`<button class="btn danger" onclick="removeRecord('ALUMNO',${x.id},'el alumno')">🗑 Eliminar</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">No hay vencimientos.</div></td></tr>'}</table></div></div>`}
function wa(phone,name,due,amount){const p=String(phone).replace(/\D/g,'');const tpl=appConfig.whatsapp_message||'Hola {nombre}, te recordamos que tu mensualidad vence el {vencimiento}. Importe: ${importe}. Gracias por formar parte de EmpoderArte.';const msg=tpl.replaceAll('{nombre}',name).replaceAll('{vencimiento}',due).replaceAll('{importe}','$'+amount);window.open('https://wa.me/'+p+'?text='+encodeURIComponent(msg),'_blank')}
async function users(){const r=await api('/api/users');$('content').innerHTML=`<div class="sectionhead"><h3>Usuarios y permisos</h3><button class="btn primary" onclick="newUser()">＋ Nuevo usuario</button></div><div class="tablewrap"><table class="table"><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Activo</th><th>Último acceso</th><th></th></tr>${r.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${u.active?'Sí':'No'}</td><td>${esc(u.last_login||'—')}</td><td>${user.role==='director'&&u.id!==user.id?`<button class="btn danger" onclick="removeRecord('USUARIO',${u.id},'el usuario')">🗑 Eliminar</button>`:''}</td></tr>`).join('')}</table></div>`}
function newUser(){modal('Nuevo usuario',`<label>Nombre</label><input id="un"><label>Correo</label><input id="ue" type="email"><label>Contraseña</label><input id="up" type="password"><label>Rol</label><select id="ur"><option value="recepcion">Recepción</option><option value="director">Director</option></select>`,'Crear',async()=>{await api('/api/users',{method:'POST',body:JSON.stringify({name:$('un').value,email:$('ue').value,password:$('up').value,role:$('ur').value})});closeModal();toast('Usuario creado');users()})}
async function audit(){const r=await api('/api/audit');$('content').innerHTML='<div class="card"><h3>Bitácora</h3><div class="tablewrap"><table class="table"><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Módulo</th><th>Detalle</th></tr>'+r.map(a=>`<tr><td>${fmtDate(a.created_at)}</td><td>${esc(a.user_name)}</td><td>${esc(a.action)}</td><td>${esc(a.module)}</td><td>${esc(a.detail)}</td></tr>`).join('')+'</table></div></div>'}
async function removeRecord(entity,id,label){if(user?.role!=='director'){alert('Solo el Director puede eliminar registros.');return}if(!confirm(`¿Seguro que deseas eliminar ${label}?\n\nSe enviará a la Papelera y podrás restaurarlo después.`))return;try{await api('/api/delete',{method:'POST',body:JSON.stringify({entity,id})});toast('Registro eliminado y enviado a Papelera');view(currentView)}catch(e){alert(e.message)}}
async function trash(){const r=await api('/api/trash');$('content').innerHTML='<div class="card"><div class="sectionhead"><h3>🗑️ Papelera</h3><span class="muted">Los registros eliminados pueden restaurarse.</span></div>'+r.map(x=>`<div class="bar"><span><b>${esc(x.name||x.entity_type)}</b><br><small>${esc(x.matricula||'')} · ${esc(x.entity_type)} · ${fmtDate(x.deleted_at)}</small></span><button class="btn primary" onclick="restore(${x.id})">↶ Restaurar</button></div>`).join('')||'<div class="empty">La papelera está vacía.</div>'+'</div><br><div class="notice">La Bitácora y la configuración no se eliminan para conservar la seguridad e integridad del sistema.</div>'}

/div><div><label>Meses predeterminados</label><input id="clmonths" type="number" min="1" value="${c.locker_default_months??1}"></div></div><br><div class="actions"><button class="btn primary" onclick="saveSettings()">💾 Guardar configuración</button></div></div><br><div class="card"><h3>🔐 Seguridad de mi cuenta</h3><p class="muted">Cambia la contraseña de la cuenta con la que estás iniciando sesión. La nueva contraseña debe tener al menos 8 caracteres.</p><div class="formgrid"><div><label>Contraseña actual</label><input id="pwdCurrent" type="password" autocomplete="current-password"></div><div><label>Nueva contraseña</label><input id="pwdNew" type="password" autocomplete="new-password"></div><div><label>Confirmar nueva contraseña</label><input id="pwdConfirm" type="password" autocomplete="new-password"></div></div><br><div class="actions"><button class="btn primary" onclick="changePassword()">🔑 Cambiar contraseña</button></div></div><br><div class="card"><h3>🗑️ Eliminación y seguridad</h3><p class="muted">Las eliminaciones las realiza únicamente el Director y los registros pasan primero a Papelera. La Bitácora permanece protegida para conservar el historial.</p></div><br><div class="card"><h3>🔐 Planes de lockers</h3><p class="muted">Puedes administrar los planes desde <button class="btn light" onclick="lockerPlans()">Planes de lockers</button>. Un plan asociado a un locker no puede eliminarse.</p></div>`}

function fmtDate(x){if(!x)return '—';const m=String(x).match(/^(\d{4})-(\d{2})-(\d{2})(.*)$/);return m?`${m[3]}/${m[2]}/${m[1]}${m[4]||''}`:String(x)}
function studentAge(birth){if(!birth)return null;const b=new Date(String(birth)+'T12:00:00'),n=new Date();let a=n.getFullYear()-b.getFullYear();const md=n.getMonth()-b.getMonth();if(md<0||(md===0&&n.getDate()<b.getDate()))a--;return a}
function isInfantil(s){const a=studentAge(s?.birth_date);return a!==null&&a<12}
function todayLocal(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Mexico_City',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const get=k=>parts.find(x=>x.type===k)?.value||'';return `${get('year')}-${get('month')}-${get('day')}`}
function addMonthsClient(date,n){const d=new Date((date||todayLocal())+'T12:00:00');d.setMonth(d.getMonth()+Number(n||0));return d.toISOString().slice(0,10)}
function activeOpts(rows,placeholder){return `<option value="">${placeholder||'Selecciona'}</option>`+rows.filter(x=>x.active!==0).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}
function photoTag(src,alt='Foto'){return src?`<img src="${esc(src)}" alt="${esc(alt)}" style="width:110px;height:110px;object-fit:cover;border-radius:18px;border:1px solid #ddd3e6">`:`<div style="width:110px;height:110px;border-radius:18px;background:#f0ebf5;display:grid;place-items:center;font-size:42px">👤</div>`}

async function newStudent(){const [plans,disc]=await Promise.all([api('/api/plans'),api('/api/disciplines')]);modal('Nuevo alumno',`<div class="formgrid"><div><label>Nombre *</label><input id="sn"></div><div><label>Apellidos *</label><input id="sl"></div><div><label>Fecha de nacimiento</label><input id="sb" type="date"></div><div><label>Fecha exacta de ingreso *</label><input id="sen" type="date" value="${todayLocal()}"></div><div><label>Tipo de ingreso *</label><select id="sni"><option value="true" selected>NUEVO INGRESO</option><option value="false">ALUMNO YA EXISTENTE</option></select><div class="small muted">Marca NUEVO INGRESO solo cuando realmente sea un alumno que entra por primera vez.</div></div><div><label>Teléfono / WhatsApp</label><input id="sp"></div><div><label>Correo</label><input id="se" type="email"></div><div><label>Tutor / contacto</label><input id="st"></div><div><label>Teléfono tutor</label><input id="stp"></div><div><label>Plan / paquete</label><select id="spl">${activeOpts(plans,'Sin plan')}</select></div><div><label>Cuota</label><input id="sf" type="number" min="0" value="600"></div><div><label>Inicio del plan</label><input id="sps" type="date" value="${todayLocal()}"></div><div><label>Vencimiento individual</label><input id="sd" type="date"></div><div><label>Disciplina</label><select id="sdi">${activeOpts(disc,'Sin disciplina')}</select></div><div><label>Grupo</label><input id="sg"></div><div><label>Nivel de beneficio</label><input id="sbl" value="Base"></div><div><label>Estado</label><select id="sst"><option>Activo</option><option>Inactivo</option><option>Dado de baja</option></select></div><div class="full"><label>Foto del alumno</label><input id="sphoto" type="file" accept="image/*" onchange="previewStudentPhoto(this)"><div id="studentPhotoPreview" style="margin-top:8px"></div><button type="button" class="btn light" onclick="openStudentCamera(null)">📷 Tomar foto con cámara</button></div><div class="full"><label>Notas</label><textarea id="sno"></textarea></div></div>`,'Crear matrícula',async()=>{const plan=plans.find(x=>String(x.id)===$('spl').value);const start=$('sps').value||$('sen').value||todayLocal();const due=$('sd').value||(plan?addMonthsClient(start,1):addMonthsClient(start,1));const end=plan?addMonthsClient(start,plan.months):'';const d=await api('/api/students',{method:'POST',body:JSON.stringify({name:$('sn').value,last_name:$('sl').value,birth_date:$('sb').value,enrollment_date:$('sen').value,new_income:$('sni').value==='true',phone:$('sp').value,email:$('se').value,tutor:$('st').value,tutor_phone:$('stp').value,plan_id:plan?.id||null,plan:plan?.name||'Sin plan',monthly_fee:Number($('sf').value||plan?.fee||0),due_date:due,plan_start_date:start,plan_end_date:end,discipline_id:$('sdi').value||null,group_name:$('sg').value,benefit_level:$('sbl').value,status:$('sst').value,photo_data:window.pendingStudentPhoto||'',notes:$('sno').value})});window.pendingStudentPhoto=undefined;closeModal();toast('Alumno creado: '+d.matricula);students()})}

async function lockerPenaltyTypesCatalog(){const r=await api('/api/locker-penalty-types');modal('Penalizaciones de lockers',`<div class="tablewrap"><table class="table"><tr><th>Penalización</th><th>Monto</th><th>Descripción</th><th>Estado</th><th></th></tr>${r.map(x=>`<tr><td>${esc(x.name)}</td><td>$${(+x.amount).toLocaleString('es-MX')}</td><td>${esc(x.description)}</td><td>${x.active?'Activa':'Inactiva'}</td><td>${user.role==='director'?`<button class="btn light" onclick="editPenaltyType(${x.id})">✏️ Editar</button>`:''}</td></tr>`).join('')}</table></div>${user.role==='director'?'<br><button class="btn primary" onclick="newPenaltyType()">＋ Nueva penalización</button>':''}`,'Cerrar',closeModal)}

async function lockerHistory(id){const [r,p]=await Promise.all([api('/api/lockers/'+id+'/payments'),api('/api/lockers/'+id+'/penalties')]);let body='<h3>Pagos registrados</h3>'+(r.length?'<div class="tablewrap"><table class="table"><tr><th>Fecha</th><th>Concepto</th><th>Monto</th><th>Método</th></tr>'+r.map(x=>`<tr><td>${fmtDate(x.paid_at)}</td><td>${esc(x.concept)}</td><td>$${(+x.amount).toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td>${esc(x.method)}</td></tr>`).join('')+'</table></div>':'<div class="empty">Sin pagos.</div>');body+='<h3>Penalizaciones registradas</h3>'+(p.length?'<div class="tablewrap"><table class="table"><tr><th>Fecha</th><th>Motivo</th><th>Monto</th><th>Cobro</th><th></th></tr>'+p.map(x=>`<tr><td>${fmtDate(x.created_at)}</td><td>${esc(x.reason)}</td><td>$${(+x.amount).toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td>${x.paid?'Cobrada':'Pendiente'}</td><td>${user?.role==='director'?`<button class="btn danger" onclick="removeRecord('PENALIZACION_LOCKER',${x.id},'la penalización')">🗑 Eliminar</button>`:''}</td></tr>`).join('')+'</table></div>':'<div class="empty">Sin penalizaciones.</div>');modal('Historial del locker',body,'Cerrar',closeModal)}

async function lockerPenalty(id){const types=await api('/api/locker-penalty-types');modal('Penalización de locker',`<label>Tipo de penalización</label><select id="lptype">${activeOpts(types,'Selecciona una penalización')}</select><label>Monto</label><input id="lpmonto" type="number" min="0" value="0"><label>Motivo / detalle</label><input id="lpreason"><label>¿Ya fue cobrada?</label><select id="lppaid"><option value="0">Pendiente</option><option value="1">Sí, cobrada</option></select>`,'Registrar',async()=>{const t=types.find(x=>String(x.id)===$('lptype').value);await api('/api/lockers/'+id+'/penalty',{method:'POST',body:JSON.stringify({amount:Number($('lpmonto').value||t?.amount||0),reason:$('lpreason').value||t?.name||'Penalización',penalty_type_id:t?.id||null,paid:Number($('lppaid').value)})});closeModal();toast('Penalización registrada');lockers()});setTimeout(()=>{const sel=$('lptype');sel.onchange=()=>{const t=types.find(x=>String(x.id)===sel.value);if(t)$('lpmonto').value=t.amount}},50)}

async function trash(){const r=await api('/api/trash');$('content').innerHTML='<div class="card"><div class="sectionhead"><h3>🗑️ Papelera</h3><span class="muted">Puedes restaurar o eliminar definitivamente.</span></div>'+r.map(x=>`<div class="bar"><span><b>${esc(x.name||x.entity_type)}</b><br><small>${esc(x.matricula||'')} · ${esc(x.entity_type)} · ${fmtDate(x.deleted_at)}</small></span><div class="actions"><button class="btn primary" onclick="restore(${x.id})">↶ Restaurar</button><button class="btn danger" onclick="purgeTrash(${x.id})">🗑 Eliminar definitivamente</button></div></div>`).join('')||'<div class="empty">La papelera está vacía.</div>'+'</div>'}

button type="button" class="btn light" onclick="resetLogo()">Usar logo oficial</button></div></div><h3>💰 Pagos y recibos</h3><div class="formgrid"><div><label>Moneda</label><input id="cm" value="${esc(c.currency||'MXN')}"></div><div><label>Prefijo recibos</label><input id="crp" value="${esc(c.receipt_prefix||'REC')}"></div><div class="full"><label>Métodos de pago</label><input id="cpm" value="${esc(pm)}"></div><div class="full"><label>Mensaje del recibo</label><textarea id="crm">${esc(c.receipt_message||'Gracias por formar parte de EmpoderArte.')}</textarea></div></div><h3>🎓 Mensualidades</h3><div class="formgrid"><div><label>Prefijo matrícula</label><input id="cp" value="${esc(c.matricula_prefix||'EMP')}"></div><div><label>Día predeterminado (solo referencia)</label><input id="cd" type="number" min="1" max="31" value="${c.default_due_day||10}"></div><div><label>Días de alerta</label><input id="cw" type="number" min="0" value="${c.whatsapp_days??3}"></div><div><label>Días de tolerancia de acceso</label><input id="ctol" type="number" min="0" value="${c.tolerance_days??0}"></div></div><h3>🗂️ Catálogos</h3><div class="cards"><div class="subcard"><b>Planes / paquetes</b><p class="muted">Meses, cuota y vigencia.</p><button class="btn light" onclick="plansCatalog()">Administrar</button><button class="btn primary" onclick="newPlan()">＋ Agregar</button></div><div class="subcard"><b>Disciplinas</b><p class="muted">Disciplinas de la escuela.</p><button class="btn light" onclick="disciplinesCatalog()">Administrar</button><button class="btn primary" onclick="newDiscipline()">＋ Agregar</button></div><div class="subcard"><b>Horarios y grupos</b><p class="muted">Día, hora, salón y maestro.</p><button class="btn light" onclick="schedulesCatalog()">Administrar</button></div><div class="subcard"><b>Promociones</b><p class="muted">Meses, cuota y vigencia.</p><button class="btn light" onclick="view('promotions')">Administrar</button></div><div class="subcard"><b>Beneficios</b><p class="muted">Editables en cualquier momento.</p><button class="btn light" onclick="view('benefits')">Administrar</button></div><div class="subcard"><b>Penalizaciones de lockers</b><p class="muted">Catálogo de cobros.</p><button class="btn light" onclick="lockerPenaltyTypesCatalog()">Administrar</button></div></div><h3>📷 Dispositivos</h3><div class="cards"><div class="subcard"><b>Lector QR de asistencia</b><p class="muted">Registra lectores USB/Bluetooth.</p><button class="btn light" onclick="qrDevicesCatalog()">Administrar lectores</button></div><div class="subcard"><b>Dispositivo para fotos</b><p class="muted">Registra webcam o cámara.</p><button class="btn light" onclick="photoDevicesCatalog()">Administrar cámaras</button></div></div><h3>🔔 Credenciales y avisos</h3><div class="formgrid"><div class="full"><label>Pie de credencial QR</label><input id="cqrf" value="${esc(c.qr_footer||'EmpoderArte · Escuela de Danza')}"></div><div class="full"><label>Mensaje WhatsApp</label><textarea id="cwm">${esc(c.whatsapp_message||'Hola {nombre}, te recordamos que tu mensualidad vence el {vencimiento}. Importe: ${importe}. Gracias por formar parte de EmpoderArte.')}</textarea></div></div><h3>🔒 Lockers</h3><div class="formgrid"><div><label>Precio predeterminado</label><input id="clprice" type="number" min="0" value="${c.locker_default_price??100}"></div><div><label>Meses predeterminados</label><input id="clmonths" type="number" min="1" value="${c.locker_default_months??1}"></div></div><br><div class="actions"><button class="btn primary" onclick="saveSettings()">💾 Guardar configuración</button></div></div><br><div class="card"><h3>🔐 Seguridad</h3><div class="formgrid"><div><label>Contraseña actual</label><input id="pwdCurrent" type="password"></div><div><label>Nueva contraseña</label><input id="pwdNew" type="password"></div><div><label>Confirmar nueva contraseña</label><input id="pwdConfirm" type="password"></div></div><br><button class="btn primary" onclick="changePassword()">🔑 Cambiar contraseña</button></div>`}


function b64u(buf){const a=new Uint8Array(buf);let s='';for(const x of a)s+=String.fromCharCode(x);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function fromB64u(x){x=String(x).replace(/-/g,'+').replace(/_/g,'/');while(x.length%4)x+='=';const s=atob(x);const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a.buffer}
function bioStore(){try{return JSON.parse(localStorage.getItem('emp_biometrics')||'{}')}catch(e){return {}}}
function bioSave(x){localStorage.setItem('emp_biometrics',JSON.stringify(x))}
async function biometricEnroll(kind,id,label){if(!window.PublicKeyCredential||!navigator.credentials){throw Error('Este navegador no permite lector biométrico. Usa Chrome/Edge actualizado y Windows Hello o un lector compatible.')}const challenge=crypto.getRandomValues(new Uint8Array(32));const uid=crypto.getRandomValues(new Uint8Array(16));const cred=await navigator.credentials.create({publicKey:{challenge,rp:{name:'EmpoderArte'},user:{id:uid,name:`${kind}-${id}@empoderarte.local`,displayName:label||`${kind} ${id}`},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{userVerification:'required',residentKey:'preferred'},timeout:60000,attestation:'none'}});if(!cred)throw Error('No se pudo registrar la huella.');const store=bioStore();store[cred.id]={kind,id:Number(id),label:label||'',createdAt:new Date().toISOString()};bioSave(store);return cred.id}
async function biometricScan(){const store=bioStore(),ids=Object.entries(store);if(!ids.length)throw Error('Todavía no hay huellas registradas en este equipo. Primero registra una huella desde el botón 🖐 Huella de la persona.');if(!window.PublicKeyCredential||!navigator.credentials)throw Error('Este navegador no permite lector biométrico. Usa Chrome/Edge actualizado y Windows Hello o un lector compatible.');const allow=ids.map(([id])=>({type:'public-key',id:fromB64u(id)}));const cred=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:allow,userVerification:'required',timeout:60000}});if(!cred||!store[cred.id])throw Error('Huella no reconocida en este equipo.');return store[cred.id]}
async function biometricFor(kind,id,label){try{if(id){const store=bioStore(),key=Object.keys(store).find(k=>store[k].kind===kind&&Number(store[k].id)===Number(id));if(!key){const ok=confirm(`No hay una huella registrada para ${label||'esta persona'}. ¿Quieres registrarla ahora?`);if(!ok)return;await biometricEnroll(kind,id,label);toast('Huella registrada en este equipo');return}const found=await biometricScan();if(found.kind!==kind||Number(found.id)!==Number(id))throw Error('La huella corresponde a otra persona.');await biometricDoAttendance(found)}else{const found=await biometricScan();await biometricDoAttendance(found)}}catch(e){alert(e.message||'No se pudo usar el lector biométrico')}}
async function biometricDoAttendance(found){if(found.kind==='student'){const s=await api('/api/students/'+found.id);const d=await api('/api/attendance',{method:'POST',body:JSON.stringify({student_id:found.id,attended_at:todayLocal(),status:'Presente'})});closeModal();toast(d.already_registered?'La asistencia de hoy ya estaba registrada':'Asistencia del día registrada por huella');attendanceAlumnos();return} 
if(found.kind==='teacher'){const t=await api('/api/teachers/'+found.id);const hist=t.attendance||[],today=todayLocal(),open=hist.find(a=>a.attended_at===today&&a.entry_time&&!a.exit_time);await api('/api/teacher-attendance',{method:'POST',body:JSON.stringify({teacher_id:found.id,action:open?'salida':'entrada'})});toast('Asistencia de maestro registrada por huella');teachers();return}
if(found.kind==='personal'){const p=await api('/api/personal/'+found.id);const hist=p.attendance||[],today=todayLocal(),open=hist.find(a=>a.attended_at===today&&a.entry_time&&!a.exit_time);await api('/api/personal-attendance',{method:'POST',body:JSON.stringify({personal_id:found.id,action:open?'salida':'entrada'})});toast('Asistencia de personal registrada por huella');reception();}}

function initApp(){
  const loginBtn=$('loginBtn');
  if(loginBtn){loginBtn.addEventListener('click',e=>{e.preventDefault();login()});loginBtn.addEventListener('pointerup',e=>{if(e.button===0)e.preventDefault()})}
  setInterval(()=>{if($('clock'))$('clock').textContent=new Date().toLocaleString('es-MX')},1000);
  document.querySelectorAll('.nav[data-v]').forEach(b=>b.onclick=()=>view(b.dataset.v));
  if(token&&user){boot()}
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initApp)}else{initApp()}
</script></body></html>
