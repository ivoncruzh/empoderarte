<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EmpoderArte | Sistema Integral</title>
<style>
:root{--p:#6b3fa0;--g:#d4a84f;--bg:#f7f4fa;--ink:#30253b;--mut:#756b7d;--ok:#27844b;--bad:#bd3d49;--warn:#a97818}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:#2d2138;color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:3px;position:fixed;inset:0 auto 0 0;width:250px;overflow:auto}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:25px;color:#fff;padding:8px 10px 18px;border-bottom:1px solid #ffffff18;margin-bottom:8px}.brand small{display:block;font-size:10px;font-weight:500;color:#d9cce4}.nav{border:0;background:transparent;color:#e8dff0;text-align:left;padding:10px 11px;border-radius:9px;font-weight:700}.nav:hover,.nav.active{background:#ffffff16;color:#fff}.nav.director-only{display:none}.main{padding:25px;min-width:0;margin-left:250px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:26px}.top-right{display:flex;gap:8px;align-items:center}.top-right input{width:320px}.cards{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:14px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 6px 25px #2d21380d}.metric{font-size:28px;font-weight:900;margin-top:5px}.muted{color:var(--mut);font-size:13px}.section{margin-top:18px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.sectionhead h2,.sectionhead h3{margin:0}.tablewrap{overflow:auto;background:#fff;border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px;border-bottom:1px solid #eee7f0;text-align:left}.table th{font-size:12px;color:var(--mut);text-transform:uppercase}.status{display:inline-block;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800}.ok{background:#e8f7ed;color:var(--ok)}.bad{background:#fde9eb;color:var(--bad)}.warn{background:#fff5dc;color:var(--warn)}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#f0ebf5}.grid2,.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:9px 13px;font-weight:700}.primary{background:var(--p);color:white}.gold{background:var(--g);color:#2f2415}.light{background:#f0ebf5;color:var(--ink)}.danger{background:#fde7e9;color:#9e2835}.notice{padding:12px;border-radius:10px;background:#faf7fc;border:1px solid #e6ddec}.empty{text-align:center;padding:30px;color:var(--mut)}label{display:block;font-size:13px;font-weight:700;margin:9px 0 5px}input,select,textarea{width:100%;padding:10px 11px;border:1px solid #ddd3e6;border-radius:10px;background:#fff;color:var(--ink)}textarea{min-height:90px}.modal{position:fixed;inset:0;background:#2d213899;display:grid;place-items:center;padding:18px;z-index:50}.modalbox{background:#fff;border-radius:18px;padding:20px;width:min(850px,96vw);max-height:92vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0}.qr{width:180px;height:180px;background:#fff;border:1px dashed #bbb;display:grid;place-items:center;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee7f0}.toast{position:fixed;right:20px;bottom:20px;background:#2d2138;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:100}.small{font-size:12px}.subcard{background:#faf8fc;border:1px solid #eee7f0;border-radius:12px;padding:14px}.topbadge{padding:9px 12px;border-radius:10px;background:#fff0c9;color:#6a4b00;font-weight:800}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:800px){.app{display:block}.side{position:static;width:100%;height:auto}.main{margin:0;padding:15px}.top{display:block}.top-right{margin-top:10px}.top-right input{width:100%}.grid2,.formgrid{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}@media(max-width:520px){.cards{grid-template-columns:1fr}}
</style>
<style id="empoderarte-functional-style">
/* ===== CORRECCIÓN DE DISEÑO EMPODERARTE ===== */
.app{
  min-height:100vh;
  display:block;
}
.side{
  position:fixed;
  top:0;
  left:0;
  bottom:0;
  width:250px;
  z-index:20;
  background:var(--side,#2d2138);
}
.main{
  margin-left:250px;
  width:calc(100% - 250px);
  min-width:0;
  min-height:100vh;
  padding:28px 34px 40px;
}
.top{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:24px;
  margin-bottom:28px;
}
.top h1{
  margin:2px 0 0;
  font-size:30px;
  line-height:1.15;
}
.top-right{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:10px;
  flex:1;
}
.top-right input{
  width:min(360px,32vw);
}
.cards{
  width:100%;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}
.card{
  min-width:0;
}
.section{
  width:100%;
  margin-top:20px;
}
.tablewrap{
  width:100%;
  overflow:auto;
}
.brand-logo{
  width:42px;
  height:42px;
  object-fit:cover;
  border-radius:10px;
  background:#fff;
  flex:none;
}
.login-logo{
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:18px;
  margin:0 auto 10px;
  display:block;
}
.settings-logo{
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:16px;
  border:1px solid #ddd3e6;
  background:#fff;
  display:block;
  margin:8px 0;
}
@media(max-width:1000px){
  .main{padding:24px;}
  .top-right input{width:280px;}
  .cards{grid-template-columns:repeat(2,minmax(220px,1fr));}
}
@media(max-width:800px){
  .side{position:static;width:100%;height:auto;}
  .main{margin-left:0;width:100%;padding:18px;}
  .top{display:block;}
  .top-right{margin-top:14px;justify-content:stretch;flex-wrap:wrap;}
  .top-right input{width:100%;flex:1 1 100%;}
  .grid2,.formgrid{grid-template-columns:1fr;}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media(max-width:520px){
  .main{padding:14px;}
  .cards{grid-template-columns:1fr;}
  .top h1{font-size:26px;}
}
</style>
</head><body>
<section id="login" class="modal" style="background:linear-gradient(135deg,#f7efff,#fff9ef)"><div class="modalbox" style="width:min(430px,95vw);text-align:center"><img id="loginLogo" class="login-logo" src="/logo-empoderarte.jpg" alt="EmpoderArte"><div id="loginSchoolName" style="font-size:34px;font-weight:900;color:var(--p)">EmpoderArte</div><p id="loginSubtitle" class="muted">Sistema Integral de Gestión · Escuela de Danza</p><label style="text-align:left">Correo</label><input id="email" value="director@empoderarte.local"><label style="text-align:left">Contraseña</label><input id="password" type="password" value="empoderarte"><button class="btn primary" style="width:100%;margin-top:15px" onclick="login()">🚀 Entrar al sistema</button><p class="small muted">Versión integral · datos en PostgreSQL</p></div></section>
<section id="app" class="app hidden"><aside class="side"><div class="brand"><img id="brandLogo" class="brand-logo" src="/logo-empoderarte.jpg" alt="EmpoderArte"><div id="brandText">EmpoderArte<small>Escuela de Danza</small></div></div>
<button class="nav active" data-v="dashboard">🏠 Dashboard</button><button class="nav" data-v="students">👩‍🎓 Alumnos</button><button class="nav" data-v="attendanceAlumnos">✓ Asistencia alumnos</button><button class="nav" data-v="teachers">👩‍🏫 Maestros</button><button class="nav director-only" data-v="personal">👥 Personal</button><button class="nav director-only" data-v="payroll">💰 Nómina</button><button class="nav" data-v="reception">▣ Recepción</button><button class="nav" data-v="monthly">◷ Mensualidades</button><button class="nav" data-v="lockers">▣ Lockers</button><button class="nav" data-v="payments">$ Pagos</button><button class="nav" data-v="promotions">✦ Promociones</button><button class="nav" data-v="benefits">★ Beneficios</button><button class="nav" data-v="credential">▤ Credenciales QR</button><button class="nav" data-v="reports">▥ Reportes</button><button class="nav" data-v="alerts">🔔 Vencimientos</button><button class="nav director-only" data-v="users">♟ Usuarios</button><button class="nav director-only" data-v="audit">☷ Bitácora</button><button class="nav director-only" data-v="trash">⌫ Papelera</button><button class="nav director-only" data-v="settings">⚙ Configuración</button>
<div style="margin-top:auto;padding-top:15px"><div id="userBadge" class="small"></div><button class="nav" onclick="logout()">↪ Cerrar sesión</button></div></aside>
<main class="main"><div class="top"><div><div class="muted">EMPODERARTE</div><h1 id="title">Dashboard</h1></div><div class="top-right"><input id="globalSearch" placeholder="Buscar alumno, matrícula o teléfono..." oninput="globalSearch(this.value)"><button class="btn gold" onclick="view('credential')">📷 QR</button><span id="clock" class="topbadge"></span></div></div><div id="content"></div></main></section><div id="toast" class="toast"></div><div id="modalHost"></div>
<script>
let token=localStorage.emp_token||'',user=JSON.parse(localStorage.emp_user||'null'),appConfig={};let currentView='dashboard';const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
async function api(url,opt={}){const base={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};let last;for(let i=0;i<2;i++){try{const r=await fetch(url,{...opt,headers:base});const text=await r.text();let d={};try{d=text?JSON.parse(text):{}}catch(_){d={error:text||'Respuesta inválida del servidor'}}if(r.status===401){localStorage.removeItem('emp_token');localStorage.removeItem('emp_user');throw Error('Tu sesión expiró. Recarga la página e inicia sesión nuevamente.')}if(!r.ok)throw Error(d.error||('Error HTTP '+r.status));return d}catch(e){last=e;if(i===0){await new Promise(r=>setTimeout(r,900));continue}throw last}}}
function toast(x){$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}
function modal(title,body,action,fn){$('modalHost').innerHTML=`<div class="modal"><div class="modalbox"><div class="modalhead"><h2>${title}</h2><button class="btn light" onclick="closeModal()">×</button></div>${body}<div class="actions" style="margin-top:16px"><button class="btn primary" id="modalGo">${action}</button><button class="btn light" onclick="closeModal()">Cancelar</button></div></div></div>`;$('modalGo').onclick=async()=>{try{await fn()}catch(e){alert(e.message)}}}
function closeModal(){if(window.studentCameraStream){window.studentCameraStream.getTracks().forEach(t=>t.stop());window.studentCameraStream=null}window.pendingStudentPhotoEdit=undefined;$('modalHost').innerHTML=''}
async function login(){try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})}),d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;user=d.user;localStorage.emp_token=token;localStorage.emp_user=JSON.stringify(user);boot()}catch(e){alert(e.message)}}
function logout(){localStorage.removeItem('emp_token');localStorage.removeItem('emp_user');location.reload()}
async function boot(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('userBadge').textContent='👤 '+user.name+' · '+user.role;document.querySelectorAll('.director-only').forEach(x=>x.style.display=user.role==='director'?'block':'none');try{appConfig=await api('/api/settings');applySettings(appConfig)}catch(e){}view(user.role==='director'?'dashboard':'reception')}
const titles={dashboard:'Dashboard',students:'Alumnos',attendanceAlumnos:'Asistencia alumnos',teachers:'Maestros',personal:'Personal',payroll:'Nómina',reception:'Recepción',monthly:'Mensualidades',lockers:'Lockers',payments:'Pagos',promotions:'Promociones',benefits:'Beneficios',credential:'Credenciales QR',reports:'Reportes',alerts:'Vencimientos',users:'Usuarios',audit:'Bitácora',trash:'Papelera',settings:'Configuración'};
async function view(v){if(['personal','payroll','users','audit','trash','settings'].includes(v)&&user?.role!=='director'){alert('Esta sección es exclusiva del Director.');return}currentView=v;document.querySelectorAll('.nav[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===v));$('title').textContent=titles[v]||v;$('content').innerHTML='<div class="card"><div class="muted">Cargando '+esc(titles[v]||v)+'…</div></div>';try{const f={dashboard:dashboard,students:students,attendanceAlumnos:attendanceAlumnos,teachers:teachers,personal:personal,payroll:payroll,reception:reception,monthly:monthly,lockers:lockers,payments:payments,promotions:promotions,benefits:benefits,credential:credential,reports:reports,alerts:alerts,users:users,audit:audit,trash:trash,settings:settings}[v];if(f)await f();else $('content').innerHTML='<div class="card"><div class="empty">Módulo no disponible.</div></div>'}catch(e){console.error(e);$('content').innerHTML='<div class="card"><h3>⚠️ No se pudo cargar '+esc(titles[v]||v)+'</h3><div class="notice">'+esc(e.message||'Error desconocido')+'</div><br><button class="btn primary" onclick="view(\''+v+'\')">↻ Reintentar</button></div>'}}
function status(x){return x==='Vencido'?'<span class="status bad">Vencido</span>':x==='Próximo'?'<span class="status warn">Próximo</span>':x==='Al corriente'?'<span class="status ok">Al corriente</span>':'<span class="pill">'+esc(x||'—')+'</span>'}
function payTable(rows){return rows?.length?'<div class="tablewrap"><table class="table"><tr><th>Recibo</th><th>Alumno</th><th>Concepto</th><th>Monto</th><th>Método</th><th>Fecha</th><th></th></tr>'+rows.map(p=>`<tr><td><b>${esc(p.receipt_no)}</b></td><td>${esc(p.matricula)} · ${esc(p.name)} ${esc(p.last_name)}</td><td>${esc(p.concept)}</td><td>$${(+p.amount).toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td>${esc(p.method)}</td><td>${esc(p.paid_at)}</td><td>${user?.role==='director'?`<button class="btn danger" onclick="removeRecord('PAGO',${p.id},'el pago')">🗑 Eliminar</button>`:''}</td></tr>`).join('')+'</table></div>':'<div class="empty">Aún no hay registros.</div>'}
async function dashboard(){const d=await api('/api/dashboard');$('content').innerHTML=`<div class="cards"><div class="card"><div class="muted">Alumnos activos</div><div class="metric">${d.active}</div></div><div class="card"><div class="muted">Maestros</div><div class="metric">${d.teachers||0}</div></div><div class="card"><div class="muted">Vencidos</div><div class="metric">${d.overdue}</div></div><div class="card"><div class="muted">Vencen en 7 días</div><div class="metric">${d.upcoming}</div></div><div class="card"><div class="muted">Cobrado este mes</div><div class="metric">$${(+d.revenue).toLocaleString('es-MX')}</div></div></div><div class="section card"><div class="sectionhead"><h3>Próximos vencimientos</h3><button class="btn light" onclick="view('monthly')">Ver mensualidades</button></div>${d.exp.length?'<div class="tablewrap"><table class="table"><tr><th>Alumno</th><th>Vencimiento</th><th>Estado</th><th></th></tr>'+d.exp.map(s=>`<tr><td>${esc(s.matricula)} · ${esc(s.name)} ${esc(s.last_name)}</td><td>${esc(s.due_date)}</td><td>${status(s.payment_status||'Próximo')}</td><td><button class="btn gold" onclick="payFor(${s.id})">Cobrar</button></td></tr>`).join('')+'</table></div>':'<div class="empty">No hay vencimientos próximos.</div>'}</div><div class="section card"><h3>Últimos pagos</h3>${payTable(d.recent)}</div>`}
async function students(){const data=await api('/api/students');const r=Array.isArray(data)?data:[];$('content').innerHTML=`<div class="sectionhead"><input id="studentSearch" style="max-width:430px" placeholder="Buscar matrícula o nombre" oninput="searchStudents(this.value)"><button class="btn primary" onclick="newStudent()">＋ Nuevo alumno</button></div><div class="tablewrap"><table class="table" id="studentTable"><tr><th>Matrícula</th><th>Alumno</th><th>Plan</th><th>Cuota</th><th>Vencimiento</th><th>Estado</th><th></th></tr>${r.length?r.map(studentRow).join(''):'<tr><td colspan="7"><div class="empty">No hay alumnos registrados todavía.</div></td></tr>'}</table></div>`}
function studentRow(s){return `<tr><td><b>${esc(s.matricula)}</b></td><td>${esc(s.name)} ${esc(s.last_name)}<div class="muted">${esc(s.phone)}</div></td><td>${esc(s.plan)}</td><td>$${(+s.monthly_fee).toLocaleString('es-MX')}</td><td>${esc(s.due_date||'—')}</td><td>${status(s.payment_status)}</td><td class="actions"><button class="btn light" onclick="profile(${s.id})">Ficha</button><button class="btn gold" onclick="payFor(${s.id})">Cobrar</button>${user?.role==='director'?`<button class="btn danger" onclick="removeRecord('ALUMNO',${s.id},'el alumno')">🗑 Eliminar</button>`:''}</td></tr>`}
async function searchStudents(q){const r=await api('/api/students?q='+encodeURIComponent(q));$('studentTable').innerHTML='<tr><th>Matrícula</th><th>Alumno</th><th>Plan</th><th>Cuota</th><th>Vencimiento</th><th>Estado</th><th></th></tr>'+r.map(studentRow).join('')}
function defaultDueDate(){const now=new Date(),day=Math.min(31,Math.max(1,Number(appConfig.default_due_day||10)));let y=now.getFullYear(),m=now.getMonth()+1;if(m>11){m=0;y++}const last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(day,last),12).toISOString().slice(0,10)}
function newStudent(){modal('Nuevo alumno',`<div class="formgrid"><div><label>Nombre *</label><input id="sn"></div><div><label>Apellidos *</label><input id="sl"></div><div><label>Fecha de nacimiento</label><input id="sb" type="date"></div><div><label>Teléfono / WhatsApp</label><input id="sp"></div><div><label>Correo</label><input id="se"></div><div><label>Tutor / contacto</label><input id="st"></div><div><label>Teléfono tutor</label><input id="stp"></div><div><label>Plan</label><select id="spl"><option>Inicial</option><option>Plus</option><option>Premium</option><option>Elite</option></select></div><div><label>Cuota mensual</label><input id="sf" type="number" min="0" value="600"></div><div><label>Primer vencimiento</label><input id="sd" type="date"></div><div><label>Nivel de beneficio</label><select id="sbl"><option>Base</option><option>Plus</option><option>Premium</option><option>Elite</option></select></div><div class="full"><label>Notas</label><textarea id="sno"></textarea></div></div>`,'Crear matrícula',async()=>{const due=$('sd').value||defaultDueDate();const d=await api('/api/students',{method:'POST',body:JSON.stringify({name:$('sn').value,last_name:$('sl').value,birth_date:$('sb').value,phone:$('sp').value,email:$('se').value,tutor:$('st').value,tutor_phone:$('stp').value,plan:$('spl').value,monthly_fee:Number($('sf').value||0),due_date:due,benefit_level:$('sbl').value,notes:$('sno').value})});closeModal();toast('Alumno creado: '+d.matricula);students()})}
async function profile(id){const s=await api('/api/students/'+id);const ah=s.attendance?.length?'<div class="tablewrap"><table class="table"><tr><th>Fecha</th><th>Estatus</th><th>Disciplina</th><th></th></tr>'+s.attendance.map(a=>`<tr><td>${esc(a.attended_at)}</td><td>${esc(a.status)}</td><td>${esc(a.discipline)}</td><td>${user?.role==='director'?`<button class="btn danger" onclick="removeRecord('ASISTENCIA',${a.id},'la asistencia')">🗑 Eliminar</button>`:''}</td></tr>`).join('')+'</table></div>':'<div class="empty">Sin asistencia.</div>';modal('Ficha · '+esc(s.matricula),`<div class="grid2"><div><p><b>Alumno:</b> ${esc(s.name)} ${esc(s.last_name)}</p><p><b>Plan:</b> ${esc(s.plan)}</p><p><b>Cuota:</b> $${(+s.monthly_fee).toLocaleString('es-MX')}</p><p><b>Vencimiento:</b> ${esc(s.due_date||'—')}</p><p><b>Beneficio:</b> ${esc(s.benefit_level)}</p></div><div><p><b>Teléfono:</b> ${esc(s.phone)}</p><p><b>Correo:</b> ${esc(s.email)}</p><p><b>Tutor:</b> ${esc(s.tutor)}</p><p><b>Contacto:</b> ${esc(s.tutor_phone)}</p></div></div><hr><h3>Historial de pagos</h3>${payTable(s.payments)}<hr><h3>Asistencia reciente</h3>${ah}`,'Cerrar',closeModal)}
async function payFor(id){if(!id){const ss=await api('/api/students');modal('Seleccionar alumno',`<label>Alumno</label><select id="pick">${ss.map(s=>`<option value="${s.id}">${esc(s.matricula)} · ${esc(s.name)} ${esc(s.last_name)}</option>`).join('')}</select>`,'Continuar',()=>{const x=$('pick');closeModal();payFor(+x.value)});return}const s=await api('/api/students/'+id),charges=s.monthly_charges||[],open=charges.filter(x=>Number(x.balance)>0),current=open[0];const fmt=v=>Number(v||0).toLocaleString('es-MX',{minimumFractionDigits:2});const chOptions=open.map((x,i)=>`<option value="${x.id}" ${i===0?'selected':''}>${esc(x.period_start)} · vence ${esc(x.due_date)} · saldo $${fmt(x.balance)}</option>`).join('');const chTable=charges.length?`<div class="tablewrap"><table class="table"><tr><th>Periodo</th><th>Vencimiento</th><th>Cuota</th><th>Pagado</th><th>Saldo</th><th>Estado</th></tr>${charges.map(x=>`<tr><td>${esc(x.period_start)}</td><td>${esc(x.due_date)}</td><td>$${fmt(x.amount)}</td><td>$${fmt(x.paid_amount)}</td><td>$${fmt(x.balance)}</td><td>${status(x.status)}</td></tr>`).join('')}</table></div>`:'<div class="empty">Aún no hay mensualidades generadas.</div>';modal('Registrar pago',`<div class="notice"><b>${esc(s.name)} ${esc(s.last_name)}</b><br>Matrícula: ${esc(s.matricula||'')}<br>Las mensualidades se aplican por periodo y el sistema conserva el historial.</div>${chTable}${open.length?`<label>Mensualidad a cobrar *</label><select id="pcg" onchange="updatePayAmount()">${chOptions}</select>`:'<div class="notice">No hay mensualidades pendientes.</div>'}<label>Importe a pagar *</label><input id="pa" type="number" min="0.01" step="0.01" value="${Number(current?.balance||0)}"><label>Método</label><select id="pm">${(Array.isArray(appConfig.payment_methods)&&appConfig.payment_methods.length?appConfig.payment_methods:['Efectivo','Transferencia','Tarjeta','Otro']).map(x=>`<option>${esc(x)}</option>`).join('')}</select><label>Concepto</label><select id="pc"><option>Mensualidad</option><option>Inscripción</option><option>Uniforme</option><option>Otro</option></select><label>Fecha</label><input id="pd" type="date" value="${todayLocal()}"><div class="small muted">El periodo ya no se escribe manualmente. El sistema identifica la mensualidad seleccionada y, si el pago sobra, continúa con las siguientes pendientes.</div>`,'Registrar pago',async()=>{const concept=$('pc').value;const payload={student_id:id,amount:Number($('pa').value),method:$('pm').value,concept,paid_at:$('pd').value};if(concept==='Mensualidad'&&open.length){payload.charge_id=Number($('pcg').value);const selected=open.find(x=>String(x.id)===String(payload.charge_id));payload.period=selected?.period_start||'';}const d=await api('/api/payments',{method:'POST',body:JSON.stringify(payload)});closeModal();toast('Pago registrado · '+d.receipt_no+(Number(d.unapplied_amount||0)>0?' · Saldo a favor $'+fmt(d.unapplied_amount):''));view('monthly')})}
function updatePayAmount(){const el=$('pcg'),inp=$('pa');if(!el||!inp)return;const opt=el.options[el.selectedIndex];const m=opt?.textContent?.match(/saldo \$([\d,.]+)/i);if(m)inp.value=m[1].replace(/,/g,'')}
async function payments(){const r=await api('/api/payments');$('content').innerHTML=`<div class="sectionhead"><h3>Historial de pagos</h3><button class="btn primary" onclick="payFor()">＋ Registrar pago</button></div>${payTable(r)}`}
async function attendanceAlumnos(){const data=await api('/api/attendance');const r=Array.isArray(data)?data:[];$('content').innerHTML=`<div class="sectionhead"><h3>Control de asistencia de alumnos</h3><button class="btn primary" onclick="newAttendance()">＋ Registrar asistencia</button></div><div class="tablewrap"><table class="table"><tr><th>Fecha</th><th>Alumno</th><th>Disciplina</th><th>Grupo</th><th>Estatus</th><th></th></tr>${r.length?r.map(a=>`<tr><td>${esc(a.attended_at)}</td><td>${esc(a.matricula)} · ${esc(a.name)} ${esc(a.last_name)}</td><td>${esc(a.discipline)}</td><td>${esc(a.group_name)}</td><td>${esc(a.status)}</td><td>${user?.role==='director'?`<button class="btn danger" onclick="removeRecord('ASISTENCIA',${a.id},'la asistencia')">🗑 Eliminar</button>`:''}</td></tr>`).join(''):'<tr><td colspan="6"><div class="empty">No hay asistencias registradas.</div></td></tr>'}</table></div>`}
async function newAttendance(){const ss=await api('/api/students');modal('Registrar asistencia',`<label>Alumno</label><select id="aa">${ss.map(s=>`<option value="${s.id}">${esc(s.matricula)} · ${esc(s.name)} ${esc(s.last_name)}</option>`).join('')}</select><label>Disciplina</label><input id="ad"><label>Grupo</label><input id="ag"><label>Estatus</label><select id="as"><option>Presente</option><option>Ausente</option><option>Retardo</option><option>Justificado</option></select><label>Fecha</label><input id="af" type="date" value="${new Date().toISOString().slice(0,10)}">`,'Guardar',async()=>{await api('/api/attendance',{method:'POST',body:JSON.stringify({student_id:+$('aa').value,discipline:$('ad').value,group_name:$('ag').value,status:$('as').value,attended_at:$('af').value})});closeModal();toast('Asistencia registrada');attendanceAlumnos()})}
async function teachers(){const r=await api('/api/teachers');$('content').innerHTML=`<div class="sectionhead"><h3>Maestros</h3>${user.role==='director'?'<button class="btn primary" onclick="newTeacher()">＋ Nuevo maestro</button>':''}</div><div class="tablewrap"><table class="table"><tr><th>Maestro</th><th>Matrícula</th><th>Disciplina</th><th>Tarifa/hora</th><th>Estado</th><th></th></tr>${r.map(t=>`<tr><td>${esc(t.name)} ${esc(t.last_name)}</td><td><b>${esc(t.matricula)}</b></td><td>${esc(t.discipline)}</td><td>$${(+t.rate_hour).toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td>${esc(t.status)}</td><td class="actions"><button class="btn light" onclick="teacherAttendance(${t.id})">Asistencia</button><button class="btn gold" onclick="teacherQR(${t.id})">QR</button>${user.role==='director'?`<button class="btn danger" onclick="removeRecord('MAESTRO',${t.id},'el maestro')">🗑 Eliminar</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">Aún no hay maestros.</div></td></tr>'}</table></div>`}
async function newTeacher(){const disc=await api('/api/disciplines');modal('Nuevo maestro',`<div class="formgrid"><div><label>Nombre *</label><input id="tn"></div><div><label>Apellidos *</label><input id="tl"></div><div><label>Teléfono</label><input id="tt"></div><div><label>Correo</label><input id="te"></div><div><label>Disciplina habitual</label><select id="td"><option value="">Se asignará según el horario</option>${activeOpts(disc,'Sin disciplina')}</select></div><div><label>Pago por hora</label><input id="tr" type="number" min="0" value="150"></div><div class="full"><label>Notas</label><textarea id="tno"></textarea></div></div><div class="notice" style="margin-top:12px">La disciplina que se mostrará al registrar asistencia se determina automáticamente con el horario configurado para ese maestro y esa hora.</div>`,'Guardar maestro',async()=>{const d=await api('/api/teachers',{method:'POST',body:JSON.stringify({name:$('tn').value,last_name:$('tl').value,phone:$('tt').value,email:$('te').value,discipline:$('td').selectedOptions[0]?.textContent||'',rate_hour:Number($('tr').value||0),notes:$('tno').value})});closeModal();toast('Maestro registrado: '+d.matricula);teachers()})}
async function trash(){const r=await api('/api/trash');$('content').innerHTML='<div class="card"><div class="sectionhead"><h3>🗑️ Papelera</h3><span class="muted">Los registros eliminados pueden restaurarse.</span></div>'+r.map(x=>`<div class="bar"><span><b>${esc(x.name||x.entity_type)}</b><br><small>${esc(x.matricula||'')} · ${esc(x.entity_type)} · ${esc(x.deleted_at)}</small></span><button class="btn primary" onclick="restore(${x.id})">↶ Restaurar</button></div>`).join('')||'<div class="empty">La papelera está vacía.</div>'+'</div><br><div class="notice">La Bitácora y la configuración no se eliminan para conservar la seguridad e integridad del sistema.</div>'}
async function restore(id){await api('/api/trash/'+id+'/restore',{method:'POST'});toast('Registro restaurado');trash()}
function applySettings(c){c=c||{};document.documentElement.style.setProperty('--p',c.primary_color||'#6b3fa0');document.documentElement.style.setProperty('--g',c.secondary_color||'#d4a84f');document.documentElement.style.setProperty('--side',c.sidebar_color||'#2d2138');document.documentElement.style.setProperty('--bg',c.background_color||'#f7f4fa');document.documentElement.style.setProperty('--ink',c.text_color||'#30253b');const logo=c.logo_data||c.logo_url||'/logo-empoderarte.jpg';const bl=$('brandLogo'),ll=$('loginLogo');if(bl)bl.src=logo;if(ll)ll.src=logo;const bt=$('brandText');if(bt)bt.innerHTML=`${esc(c.school_name||'EmpoderArte')}<small>${esc(c.subtitle||'Escuela de Danza')}</small>`;const ls=$('loginSchoolName');if(ls)ls.textContent=c.school_name||'EmpoderArte';const lsub=$('loginSubtitle');if(lsub)lsub.textContent='Sistema Integral de Gestión · '+(c.subtitle||'Escuela de Danza');document.title=(c.school_name||'EmpoderArte')+' | Sistema Integral'}
async function changePassword(){const current=$('pwdCurrent').value,newp=$('pwdNew').value,confirm=$('pwdConfirm').value;try{const r=await api('/api/change-password',{method:'POST',body:JSON.stringify({current_password:current,new_password:newp,confirm_password:confirm})});toast(r.message||'Contraseña cambiada correctamente');$('pwdCurrent').value='';$('pwdNew').value='';$('pwdConfirm').value=''}catch(e){alert(e.message)}}
async function settings(){const c=await api('/api/settings');const pm=Array.isArray(c.payment_methods)?c.payment_methods.join(', '):'Efectivo, Transferencia, Tarjeta, Otro';$('content').innerHTML=`<div class="card"><h3>⚙ Configuración general</h3><div class="notice">Aquí puedes administrar la identidad, apariencia y reglas principales de EmpoderArte. Los cambios se guardan en PostgreSQL y se aplican al sistema.</div><h3>🏫 Identidad de la academia</h3><div class="formgrid"><div><label>Nombre de la escuela</label><input id="ce" value="${esc(c.school_name||'EmpoderArte Escuela de Danza')}"></div><div><label>Subtítulo</label><input id="cs" value="${esc(c.subtitle||'Escuela de Danza')}"></div><div><label>Teléfono</label><input id="ctel" value="${esc(c.phone||'')}"></div><div><label>WhatsApp</label><input id="cwa" value="${esc(c.whatsapp||'')}"></div><div><label>Correo</label><input id="cem" type="email" value="${esc(c.email||'')}"></div><div><label>Dirección</label><input id="cad" value="${esc(c.address||'')}"></div><div><label>Facebook</label><input id="cfb" value="${esc(c.facebook||'')}"></div><div><label>Instagram</label><input id="cig" value="${esc(c.instagram||'')}"></div></div><h3>🎨 Apariencia</h3><div class="formgrid"><div><label>Color principal</label><input id="cprimary" type="color" value="${esc(c.primary_color||'#6b3fa0')}" style="height:44px;padding:4px"></div><div><label>Color secundario / dorado</label><input id="csecondary" type="color" value="${esc(c.secondary_color||'#d4a84f')}" style="height:44px;padding:4px"></div><div><label>Color del menú lateral</label><input id="cside" type="color" value="${esc(c.sidebar_color||'#2d2138')}" style="height:44px;padding:4px"></div><div><label>Color de fondo</label><input id="cbg" type="color" value="${esc(c.background_color||'#f7f4fa')}" style="height:44px;padding:4px"></div><div><label>Color de texto</label><input id="ctext" type="color" value="${esc(c.text_color||'#30253b')}" style="height:44px;padding:4px"></div><div><label>Logo</label><input id="clogo" type="file" accept="image/png,image/jpeg,image/webp" onchange="previewLogo(this)"><img id="settingsLogo" class="settings-logo" src="${esc(c.logo_data||c.logo_url||'/logo-empoderarte.jpg')}" alt="Logo"><button type="button" class="btn light" onclick="resetLogo()">Usar logo oficial</button></div></div><h3>💰 Pagos y recibos</h3><div class="formgrid"><div><label>Moneda</label><input id="cm" value="${esc(c.currency||'MXN')}"></div><div><label>Prefijo de recibos</label><input id="crp" value="${esc(c.receipt_prefix||'REC')}"></div><div class="full"><label>Métodos de pago (separados por coma)</label><input id="cpm" value="${esc(pm)}"></div><div class="full"><label>Mensaje del recibo</label><textarea id="crm">${esc(c.receipt_message||'Gracias por formar parte de EmpoderArte.')}</textarea></div></div><h3>🎓 Alumnos y mensualidades</h3><div class="formgrid"><div><label>Prefijo de matrícula</label><input id="cp" value="${esc(c.matricula_prefix||'EMP')}"></div><div><label>Día predeterminado de vencimiento</label><input id="cd" type="number" min="1" max="31" value="${c.default_due_day||10}"></div><div><label>Días para alerta de WhatsApp</label><input id="cw" type="number" min="0" value="${c.whatsapp_days??3}"></div><div><label>Días de tolerancia</label><input id="ctol" type="number" min="0" value="${c.tolerance_days??0}"></div></div><h3>🔔 Vencimientos y 🪪 credenciales</h3><div class="formgrid"><div class="full"><label>Pie de credencial QR</label><input id="cqrf" value="${esc(c.qr_footer||'EmpoderArte · Escuela de Danza')}"></div><div class="full"><label>Mensaje de WhatsApp</label><textarea id="cwm">${esc(c.whatsapp_message||'Hola {nombre}, te recordamos que tu mensualidad vence el {vencimiento}. Importe: ${importe}. Gracias por formar parte de EmpoderArte.')}</textarea></div></div><h3>🔒 Lockers</h3><div class="formgrid"><div><label>Precio predeterminado</label><input id="clprice" type="number" min="0" value="${c.locker_default_price??100}"></div><div><label>Meses predeterminados</label><input id="clmonths" type="number" min="1" value="${c.locker_default_months??1}"></div></div><br><div class="actions"><button class="btn primary" onclick="saveSettings()">💾 Guardar configuración</button></div></div><br><div class="card"><h3>🔐 Seguridad de mi cuenta</h3><p class="muted">Cambia la contraseña de la cuenta con la que estás iniciando sesión. La nueva contraseña debe tener al menos 8 caracteres.</p><div class="formgrid"><div><label>Contraseña actual</label><input id="pwdCurrent" type="password" autocomplete="current-password"></div><div><label>Nueva contraseña</label><input id="pwdNew" type="password" autocomplete="new-password"></div><div><label>Confirmar nueva contraseña</label><input id="pwdConfirm" type="password" autocomplete="new-password"></div></div><br><div class="actions"><button class="btn primary" onclick="changePassword()">🔑 Cambiar contraseña</button></div></div><br><div class="card"><h3>🗑️ Eliminación y seguridad</h3><p class="muted">Las eliminaciones las realiza únicamente el Director y los registros pasan primero a Papelera. La Bitácora permanece protegida para conservar el historial.</p></div><br><div class="card"><h3>🔐 Planes de lockers</h3><p class="muted">Puedes administrar los planes desde <button class="btn light" onclick="lockerPlans()">Planes de lockers</button>. Un plan asociado a un locker no puede eliminarse.</p></div>`}
function previewLogo(input){const f=input?.files?.[0];if(!f)return;if(f.size>700000){alert('El logo debe pesar menos de 700 KB.');input.value='';return}const reader=new FileReader();reader.onload=()=>{window.pendingLogo=reader.result;$('settingsLogo').src=reader.result};reader.readAsDataURL(f)}
function resetLogo(){window.pendingLogo='/logo-empoderarte.jpg';if($('settingsLogo'))$('settingsLogo').src='/logo-empoderarte.jpg';if($('clogo'))$('clogo').value=''}
async function saveSettings(){const logo=window.pendingLogo!==undefined?window.pendingLogo:(appConfig.logo_data||'');const methods=$('cpm').value.split(',').map(x=>x.trim()).filter(Boolean);const b={school_name:$('ce').value,subtitle:$('cs').value,phone:$('ctel').value,whatsapp:$('cwa').value,email:$('cem').value,address:$('cad').value,facebook:$('cfb').value,instagram:$('cig').value,primary_color:$('cprimary').value,secondary_color:$('csecondary').value,sidebar_color:$('cside').value,background_color:$('cbg').value,text_color:$('ctext').value,logo_data:logo,logo_url:'/logo-empoderarte.jpg',currency:$('cm').value,receipt_prefix:$('crp').value,matricula_prefix:$('cp').value,default_due_day:Number($('cd').value),whatsapp_days:Number($('cw').value),tolerance_days:Number($('ctol').value),payment_methods:methods,receipt_message:$('crm').value,qr_footer:$('cqrf').value,whatsapp_message:$('cwm').value,locker_default_price:Number($('clprice').value||0),locker_default_months:Number($('clmonths').value||1)};appConfig=await api('/api/settings',{method:'PUT',body:JSON.stringify(b)});applySettings(appConfig);window.pendingLogo=undefined;toast('Configuración guardada');settings()}
async function globalSearch(q){if(!q||q.length<2)return;clearTimeout(window.gst);window.gst=setTimeout(async()=>{const r=await api('/api/students?q='+encodeURIComponent(q));if(r.length===1)profile(r[0].id)},500)}



/* ===== EmpoderArte 2.2: catálogos, fotos, QR y edición ===== */
function fmtDate(x){return x||'—'}
function todayLocal(){return new Date().toISOString().slice(0,10)}
function addMonthsClient(date,n){const d=new Date((date||todayLocal())+'T12:00:00');d.setMonth(d.getMonth()+Number(n||0));return d.toISOString().slice(0,10)}
function activeOpts(rows,placeholder){return `<option value="">${placeholder||'Selecciona'}</option>`+rows.filter(x=>x.active!==0).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}
function photoTag(src,alt='Foto'){return src?`<img src="${esc(src)}" alt="${esc(alt)}" style="width:110px;height:110px;object-fit:cover;border-radius:18px;border:1px solid #ddd3e6">`:`<div style="width:110px;height:110px;border-radius:18px;background:#f0ebf5;display:grid;place-items:center;font-size:42px">👤</div>`}

async function students(){const data=await api('/api/students');const r=Array.isArray(data)?data:[];$('content').innerHTML=`<div class="sectionhead"><input id="studentSearch" style="max-width:430px" placeholder="Buscar matrícula o nombre" oninput="searchStudents(this.value)"><button class="btn primary" onclick="newStudent()">＋ Nuevo alumno</button></div><div class="tablewrap"><table class="table" id="studentTable"><tr><th>Foto</th><th>Matrícula</th><th>Alumno</th><th>Plan</th><th>Cuota</th><th>Ingreso</th><th>Vencimiento</th><th>Estado</th><th></th></tr>${r.length?r.map(s=>`<tr><td>${photoTag(s.photo_data,'Foto')}</td><td><b>${esc(s.matricula)}</b></td><td>${esc(s.name)} ${esc(s.last_name)}<div class="muted">${esc(s.phone)}</div></td><td>${esc(s.plan)}</td><td>$${(+s.monthly_fee).toLocaleString('es-MX')}</td><td>${esc(s.enrollment_date||'—')}</td><td>${esc(s.due_date||'—')}</td><td>${status(s.payment_status)}</td><td class="actions"><button class="btn light" onclick="profile(${s.id})">Ficha</button><button class="btn gold" onclick="payFor(${s.id})">Cobrar</button>${user?.role==='director'?`<button class="btn danger" onclick="removeRecord('ALUMNO',${s.id},'el alumno')">🗑 Eliminar</button>`:''}</td></tr>`).join(''):'<tr><td colspan="9"><div class="empty">No hay alumnos registrados todavía.</div></td></tr>'}</table></div>`}

async function newStudent(){const [plans,disc]=await Promise.all([api('/api/plans'),api('/api/disciplines')]);window.studentPlansForForm=plans;modal('Nuevo alumno',`<div class="formgrid"><div><label>Nombre *</label><input id="sn"></div><div><label>Apellidos *</label><input id="sl"></div><div><label>Fecha de nacimiento</label><input id="sb" type="date"></div><div><label>Fecha exacta de ingreso *</label><input id="sen" type="date" value="${todayLocal()}" onchange="syncNewStudentPlan()"></div><div><label>Teléfono / WhatsApp</label><input id="sp"></div><div><label>Correo</label><input id="se" type="email"></div><div><label>Tutor / contacto</label><input id="st"></div><div><label>Teléfono tutor</label><input id="stp"></div><div><label>Plan / paquete</label><select id="spl" onchange="syncNewStudentPlan()"><option value="">Sin plan</option>${plans.filter(x=>x.active!==0).map(p=>`<option value="${p.id}">${esc(p.name)} · $${Number(p.fee||0).toLocaleString('es-MX')} · ${p.months} mes(es)</option>`).join('')}</select></div><div><label>Cuota</label><input id="sf" type="number" min="0" value="0"></div><div><label>Inicio del plan</label><input id="sps" type="date" value="${todayLocal()}" onchange="syncNewStudentPlan()"></div><div><label>Vencimiento individual</label><input id="sd" type="date"></div><div><label>Disciplina</label><select id="sdi">${activeOpts(disc,'Sin disciplina')}</select></div><div><label>Grupo</label><input id="sg"></div><div><label>Nivel de beneficio</label><input id="sbl" value="Base"></div><div><label>Estado</label><select id="sst"><option>Activo</option><option>Inactivo</option><option>Dado de baja</option></select></div><div class="full"><label>Foto del alumno</label><input id="sphoto" type="file" accept="image/*" onchange="previewStudentPhoto(this)"><div id="studentPhotoPreview" style="margin-top:8px"></div><button type="button" class="btn light" onclick="openStudentCamera(null)">📷 Tomar foto con cámara</button></div><div class="full"><label>Notas</label><textarea id="sno"></textarea></div></div>`,'Crear matrícula',async()=>{const plan=plans.find(x=>String(x.id)===$('spl').value);const start=$('sps').value||$('sen').value||todayLocal();const due=$('sd').value||(plan?addMonthsClient(start,plan.months):addMonthsClient(start,1));const end=plan?addMonthsClient(start,plan.months):'';const d=await api('/api/students',{method:'POST',body:JSON.stringify({name:$('sn').value,last_name:$('sl').value,birth_date:$('sb').value,enrollment_date:$('sen').value,phone:$('sp').value,email:$('se').value,tutor:$('st').value,tutor_phone:$('stp').value,plan_id:plan?.id||null,plan:plan?.name||'Sin plan',monthly_fee:Number($('sf').value||plan?.fee||0),due_date:due,plan_start_date:start,plan_end_date:end,discipline_id:$('sdi').value||null,group_name:$('sg').value,benefit_level:$('sbl').value,status:$('sst').value,photo_data:window.pendingStudentPhoto||'',notes:$('sno').value})});window.pendingStudentPhoto=undefined;window.studentPlansForForm=null;closeModal();toast('Alumno creado: '+d.matricula);students()})}
function syncNewStudentPlan(){const plans=window.studentPlansForForm||[],sel=$('spl'),plan=plans.find(x=>String(x.id)===String(sel?.value||''));if(!plan)return;const start=$('sps')?.value||$('sen')?.value||todayLocal();if($('sf'))$('sf').value=Number(plan.fee||0);if($('sd'))$('sd').value=addMonthsClient(start,Number(plan.months||1));}

function previewStudentPhoto(input){const f=input?.files?.[0];if(!f)return;if(f.size>900000){alert('La foto debe pesar menos de 900 KB.');input.value='';return}const reader=new FileReader();reader.onload=()=>{window.pendingStudentPhoto=reader.result;const el=$('studentPhotoPreview');if(el)el.innerHTML=photoTag(reader.result,'Vista previa')};reader.readAsDataURL(f)}

async function profile(id){const s=await api('/api/students/'+id);const ah=s.attendance?.length?'<div class="tablewrap"><table class="table"><tr><th>Fecha</th><th>Estatus</th><th>Disciplina</th><th>Grupo</th></tr>'+s.attendance.map(a=>`<tr><td>${esc(a.attended_at)}</td><td>${esc(a.status)}</td><td>${esc(a.discipline)}</td><td>${esc(a.group_name)}</td></tr>`).join('')+'</table></div>':'<div class="empty">Sin asistencia.</div>';const ch=s.monthly_charges||[];const cht=ch.length?'<div class="tablewrap"><table class="table"><tr><th>Periodo</th><th>Vencimiento</th><th>Cuota</th><th>Pagado</th><th>Saldo</th><th>Estado</th></tr>'+ch.map(x=>`<tr><td>${esc(x.period_start)}</td><td>${esc(x.due_date)}</td><td>$${(+x.amount).toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td>$${(+x.paid_amount).toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td>$${(+x.balance).toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td>${status(x.status)}</td></tr>`).join('')+'</table></div>':'<div class="empty">Sin cargos mensuales.</div>';const body=`<div class="grid2"><div><div style="display:flex;gap:14px;align-items:center">${photoTag(s.photo_data,'Foto de '+s.name)}<div><h3 style="margin:0">${esc(s.name)} ${esc(s.last_name)}</h3><div class="pill">${esc(s.matricula)}</div></div></div><br><button class="btn light" onclick="editStudent(${s.id})">✏️ Editar ficha</button><button class="btn light" onclick="openStudentCamera(${s.id})">📷 Cambiar foto</button></div><div><p><b>Ingreso:</b> ${esc(s.enrollment_date)}</p><p><b>Plan:</b> ${esc(s.plan_name||s.plan)}</p><p><b>Cuota:</b> $${(+s.monthly_fee).toLocaleString('es-MX')}</p><p><b>Vencimiento:</b> ${esc(s.due_date||'—')}</p><p><b>Estado:</b> ${esc(s.status)}</p><p><b>Disciplina:</b> ${esc(s.discipline_name||'—')} · <b>Grupo:</b> ${esc(s.group_name||'—')}</p></div></div><hr><div class="grid2"><div><p><b>Teléfono:</b> ${esc(s.phone)}</p><p><b>Correo:</b> ${esc(s.email)}</p></div><div><p><b>Tutor:</b> ${esc(s.tutor)}</p><p><b>Contacto:</b> ${esc(s.tutor_phone)}</p></div></div><hr><h3>Mensualidades por periodo</h3>${cht}<hr><h3>Historial de pagos</h3>${payTable(s.payments)}<hr><h3>Asistencia reciente</h3>${ah}`;modal('Ficha · '+esc(s.matricula),body,'Cerrar',closeModal)}
function syncEditStudentPlan(){const plans=window.editStudentPlans||[],p=plans.find(x=>String(x.id)===String($('epl')?.value||''));if(!p)return;if($('ef'))$('ef').value=Number(p.fee||0);const start=$('eps')?.value||$('ee')?.value||todayLocal();if($('ed'))$('ed').value=addMonthsClient(start,Number(p.months||1));}
async function editStudent(id){const s=await api('/api/students/'+id),plans=await api('/api/plans'),disc=await api('/api/disciplines');window.editStudentPlans=plans;modal('Editar ficha · '+esc(s.matricula),`<div class="formgrid"><div><label>Nombre *</label><input id="en" value="${esc(s.name)}"></div><div><label>Apellidos *</label><input id="el" value="${esc(s.last_name)}"></div><div><label>Fecha de nacimiento</label><input id="eb" type="date" value="${esc(s.birth_date||'')}"></div><div><label>Fecha exacta de ingreso</label><input id="ee" type="date" value="${esc(s.enrollment_date||'')}"></div><div><label>Teléfono</label><input id="ep" value="${esc(s.phone||'')}"></div><div><label>Correo</label><input id="eem" type="email" value="${esc(s.email||'')}"></div><div><label>Tutor</label><input id="et" value="${esc(s.tutor||'')}"></div><div><label>Teléfono tutor</label><input id="etp" value="${esc(s.tutor_phone||'')}"></div><div><label>Plan</label><select id="epl" onchange="syncEditStudentPlan()">${activeOpts(plans,'Sin plan')}</select></div><div><label>Cuota</label><input id="ef" type="number" min="0" value="${+s.monthly_fee||0}"></div><div><label>Inicio del plan</label><input id="eps" type="date" value="${esc(s.plan_start_date||s.enrollment_date||'')}"></div><div><label>Vencimiento individual</label><input id="ed" type="date" value="${esc(s.due_date||'')}"></div><div><label>Disciplina</label><select id="edi">${activeOpts(disc,'Sin disciplina')}</select></div><div><label>Grupo</label><input id="eg" value="${esc(s.group_name||'')}"></div><div><label>Beneficio</label><input id="ebl" value="${esc(s.benefit_level||'Base')}"></div><div><label>Estado</label><select id="est"><option ${s.status==='Activo'?'selected':''}>Activo</option><option ${s.status==='Inactivo'?'selected':''}>Inactivo</option><option ${s.status==='Dado de baja'?'selected':''}>Dado de baja</option></select></div><div class="full"><label>Foto</label><input id="ephoto" type="file" accept="image/*" onchange="previewEditPhoto(this)"><div id="editPhotoPreview" style="margin-top:8px">${photoTag(s.photo_data,'Foto')}</div><button type="button" class="btn light" onclick="openStudentCamera(${s.id})">📷 Tomar/cambiar foto</button></div><div class="full"><label>Notas</label><textarea id="eno">${esc(s.notes||'')}</textarea></div></div>`,'Guardar cambios',async()=>{const plan=plans.find(x=>String(x.id)===$('epl').value);const start=$('eps').value||$('ee').value;const end=plan?addMonthsClient(start,plan.months):(s.plan_end_date||'');const d=await api('/api/students/'+id,{method:'PUT',body:JSON.stringify({name:$('en').value,last_name:$('el').value,birth_date:$('eb').value,enrollment_date:$('ee').value,phone:$('ep').value,email:$('eem').value,tutor:$('et').value,tutor_phone:$('etp').value,plan_id:$('epl').value||null,plan:plan?.name||s.plan,monthly_fee:Number($('ef').value||plan?.fee||0),plan_start_date:start,plan_end_date:end,due_date:$('ed').value,discipline_id:$('edi').value||null,group_name:$('eg').value,benefit_level:$('ebl').value,status:$('est').value,photo_data:window.pendingStudentPhotoEdit!==undefined?window.pendingStudentPhotoEdit:(s.photo_data||''),notes:$('eno').value})});window.pendingStudentPhotoEdit=undefined;closeModal();toast('Ficha actualizada');profile(d.id)}) ;setTimeout(()=>{$('epl').value=s.plan_id||'';$('edi').value=s.discipline_id||''},0)}
function previewEditPhoto(input){const f=input?.files?.[0];if(!f)return;if(f.size>900000){alert('La foto debe pesar menos de 900 KB.');input.value='';return}const reader=new FileReader();reader.onload=()=>{window.pendingStudentPhotoEdit=reader.result;if($('editPhotoPreview'))$('editPhotoPreview').innerHTML=photoTag(reader.result,'Vista previa')};reader.readAsDataURL(f)}
async function openStudentCamera(id){
  let devices=[]; let configured=[];
  try{devices=await navigator.mediaDevices.enumerateDevices();}catch(e){}
  try{configured=await api('/api/photo-devices');}catch(e){}
  const cams=devices.filter(x=>x.kind==='videoinput');
  const activeConfigured=configured.filter(x=>x.active!==0);
  const options=activeConfigured.map(d=>`<option value="${esc(d.device_id||'')}">${esc(d.name)}${d.device_id?' · '+esc(d.device_id):''}</option>`).join('');
  const cameraOptions=cams.map((x,i)=>`<option value="${esc(x.deviceId)}">${esc(x.label||'Cámara '+(i+1))}</option>`).join('');
  const target=id===null?'nuevo alumno':('alumno #'+id);
  modal('Tomar foto · '+target,`<video id="studentVideo" autoplay playsinline style="width:100%;max-height:380px;border-radius:16px;background:#111"></video><canvas id="studentCanvas" class="hidden"></canvas>${activeConfigured.length?`<label>Dispositivo registrado</label><select id="photoDeviceRegistered"><option value="">Usar selección del navegador</option>${options}</select>`:''}<label>Cámara disponible</label><select id="camSelect">${cameraOptions||'<option value="">Cámara predeterminada</option>'}</select><p class="small muted">Permite el acceso a la cámara cuando el navegador lo solicite.</p>`,'Capturar foto',async()=>{
    const v=$('studentVideo'),c=$('studentCanvas'); if(!v?.videoWidth){alert('La cámara todavía no está lista.');return}
    c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);const data=c.toDataURL('image/jpeg',0.82);
    if(window.studentCameraStream){window.studentCameraStream.getTracks().forEach(t=>t.stop());window.studentCameraStream=null}
    if(id===null){window.pendingStudentPhoto=data;const prev=$('studentPhotoPreview');if(prev)prev.innerHTML=photoTag(data,'Vista previa');closeModal();toast('Foto lista para el nuevo alumno');}
    else {await api('/api/students/'+id,{method:'PUT',body:JSON.stringify({photo_data:data})});closeModal();toast('Foto actualizada');profile(id)}
  });
  async function startCam(deviceId){try{if(window.studentCameraStream){window.studentCameraStream.getTracks().forEach(t=>t.stop())}const stream=await navigator.mediaDevices.getUserMedia({video:deviceId?{deviceId:{exact:deviceId}}:true});window.studentCameraStream=stream;const v=$('studentVideo');if(v)v.srcObject=stream}catch(e){alert('No se pudo abrir la cámara: '+e.message)}}
  setTimeout(()=>{const reg=$('photoDeviceRegistered'),sel=$('camSelect');reg?.addEventListener('change',()=>{const wanted=reg.value;if(wanted&&sel){const match=[...sel.options].find(o=>o.value===wanted);if(match)sel.value=wanted}startCam(sel?.value||'')});sel?.addEventListener('change',()=>startCam(sel.value));const configuredId=activeConfigured.find(d=>d.device_id&&[...sel.options].some(o=>o.value===d.device_id))?.device_id;if(configuredId&&sel){sel.value=configuredId}startCam(sel?.value||'')},100);
}

async function attendanceAlumnos(){const data=await api('/api/attendance');const r=Array.isArray(data)?data:[];$('content').innerHTML=`<div class="sectionhead"><h3>Control de asistencia de alumnos</h3><div class="actions"><button class="btn gold" onclick="scanAttendance()">📷 Escanear QR</button><button class="btn primary" onclick="newAttendance()">＋ Registrar asistencia</button></div></div><div class="card notice"><b>Control de acceso:</b> al escanear una credencial se valida automáticamente que el alumno esté activo y tenga su mensualidad vigente. Si está dado de baja o tiene adeudo vencido, el acceso queda restringido.</div><br><div class="tablewrap"><table class="table"><tr><th>Fecha</th><th>Alumno</th><th>Disciplina</th><th>Grupo</th><th>Estatus</th><th>Acceso</th><th></th></tr>${r.length?r.map(a=>`<tr><td>${esc(a.attended_at)}</td><td>${esc(a.matricula)} · ${esc(a.name)} ${esc(a.last_name)}</td><td>${esc(a.discipline)}</td><td>${esc(a.group_name)}</td><td>${esc(a.status)}</td><td>${esc(a.access_result||'Permitido')}</td><td>${user?.role==='director'?`<button class="btn danger" onclick="removeRecord('ASISTENCIA',${a.id},'la asistencia')">🗑 Eliminar</button>`:''}</td></tr>`).join(''):'<tr><td colspan="7"><div class="empty">No hay asistencias registradas.</div></td></tr>'}</table></div>`}
async function scanAttendance(){const devs=await api('/api/qr-devices');modal('Lector QR · Asistencia',`<div class="notice">Conecta el lector QR USB/Bluetooth como teclado. Coloca el cursor en el campo y escanea la credencial; el lector normalmente envía ENTER al terminar.</div><label>Dispositivo</label><select id="qrdev"><option value="">Lector no especificado</option>${devs.filter(x=>x.active!==0).map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select><label>Matrícula / código QR</label><input id="qrscan" autofocus placeholder="Escanea aquí…"><div id="qrresult" style="margin-top:14px"></div>`, 'Cerrar', closeModal);setTimeout(()=>{const el=$('qrscan');el?.focus();if(el)el.onkeydown=async e=>{if(e.key==='Enter'){e.preventDefault();const code=el.value.trim();if(!code)return;try{const d=await api('/api/attendance/scan',{method:'POST',body:JSON.stringify({code,device_id:$('qrdev').value||null})});showAccessResult(d);el.value='';}catch(err){$('qrresult').innerHTML=`<div class="card" style="border:2px solid var(--bad)"><h2>⛔ Acceso restringido</h2><p>${esc(err.message)}</p></div>`;el.select()}}}},100)}
function showAccessResult(d){const ok=d.allowed;const s=d.student||{};$('qrresult').innerHTML=`<div class="card" style="border:2px solid ${ok?'var(--ok)':'var(--bad)'};text-align:center"><div style="font-size:48px">${ok?'✅':'⛔'}</div>${photoTag(s.photo_data,'Foto')}<h2>${ok?'Acceso permitido':'Acceso restringido'}</h2><h3>${esc(s.name||'')} ${esc(s.last_name||'')}</h3><div class="pill">${esc(s.matricula||'')}</div><p>${esc(d.reason||'')}</p><p><b>Estado:</b> ${esc(s.status||'—')}</p><p><b>Vencimiento:</b> ${esc(s.due_date||'—')}</p>${d.schedule?`<p><b>Clase:</b> ${esc(d.schedule.discipline_name||'')} · ${esc(d.schedule.group_name||'')}</p>`:''}</div>`}
async function newAttendance(){const ss=await api('/api/students'),disc=await api('/api/disciplines');modal('Registrar asistencia',`<label>Alumno</label><select id="aa">${ss.map(s=>`<option value="${s.id}">${esc(s.matricula)} · ${esc(s.name)} ${esc(s.last_name)}</option>`).join('')}</select><label>Disciplina</label><select id="ad">${activeOpts(disc,'Sin disciplina')}</select><label>Grupo</label><input id="ag"><label>Estatus</label><select id="as"><option>Presente</option><option>Retardo</option><option>Justificado</option></select><label>Fecha</label><input id="af" type="date" value="${todayLocal()}"><div id="manualAccess" class="notice" style="margin-top:12px">Al guardar se validará el estado y vencimiento del alumno.</div>`,'Guardar',async()=>{try{await api('/api/attendance',{method:'POST',body:JSON.stringify({student_id:+$('aa').value,discipline:$('ad').selectedOptions[0]?.textContent||'',group_name:$('ag').value,status:$('as').value,attended_at:$('af').value})});closeModal();toast('Asistencia registrada');attendanceAlumnos()}catch(e){$('manualAccess').innerHTML=`<b>⛔ ${esc(e.message)}</b>`}})}

async function teacherAttendance(id){const t=await api('/api/teachers/'+id);const sch=await api('/api/teachers/'+id+'/current-schedule?date='+todayLocal()+'&time='+new Date().toTimeString().slice(0,5));const hist=t.attendance||[];const history=hist.length?'<hr><h3>Historial reciente</h3><div class="tablewrap"><table class="table"><tr><th>Fecha</th><th>Entrada</th><th>Salida</th><th>Disciplina</th></tr>'+hist.map(a=>`<tr><td>${esc(a.attended_at)}</td><td>${esc(a.entry_time||'—')}</td><td>${esc(a.exit_time||'—')}</td><td>${esc(a.discipline||'')}</td></tr>`).join('')+'</table></div>':'<div class="empty">Sin asistencia registrada.</div>';modal('Asistencia de maestro',`<div class="notice"><b>${esc(t.name)} ${esc(t.last_name)}</b><br>${esc(t.matricula)} · $${(+t.rate_hour).toLocaleString('es-MX')}/hora</div>${history}<hr><h3>Registrar nueva asistencia</h3><label>Fecha</label><input id="taf" type="date" value="${todayLocal()}"><label>Disciplina de esta hora</label><input id="tad" value="${esc(sch.schedule?.discipline_name||t.discipline||'')}" readonly><div class="small muted">${sch.schedule?`Horario encontrado: ${esc(sch.schedule.start_time)}–${esc(sch.schedule.end_time)} · ${esc(sch.schedule.group_name||'')}`:'No hay horario configurado para esta hora; puedes asignarlo desde Configuración.'}</div><label>Entrada</label><input id="tae" type="time" value="${new Date().toTimeString().slice(0,5)}"><label>Salida</label><input id="tas" type="time"><label>Notas</label><input id="tan">`,'Guardar asistencia',async()=>{const d=await api('/api/teacher-attendance',{method:'POST',body:JSON.stringify({teacher_id:id,attended_at:$('taf').value,discipline:$('tad').value,entry_time:$('tae').value,exit_time:$('tas').value,notes:$('tan').value})});closeModal();toast('Asistencia registrada · '+(d.discipline||''));teachers()})}

async function promotions(){const r=await api('/api/promotions');$('content').innerHTML=`<div class="sectionhead"><h3>Promociones</h3>${user.role==='director'?'<button class="btn primary" onclick="newPromotion()">＋ Nueva promoción</button>':''}</div><div class="cards">${r.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><b>${p.discount}${p.kind==='Porcentaje'?'%':' MXN'} de descuento</b><p class="small">${p.months||1} mes(es) · cuota $${(+p.fee||0).toLocaleString('es-MX')} · ${esc(p.start_date||'Sin inicio')} → ${esc(p.end_date||p.expires_at||'Sin vencimiento')}</p><div class="muted">${p.active?'Activa':'Inactiva'}</div>${user.role==='director'?`<br><button class="btn light" onclick='editPromotion(${p.id})'>✏️ Editar</button> <button class="btn danger" onclick="removeRecord('PROMOCION',${p.id},'la promoción')">🗑 Eliminar</button>`:''}</div>`).join('')||'<div class="empty">No hay promociones.</div>'}</div>`}
function promotionForm(p={}){return `<label>Nombre</label><input id="pmn" value="${esc(p.name||'')}"><label>Descripción</label><textarea id="pmd">${esc(p.description||'')}</textarea><div class="formgrid"><div><label>Descuento</label><input id="pmi" type="number" min="0" value="${+p.discount||0}"></div><div><label>Tipo</label><select id="pmk"><option ${p.kind==='Porcentaje'?'selected':''}>Porcentaje</option><option ${p.kind==='Monto'?'selected':''}>Monto</option></select></div><div><label>Meses incluidos</label><input id="pmm" type="number" min="1" value="${+p.months||1}"></div><div><label>Cuota</label><input id="pmf" type="number" min="0" value="${+p.fee||0}"></div><div><label>Fecha de inicio</label><input id="pms" type="date" value="${esc(p.start_date||'')}"></div><div><label>Fecha de vencimiento</label><input id="pme" type="date" value="${esc(p.end_date||p.expires_at||'')}"></div></div><label>Estado</label><select id="pma"><option value="1" ${p.active!==0?'selected':''}>Activa</option><option value="0" ${p.active===0?'selected':''}>Inactiva</option></select>`}
function newPromotion(){modal('Nueva promoción',promotionForm(),'Crear',async()=>{await api('/api/promotions',{method:'POST',body:JSON.stringify({name:$('pmn').value,description:$('pmd').value,discount:Number($('pmi').value||0),kind:$('pmk').value,months:Number($('pmm').value||1),fee:Number($('pmf').value||0),start_date:$('pms').value,end_date:$('pme').value,active:Number($('pma').value)})});closeModal();toast('Promoción creada');promotions()})}
async function editPromotion(id){const p=(await api('/api/promotions')).find(x=>x.id===id);if(!p)return;modal('Editar promoción',promotionForm(p),'Guardar',async()=>{await api('/api/promotions/'+id,{method:'PUT',body:JSON.stringify({name:$('pmn').value,description:$('pmd').value,discount:Number($('pmi').value||0),kind:$('pmk').value,months:Number($('pmm').value||1),fee:Number($('pmf').value||0),start_date:$('pms').value,end_date:$('pme').value,active:Number($('pma').value)})});closeModal();toast('Promoción actualizada');promotions()})}

async function schedulesCatalog(){const [r,disc,teach]=await Promise.all([api('/api/schedules'),api('/api/disciplines'),api('/api/teachers')]);const days=['','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];modal('Horarios y grupos',`<div class="tablewrap"><table class="table"><tr><th>Día</th><th>Horario</th><th>Disciplina</th><th>Grupo</th><th>Maestro</th><th>Salón</th><th></th></tr>${r.map(x=>`<tr><td>${days[x.day_of_week]||x.day_of_week}</td><td>${esc(x.start_time)}–${esc(x.end_time)}</td><td>${esc(x.discipline_name||'')}</td><td>${esc(x.group_name)}</td><td>${esc(x.teacher_name||'')} ${esc(x.teacher_last_name||'')}</td><td>${esc(x.room)}</td><td>${user.role==='director'?`<button class="btn light" onclick="editSchedule(${x.id})">✏️ Editar</button>`:''}</td></tr>`).join('')}</table></div><br>${user.role==='director'?'<button class="btn primary" onclick="newSchedule()">＋ Nuevo horario</button>':''}`, 'Cerrar',closeModal)}
function scheduleForm(x={},disc=[],teach=[]){const days=['','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];return `<div class="formgrid"><div><label>Día</label><select id="sday">${days.slice(1).map((d,i)=>`<option value="${i+1}" ${Number(x.day_of_week)==i+1?'selected':''}>${d}</option>`).join('')}</select></div><div><label>Disciplina</label><select id="sdisc">${activeOpts(disc,'Sin disciplina')}</select></div><div><label>Maestro</label><select id="steach"><option value="">Sin maestro</option>${teach.filter(t=>t.status==='Activo').map(t=>`<option value="${t.id}">${esc(t.name)} ${esc(t.last_name)}</option>`).join('')}</select></div><div><label>Grupo</label><input id="sgrp" value="${esc(x.group_name||'')}"></div><div><label>Hora inicio</label><input id="sstime" type="time" value="${esc(x.start_time||'17:00')}"></div><div><label>Hora fin</label><input id="setime" type="time" value="${esc(x.end_time||'18:00')}"></div><div><label>Salón</label><input id="sroom" value="${esc(x.room||'')}"></div><div><label>Estado</label><select id="sactive"><option value="1" ${x.active!==0?'selected':''}>Activo</option><option value="0" ${x.active===0?'selected':''}>Inactivo</option></select></div></div>`}
async function newSchedule(){const [d,t]=await Promise.all([api('/api/disciplines'),api('/api/teachers')]);modal('Nuevo horario',scheduleForm({},d,t),'Crear',async()=>{await api('/api/schedules',{method:'POST',body:JSON.stringify({day_of_week:+$('sday').value,discipline_id:$('sdisc').value||null,teacher_id:$('steach').value||null,group_name:$('sgrp').value,start_time:$('sstime').value,end_time:$('setime').value,room:$('sroom').value,active:+$('sactive').value})});closeModal();toast('Horario creado');settings()});setTimeout(()=>{$('sdisc').value='';$('steach').value=''},0)}
async function editSchedule(id){const [r,d,t]=await Promise.all([api('/api/schedules'),api('/api/disciplines'),api('/api/teachers')]);const x=r.find(a=>a.id===id);modal('Editar horario',scheduleForm(x,d,t),'Guardar',async()=>{await api('/api/schedules/'+id,{method:'PUT',body:JSON.stringify({day_of_week:+$('sday').value,discipline_id:$('sdisc').value||null,teacher_id:$('steach').value||null,group_name:$('sgrp').value,start_time:$('sstime').value,end_time:$('setime').value,room:$('sroom').value,active:+$('sactive').value})});closeModal();toast('Horario actualizado');settings()});setTimeout(()=>{$('sdisc').value=x.discipline_id||'';$('steach').value=x.teacher_id||''},0)}
async function qrDevicesCatalog(){const r=await api('/api/qr-devices');modal('Dispositivos lectores QR',`<div class="notice">Los lectores USB/Bluetooth que funcionan como teclado no requieren un driver especial: se registran aquí para identificarlos y se seleccionan al escanear.</div>${r.map(x=>`<div class="bar"><span><b>${esc(x.name)}</b><br><small>${esc(x.device_type)} · ${esc(x.identifier||'Sin identificador')} · ${x.active?'Activo':'Inactivo'}</small></span>${user.role==='director'?`<button class="btn light" onclick="editQrDevice(${x.id})">✏️ Editar</button>`:''}</div>`).join('')}${user.role==='director'?'<br><button class="btn primary" onclick="newQrDevice()">＋ Agregar lector</button>':''}`,'Cerrar',closeModal)}

async function editPenaltyType(id){const x=(await api('/api/locker-penalty-types')).find(a=>a.id===id);modal('Editar penalización de locker',penaltyTypeForm(x),'Guardar',async()=>{await api('/api/locker-penalty-types/'+id,{method:'PUT',body:JSON.stringify({name:$('ptn').value,amount:+$('pta').value||0,description:$('ptd').value,active:+$('ptactive').value})});closeModal();toast('Penalización actualizada');settings()})}

async function lockerHistory(id){const [r,p]=await Promise.all([api('/api/lockers/'+id+'/payments'),api('/api/lockers/'+id+'/penalties')]);let body='<h3>Pagos registrados</h3>'+(r.length?'<div class="tablewrap"><table class="table"><tr><th>Fecha</th><th>Concepto</th><th>Monto</th><th>Método</th></tr>'+r.map(x=>`<tr><td>${esc(x.paid_at)}</td><td>${esc(x.concept)}</td><td>$${(+x.amount).toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td>${esc(x.method)}</td></tr>`).join('')+'</table></div>':'<div class="empty">Sin pagos.</div>');body+='<h3>Penalizaciones registradas</h3>'+(p.length?'<div class="tablewrap"><table class="table"><tr><th>Fecha</th><th>Motivo</th><th>Monto</th><th>Cobro</th><th>Método</th><th></th></tr>'+p.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.reason)}</td><td>$${(+x.amount).toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td>${x.paid?'Cobrada':'Pendiente'}</td><td>${esc(x.method||'—')}</td><td>${user?.role==='director'?`<button class="btn danger" onclick="removeRecord('PENALIZACION_LOCKER',${x.id},'la penalización')">🗑 Eliminar</button>`:''}</td></tr>`).join('')+'</table></div>':'<div class="empty">Sin penalizaciones.</div>');modal('Historial del locker',body,'Cerrar',closeModal)}

async function lockerPenalty(id){const types=await api('/api/locker-penalty-types');modal('Penalización de locker',`<label>Tipo de penalización</label><select id="lptype">${activeOpts(types,'Selecciona una penalización')}</select><label>Monto</label><input id="lpmonto" type="number" min="0" value="0"><label>Motivo / detalle</label><input id="lpreason"><label>¿Ya fue cobrada?</label><select id="lppaid"><option value="0">Pendiente</option><option value="1">Sí, cobrada</option></select><label>Método de cobro</label><select id="lpmethod">${(Array.isArray(appConfig.payment_methods)&&appConfig.payment_methods.length?appConfig.payment_methods:['Efectivo','Transferencia','Tarjeta','Otro']).map(x=>`<option>${esc(x)}</option>`).join('')}</select>`,'Registrar',async()=>{const t=types.find(x=>String(x.id)===$('lptype').value);await api('/api/lockers/'+id+'/penalty',{method:'POST',body:JSON.stringify({amount:Number($('lpmonto').value||t?.amount||0),reason:$('lpreason').value||t?.name||'Penalización',penalty_type_id:t?.id||null,paid:Number($('lppaid').value),method:$('lpmethod').value})});closeModal();toast('Penalización registrada');lockers()});setTimeout(()=>{const sel=$('lptype');sel.onchange=()=>{const t=types.find(x=>String(x.id)===sel.value);if(t)$('lpmonto').value=t.amount}},50)}

async function audit(){const r=await api('/api/audit');$('content').innerHTML='<div class="card"><div class="sectionhead"><h3>Bitácora</h3><span class="muted">El Director puede eliminar registros de la bitácora.</span></div><div class="tablewrap"><table class="table"><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Módulo</th><th>Detalle</th><th></th></tr>'+r.map(a=>`<tr><td>${esc(a.created_at)}</td><td>${esc(a.user_name)}</td><td>${esc(a.action)}</td><td>${esc(a.module)}</td><td>${esc(a.detail)}</td><td><button class="btn danger" onclick="deleteAudit(${a.id})">🗑 Eliminar</button></td></tr>`).join('')+'</table></div></div>'}
async function deleteAudit(id){if(!confirm('¿Eliminar definitivamente este registro de la bitácora? Esta acción no se puede restaurar.'))return;await api('/api/audit/'+id,{method:'DELETE'});toast('Registro de bitácora eliminado');audit()}
async function trash(){const r=await api('/api/trash');$('content').innerHTML='<div class="card"><div class="sectionhead"><h3>🗑️ Papelera</h3><span class="muted">Puedes restaurar o eliminar definitivamente.</span></div>'+r.map(x=>`<div class="bar"><span><b>${esc(x.name||x.entity_type)}</b><br><small>${esc(x.matricula||'')} · ${esc(x.entity_type)} · ${esc(x.deleted_at)}</small></span><div class="actions"><button class="btn primary" onclick="restore(${x.id})">↶ Restaurar</button><button class="btn danger" onclick="purgeTrash(${x.id})">🗑 Eliminar definitivamente</button></div></div>`).join('')||'<div class="empty">La papelera está vacía.</div>'+'</div>'}
async function purgeTrash(id){if(!confirm('¿Eliminar definitivamente este registro de la papelera? No podrá restaurarse.'))return;await api('/api/trash/'+id+'/permanent',{method:'DELETE'});toast('Registro eliminado definitivamente');trash()}

function initApp(){
  setInterval(()=>{if($('clock'))$('clock').textContent=new Date().toLocaleString('es-MX')},1000);
  document.querySelectorAll('.nav[data-v]').forEach(b=>b.onclick=()=>view(b.dataset.v));
  if(token&&user){boot()}
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initApp)}else{initApp()}
</script></body></html>
